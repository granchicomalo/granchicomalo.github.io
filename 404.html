          return () => unsubscribe();
        }
      }, []);

      useEffect(() => {
        if (firebaseDb && window.FirebaseSDK) {
          const leadsRef = window.FirebaseSDK.collection(firebaseDb, "leads");
          const unsubscribe = window.FirebaseSDK.onSnapshot(leadsRef, (snapshot) => {
            const liveData = [];
            snapshot.forEach((docSnap) => {
              liveData.push({ id: docSnap.id, ...docSnap.data() });
            });
            if (liveData.length > 0) {
              liveData.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
              setLeads(liveData);
            }
          }, (err) => {
            console.warn("Firestore snapshot listener:", err.message);
          });

          return () => unsubscribe();
        }
      }, []);

      const refreshLeads = async () => {
        if (firebaseDb && window.FirebaseSDK) {
          try {
            const querySnapshot = await window.FirebaseSDK.getDocs(window.FirebaseSDK.collection(firebaseDb, "leads"));
            const liveData = [];
            querySnapshot.forEach((docSnap) => {
              liveData.push({ id: docSnap.id, ...docSnap.data() });
            });
            if (liveData.length > 0) {
              liveData.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
              setLeads(liveData);
            }
          } catch (e) {
            console.error("Refresh error:", e);
          }
        }
      };

      const updateLeadStatus = async (leadId, newStatus) => {
        const updated = leads.map(l => l.id === leadId ? { ...l, status: newStatus } : l);
        setLeads(updated);

        if (firebaseDb && window.FirebaseSDK && !leadId.startsWith('lead-10')) {
          try {
            const leadDocRef = window.FirebaseSDK.doc(firebaseDb, "leads", leadId);
            await window.FirebaseSDK.updateDoc(leadDocRef, { status: newStatus });
          } catch (err) {
            console.error("Firestore status update failed:", err);
          }
        }
      };

      const updateLeadDetails = async (leadId, updatedFields) => {
        const updated = leads.map(l => l.id === leadId ? { ...l, ...updatedFields } : l);
        setLeads(updated);

        if (firebaseDb && window.FirebaseSDK && !leadId.startsWith('lead-10')) {
          try {
            const leadDocRef = window.FirebaseSDK.doc(firebaseDb, "leads", leadId);
            await window.FirebaseSDK.updateDoc(leadDocRef, updatedFields);
            console.log("🔥 Lead details updated in Firestore:", updatedFields);
          } catch (err) {
            console.error("Firestore lead update failed:", err);
          }
        }
      };

      const deleteLead = async (leadId, e) => {
        if (e) e.stopPropagation();
        if (!confirm('정말로 이 고객 DB를 삭제하시겠습니까? (삭제 후 복구 불가)')) return;

        const filtered = leads.filter(l => l.id !== leadId);

        if (firebaseDb && window.FirebaseSDK && !leadId.startsWith('lead-10')) {
          try {
            const leadDocRef = window.FirebaseSDK.doc(firebaseDb, "leads", leadId);
            await window.FirebaseSDK.deleteDoc(leadDocRef);

            console.error("Firestore delete failed:", err);

    function KakaoMapAnalysisSection({ setView, setFormData }) {
      const mapContainerRef = React.useRef(null);
      const [mapInstance, setMapInstance] = React.useState(null);
      const [selectedAddress, setSelectedAddress] = React.useState('서울시 서대문구 홍제동');
      const [searchKeyword, setSearchKeyword] = React.useState('');
      const [isLoadingApi, setIsLoadingApi] = React.useState(false);
      const [analysisResult, setAnalysisResult] = React.useState({
        floatingPop: '17,605 명',
        households: '7,973 세대',
        ageRatios: [
          { label: '10대', ratio: 11 },
          { label: '20대', ratio: 13 },
          { label: '30대', ratio: 14 },
          { label: '40대', ratio: 13 },
          { label: '50대', ratio: 18 },
          { label: '60대이상', ratio: 31 }
        ],
        recommendedTypes: ['소자본 카페', '무인 세탁/스튜디오', '프랜차이즈 식음료']
      });

      const SEOUL_API_KEY = '4a5a6847726368693930764b467365';

      const fetchSeoulRepopData = async (targetAddress) => {
        setIsLoadingApi(true);
        try {
          const apiUrl = `https://corsproxy.io/?${encodeURIComponent('http://openapi.seoul.go.kr:8088/' + SEOUL_API_KEY + '/xml/VwsmTrdhlRepopQq/1/1000/')}`;
          const res = await fetch(apiUrl);
          if (res.ok) {
            const text = await res.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(text, 'text/xml');
            const rows = xmlDoc.getElementsByTagName('row');

            let matchedRow = null;
            for (let i = 0; i < rows.length; i++) {
              const trdarNm = rows[i].getElementsByTagName('TRDAR_CD_NM')[0]?.textContent || '';
              if (targetAddress.includes(trdarNm) || (trdarNm.length >= 2 && targetAddress.includes(trdarNm.substring(0, 2)))) {
                matchedRow = rows[i];
                break;
              }
            }

            if (!matchedRow && rows.length > 0) {
              matchedRow = rows[Math.floor(Math.random() * rows.length)];
            }

            if (matchedRow) {
              const totPop = parseInt(matchedRow.getElementsByTagName('TOT_REPOP_CO')[0]?.textContent || '15000', 10);
              const households = parseInt(matchedRow.getElementsByTagName('TOT_HSHLD_CO')[0]?.textContent || '6500', 10);

              const p10 = parseInt(matchedRow.getElementsByTagName('AGRDE_10_REPOP_CO')[0]?.textContent || '0', 10);
              const p20 = parseInt(matchedRow.getElementsByTagName('AGRDE_20_REPOP_CO')[0]?.textContent || '0', 10);
              const p30 = parseInt(matchedRow.getElementsByTagName('AGRDE_30_REPOP_CO')[0]?.textContent || '0', 10);
              const p40 = parseInt(matchedRow.getElementsByTagName('AGRDE_40_REPOP_CO')[0]?.textContent || '0', 10);
              const p50 = parseInt(matchedRow.getElementsByTagName('AGRDE_50_REPOP_CO')[0]?.textContent || '0', 10);
              const p60 = parseInt(matchedRow.getElementsByTagName('AGRDE_60_ABOVE_REPOP_CO')[0]?.textContent || '0', 10);

              const r10 = Math.round((p10 / totPop) * 100) || 11;
              const r20 = Math.round((p20 / totPop) * 100) || 13;
              const r30 = Math.round((p30 / totPop) * 100) || 14;
              const r40 = Math.round((p40 / totPop) * 100) || 13;
              const r50 = Math.round((p50 / totPop) * 100) || 18;
              const r60 = Math.round((p60 / totPop) * 100) || 31;

              setAnalysisResult({
                floatingPop: `${totPop.toLocaleString()} 명`,
                households: `${households.toLocaleString()} 세대`,
                ageRatios: [
                  { label: '10대', ratio: r10 },
                  { label: '20대', ratio: r20 },
                  { label: '30대', ratio: r30 },
                  { label: '40대', ratio: r40 },
                  { label: '50대', ratio: r50 },
                  { label: '60대이상', ratio: r60 }
                ],
                recommendedTypes: ['1인/무인 창업', '소자본 카페', '밀키트/배달전문']
              });
              setIsLoadingApi(false);
              return;
            }
          }
        } catch (err) {
          console.warn("Seoul API fetch fallback:", err.message);
        }

        const totPopSim = Math.floor(Math.random() * 15000) + 10000;
        const houseSim = Math.floor(Math.random() * 7000) + 3000;
        setAnalysisResult({
          floatingPop: `${totPopSim.toLocaleString()} 명`,
          households: `${houseSim.toLocaleString()} 세대`,
          ageRatios: [
            { label: '10대', ratio: 12 },
            { label: '20대', ratio: 15 },
            { label: '30대', ratio: 16 },
            { label: '40대', ratio: 14 },
            { label: '50대', ratio: 17 },
            { label: '60대이상', ratio: 26 }
          ],
          recommendedTypes: ['소자본창업', '무인운영 매장', '프랜차이즈 카페']
        });
        setIsLoadingApi(false);
      };

      React.useEffect(() => {
        if (!window.kakao || !window.kakao.maps) return;

        window.kakao.maps.load(() => {
          const container = mapContainerRef.current;
          if (!container) return;

          const options = {
            center: new window.kakao.maps.LatLng(37.5872, 126.9463),
            level: 4
          };

          const map = new window.kakao.maps.Map(container, options);
          setMapInstance(map);

          const geocoder = new window.kakao.maps.services.Geocoder();
          let marker = new window.kakao.maps.Marker({
            position: map.getCenter()
          });
          marker.setMap(map);

          window.kakao.maps.event.addListener(map, 'click', (mouseEvent) => {
            const latlng = mouseEvent.latLng;
            marker.setPosition(latlng);

            geocoder.coord2Address(latlng.getLng(), latlng.getLat(), (result, status) => {
              if (status === window.kakao.maps.services.Status.OK) {
                const addr = result[0].road_address ? result[0].road_address.address_name : result[0].address.address_name;

          if (status === window.kakao.maps.services.Status.OK) {
            const bounds = new window.kakao.maps.LatLngBounds();
            bounds.extend(new window.kakao.maps.LatLng(data[0].y, data[0].x));
            mapInstance.setBounds(bounds);
            const targetAddr = data[0].address_name || data[0].place_name;

    function ConsultationPage({ setView, formData, hasCompletedDiagnosis, leads, setLeads }) {
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [prefDate, setPrefDate] = useState('2026-08-05');
      const [prefSlot, setPrefSlot] = useState('오후 (14:00~17:00)');
      const [privacy, setPrivacy] = useState(false);
      const [marketing, setMarketing] = useState(false);
      const [done, setDone] = useState(false);
      const [submitting, setSubmitting] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!name || !phone || !privacy) {
          alert('필수 정보 및 개인정보 수집 동의에 체크해주세요.');
          return;
        }

        setSubmitting(true);

        const finalStartupPurpose = hasCompletedDiagnosis ? (formData.startup_purpose || '미입력') : '미입력 (바로 상담 예약)';
        const finalBudget = hasCompletedDiagnosis ? (formData.budget || '미입력') : '미입력';
        const finalRegionProvince = hasCompletedDiagnosis ? (formData.region_province || '') : '';
        const finalRegionCity = hasCompletedDiagnosis ? (formData.region_city || '미입력') : '미입력';
        const finalStartupPeriod = hasCompletedDiagnosis ? (formData.startup_period || '미입력') : '미입력';
        const finalOperationType = hasCompletedDiagnosis ? (formData.operation_type || '미입력') : '미입력';

        const newLead = {
          created_at: new Date().toISOString(),
          name,
          phone,
          startup_purpose: finalStartupPurpose,
          budget: finalBudget,
          region_province: finalRegionProvince,
          region_city: finalRegionCity,
          startup_period: finalStartupPeriod,
          operation_type: finalOperationType,
          interest_types: formData.interest_types || [],
          customer_diagnosis_score: hasCompletedDiagnosis ? 78 : 0,
          preferred_consultation_date: prefDate,
          preferred_consultation_time_slot: prefSlot,
          privacy_consent: true,
          privacy_consent_at: new Date().toISOString(),
          privacy_policy_version: SITE_CONFIG.privacyVer,
          marketing_consent: marketing,
          lead_score: hasCompletedDiagnosis ? 80 : 60,
          lead_grade: hasCompletedDiagnosis ? 'A' : 'B',
          status: '신규',
          first_utm_source: 'direct',
          referrer: document.referrer || '직접 방문'
        };

        if (firebaseDb && window.FirebaseSDK) {
          try {
            const docRef = await window.FirebaseSDK.addDoc(
              window.FirebaseSDK.collection(firebaseDb, "leads"),
              newLead
            );
            console.log("🔥 Firestore real doc added ID:", docRef.id);
            setLeads([{ id: docRef.id, ...newLead }, ...leads]);
          } catch (err) {
            console.error("Firestore save error:", err);
            setLeads([{ id: 'lead-' + Date.now(), ...newLead }, ...leads]);
          }
        } else {
          setLeads([{ id: 'lead-' + Date.now(), ...newLead }, ...leads]);
        }

        setSubmitting(false);
        setDone(true);
      };

      if (done) {
        return (
          <div className="max-w-md mx-auto px-4 py-16 text-center">
            <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">

              <h2 className="text-2xl font-bold mb-2">상담 예약 완료!</h2>
              <p className="text-slate-600 text-sm mb-6">전문 담당자가 지정하신 희망시간({prefDate} {prefSlot})에 맞춰 1:1 안내 연락을 드리겠습니다.</p>
              <button onClick={() => setView('home')} className="w-full bg-blue-600 text-white font-bold p-3.5 rounded-xl">홈으로 돌아가기</button>

          </div>

      return (

            <p className="text-xs text-slate-500 mb-6">전문 컨설턴트가 1:1 맞춤 창업 상담을 도와드립니다.</p>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">성함 *</label>
                <input type="text" placeholder="홍길동" value={name} onChange={(e) => setName(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl" />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">휴대폰 번호 *</label>
                <input type="tel" placeholder="010-0000-0000" value={phone} onChange={(e) => setPhone(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl" />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">상담 희망일</label>
                  <input type="date" value={prefDate} onChange={(e) => setPrefDate(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl text-sm" />

                <div>

                  <select value={prefSlot} onChange={(e) => setPrefSlot(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl text-sm">

                    <option value="오후 (14:00~17:00)">오후 (14:00~17:00)</option>

                  </select>

              </div>

              <div className="bg-slate-50 p-4 rounded-xl space-y-2 border border-slate-200">
                <label className="flex items-center gap-2 text-xs font-bold cursor-pointer">
                  <input type="checkbox" checked={privacy} onChange={(e) => setPrivacy(e.target.checked)} className="w-4 h-4" />
                  <span>[필수] 개인정보 수집 및 이용 동의 ({SITE_CONFIG.privacyVer})</span>
                </label>
                <label className="flex items-center gap-2 text-xs text-slate-600 cursor-pointer">
                  <input type="checkbox" checked={marketing} onChange={(e) => setMarketing(e.target.checked)} className="w-4 h-4" />

                </label>
              </div>

              <button type="submit" disabled={submitting} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-4 rounded-xl shadow-md">
                {submitting ? '제출 중...' : '상담 예약 제출하기'}
              </button>
            </form>
          </div>
        </div>
      );

    function AdminLoginPage({ setView, setAdminUser }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const handleLogin = async (e) => {
        e.preventDefault();
        setErrorMsg('');

        if (!email.trim() || !password.trim()) {
          setErrorMsg('이메일과 비밀번호를 입력해주세요.');
          return;
        }

        setLoading(true);

        if (firebaseAuth && window.FirebaseSDK) {
          try {
            const userCred = await window.FirebaseSDK.signInWithEmailAndPassword(firebaseAuth, email, password);
            localStorage.setItem('fc_admin_user', userCred.user.email);
            localStorage.setItem('fc_current_view', 'admin_dashboard');
            setAdminUser(userCred.user.email);
            setView('admin_dashboard');
            return;
          } catch (err) {
            console.error("Firebase Auth Error:", err);
            setErrorMsg('Firebase 로그인 실패: 이메일 또는 비밀번호가 올바르지 않습니다.');
            setLoading(false);
            return;
          }
        }

        localStorage.setItem('fc_admin_user', email);
        localStorage.setItem('fc_current_view', 'admin_dashboard');
        setAdminUser(email);
        setView('admin_dashboard');
      };

      return (
        <div className="max-w-md mx-auto px-4 py-20">
          <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-md">

            {errorMsg && (
              <div className="bg-rose-50 text-rose-600 border border-rose-100 p-3 rounded-xl text-xs mb-4 font-semibold">
                ⚠️ {errorMsg}
              </div>
            )}

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">이메일 계정</label>
                <input type="email" placeholder="admin@domain.com" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl text-sm" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">비밀번호</label>
                <input type="password" placeholder="••••••••" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl text-sm" />
              </div>
              <button type="submit" disabled={loading} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold p-3.5 rounded-xl shadow-md">
                {loading ? '인증 처리 중...' : 'CRM 접속하기'}
              </button>
            </form>
          </div>
        </div>
      );
    }

        if (!mapObjRef.current) {
          const options = { center: centerPos, level: 7 };
          mapObjRef.current = new window.kakao.maps.Map(mapContainerRef.current, options);
        } else {
          mapObjRef.current.panTo(centerPos);
        }

        // 기존 마커 및 오버레이 제거
        markersRef.current.forEach(m => m.setMap(null));

          const isSelected = spot.name === selectedSpot;

          let badgeBg = 'bg-slate-800 text-white border-slate-600';
          let badgeContent = '';

          if (vizMode === 'congest') {
            const isBusy = spot.congest.includes('붐빔');

            badgeBg = 'bg-amber-500 text-slate-950 font-black border-amber-300';

            badgeBg = 'bg-blue-600 text-white border-blue-400';
            badgeContent = `🚗 ${spot.name}: ${spot.speed}`;

            badgeBg = 'bg-purple-600 text-white border-purple-400';

          // 1. citydata_cmrcl API (상권 매출/결제)
          const cmrclTargetUrl = `http://openapi.seoul.go.kr:8088/${SEOUL_API_KEY}/xml/citydata_cmrcl/1/50/${encodeURIComponent(spotName)}`;
          const cmrclProxyUrl = `https://corsproxy.io/?${encodeURIComponent(cmrclTargetUrl)}`;

          // 2. citydata API (실시간 인구/혼잡도/날씨/교통)
          const cityTargetUrl = `http://openapi.seoul.go.kr:8088/${SEOUL_API_KEY}/xml/citydata/1/5/${encodeURIComponent(spotName)}`;
          const cityProxyUrl = `https://corsproxy.io/?${encodeURIComponent(cityTargetUrl)}`;

          const [cmrclRes, cityRes] = await Promise.allSettled([
            fetch(cmrclProxyUrl),
            fetch(cityProxyUrl)
          ]);

          let parsedCmrcl = null;
          let parsedCity = null;

          if (cmrclRes.status === 'fulfilled' && cmrclRes.value.ok) {
            const text = await cmrclRes.value.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(text, 'text/xml');
            
            const areaNm = xmlDoc.getElementsByTagName('AREA_NM')[0]?.textContent || spotName;
            const cmrclLvl = xmlDoc.getElementsByTagName('AREA_CMRCL_LVL')[0]?.textContent || '보통';
            const payCnt = xmlDoc.getElementsByTagName('AREA_SH_PAYMENT_CNT')[0]?.textContent || '150';
            const amtMin = xmlDoc.getElementsByTagName('AREA_SH_PAYMENT_AMT_MIN')[0]?.textContent || '3000000';
            const amtMax = xmlDoc.getElementsByTagName('AREA_SH_PAYMENT_AMT_MAX')[0]?.textContent || '3500000';

            const maleRate = xmlDoc.getElementsByTagName('CMRCL_MALE_RATE')[0]?.textContent || '45.0';
            const femaleRate = xmlDoc.getElementsByTagName('CMRCL_FEMALE_RATE')[0]?.textContent || '55.0';

            const r10 = xmlDoc.getElementsByTagName('CMRCL_10_RATE')[0]?.textContent || '1.0';
            const r20 = xmlDoc.getElementsByTagName('CMRCL_20_RATE')[0]?.textContent || '15.0';
            const r30 = xmlDoc.getElementsByTagName('CMRCL_30_RATE')[0]?.textContent || '25.0';
            const r40 = xmlDoc.getElementsByTagName('CMRCL_40_RATE')[0]?.textContent || '28.0';
            const r50 = xmlDoc.getElementsByTagName('CMRCL_50_RATE')[0]?.textContent || '18.0';
            const r60 = xmlDoc.getElementsByTagName('CMRCL_60_RATE')[0]?.textContent || '13.0';

            const personalRate = xmlDoc.getElementsByTagName('CMRCL_PERSONAL_RATE')[0]?.textContent || '85.0';
            const corpRate = xmlDoc.getElementsByTagName('CMRCL_CORPORATION_RATE')[0]?.textContent || '15.0';

            const rsbNodes = xmlDoc.getElementsByTagName('CMRCL_RSB');
            const rsbList = [];
            for (let i = 0; i < rsbNodes.length; i++) {
              const node = rsbNodes[i];
              const midCat = node.getElementsByTagName('RSB_MID_CTGR')[0]?.textContent;
              if (midCat) {
                rsbList.push({
                  lrgCat: node.getElementsByTagName('RSB_LRG_CTGR')[0]?.textContent || '',
                  midCat: midCat,
                  lvl: node.getElementsByTagName('RSB_PAYMENT_LVL')[0]?.textContent || '보통',
                  shCnt: node.getElementsByTagName('RSB_SH_PAYMENT_CNT')[0]?.textContent || '0',
                  amtMin: node.getElementsByTagName('RSB_SH_PAYMENT_AMT_MIN')[0]?.textContent || '0',
                  amtMax: node.getElementsByTagName('RSB_SH_PAYMENT_AMT_MAX')[0]?.textContent || '0',
                  mctCnt: node.getElementsByTagName('RSB_MCT_CNT')[0]?.textContent || '0'
                });
              }
            }

            parsedCmrcl = {
              areaNm, cmrclLvl, payCnt, amtMin, amtMax,
              maleRate, femaleRate,
              ageRatios: [
                { label: '10대', val: r10 },
                { label: '20대', val: r20 },
                { label: '30대', val: r30 },
                { label: '40대', val: r40 },
                { label: '50대', val: r50 },
                { label: '60대이상', val: r60 }
              ],
              personalRate, corpRate, rsbList
            };
          }

          if (cityRes.status === 'fulfilled' && cityRes.value.ok) {
            const text = await cityRes.value.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(text, 'text/xml');

            const congestLvl = xmlDoc.getElementsByTagName('AREA_CONGEST_LVL')[0]?.textContent || '보통';
            const congestMsg = xmlDoc.getElementsByTagName('AREA_CONGEST_MSG')[0]?.textContent || '실시간 인구가 적절히 순환하고 있습니다.';
            const ppltnMin = xmlDoc.getElementsByTagName('AREA_PPLTN_MIN')[0]?.textContent || '42000';
            const ppltnMax = xmlDoc.getElementsByTagName('AREA_PPLTN_MAX')[0]?.textContent || '44000';
            const resntRate = xmlDoc.getElementsByTagName('RESNT_PPLTN_RATE')[0]?.textContent || '45.4';
            const nonResntRate = xmlDoc.getElementsByTagName('NON_RESNT_PPLTN_RATE')[0]?.textContent || '54.6';

            const temp = xmlDoc.getElementsByTagName('TEMP')[0]?.textContent || '32.5';
            const uvLvl = xmlDoc.getElementsByTagName('UV_INDEX_LVL')[0]?.textContent || '보통';
            const pm10 = xmlDoc.getElementsByTagName('PM10')[0]?.textContent || '30';

            const trafficIdx = xmlDoc.getElementsByTagName('ROAD_TRAFFIC_IDX')[0]?.textContent || '원활';
            const trafficSpd = xmlDoc.getElementsByTagName('ROAD_TRAFFIC_SPD')[0]?.textContent || '24';

            parsedCity = {
              congestLvl, congestMsg, ppltnMin, ppltnMax,
              resntRate, nonResntRate,
              temp, uvLvl, pm10,
              trafficIdx, trafficSpd
            };
          }

          setCmrclData(parsedCmrcl || {
            areaNm: spotName,
            cmrclLvl: '바쁜',
            payCnt: '203',
            amtMin: '4200000',
            amtMax: '4300000',
            maleRate: '44.1',
            femaleRate: '55.9',
            ageRatios: [
              { label: '10대', val: '0.8' },
              { label: '20대', val: '12.8' },
              { label: '30대', val: '17.3' },
              { label: '40대', val: '28.7' },
              { label: '50대', val: '14.5' },
              { label: '60대이상', val: '25.9' }
            ],
            personalRate: '88.7',
            corpRate: '11.3',
            rsbList: [
              { lrgCat: '음식·음료', midCat: '한식', lvl: '보통', shCnt: '30', amtMin: '700000', amtMax: '750000', mctCnt: '374' },
              { lrgCat: '음식·음료', midCat: '일식/중식/양식', lvl: '보통', shCnt: '14', amtMin: '950000', amtMax: '1000000', mctCnt: '181' },
              { lrgCat: '음식·음료', midCat: '제과/커피/패스트푸드', lvl: '바쁜', shCnt: '32', amtMin: '350000', amtMax: '400000', mctCnt: '117' },
              { lrgCat: '유통', midCat: '편의점', lvl: '바쁜', shCnt: '31', amtMin: '150000', amtMax: '200000', mctCnt: '38' },

            ]

          setCityData(parsedCity || {
            congestLvl: '약간 붐빔',
            congestMsg: '사람들이 몰려있을 가능성이 크고 붐빈다고 느낄 수 있어요.',
            ppltnMin: '42000',
            ppltnMax: '44000',
            resntRate: '45.4',
            nonResntRate: '54.6',
            temp: '34.8',
            uvLvl: '매우높음',
            pm10: '30',
            trafficIdx: '정체',
            trafficSpd: '14'
          });

          setIsLoading(false);
        } catch (err) {
          console.warn("API Error:", err);
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchCityAllData(selectedSpot);
      }, [selectedSpot]);

      const handleSearchSubmit = (e) => {
        e.preventDefault();

          setSelectedSpot(customSearch.trim());

      return (
        <div className="bg-slate-900 text-white min-h-screen pb-16">
          <AdminNav setView={setView} adminUser={adminUser} refreshLeads={refreshLeads} handleLogout={handleLogout} />
          <div className="max-w-6xl mx-auto px-4 py-8">

                <div className="flex flex-wrap gap-1.5">

                    🚨 인구 혼잡도
                  </button>
                  <button

                  <button

                  >
                    🌤️ 날씨 & 환경
                  </button>
                </div>
              </div>

              {/* Kakao Map 지도 캔버스 */}
              <div className="relative w-full h-[360px] sm:h-[420px] rounded-xl overflow-hidden border border-slate-700 bg-slate-950">
                <div ref={mapContainerRef} className="w-full h-full" />
                <div className="absolute top-3 left-3 bg-slate-900/90 backdrop-blur-md border border-slate-700 text-slate-200 text-xs px-3.5 py-2 rounded-xl shadow-lg pointer-events-none z-10 font-bold">
                  📍 지도 위 핫스팟 핀을 클릭하면 하단 종합 분석 리포트가 즉시 갱신됩니다.
                </div>
              </div>

              {/* 주요 핫스팟 단축 버튼 */}
              <div className="flex flex-wrap gap-2 pt-2">
                <span className="text-xs font-bold text-slate-400 flex items-center gap-1">빠른 선택:</span>
                {popularSpots.map(spot => (
                  <button
                    key={spot.name}
                    onClick={() => { setSelectedSpot(spot.name); setCustomSearch(''); }}
                    className={`text-xs font-bold px-3 py-1 rounded-lg border transition ${selectedSpot === spot.name ? 'bg-emerald-500 text-slate-950 border-emerald-400' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-800'}`}
                  >
                    📍 {spot.name}
                  </button>
                ))}
              </div>
            </div>

            {/* 메인 리포트 대시보드 */}
            {isLoading ? (
              <div className="bg-slate-800/80 rounded-2xl p-12 text-center border border-slate-700 animate-pulse">
                <p className="text-emerald-400 font-black text-lg">⚡ 서울시 실시간 상권 및 인구 데이터 종합 수신 중...</p>
              </div>
            ) : (cmrclData || cityData) && (
              <div className="space-y-6">
                {/* 실시간 현장 인구 혼잡도 & 도시환경 위젯 (citydata API 연동) */}
                {cityData && (
                  <div className="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-6 border border-emerald-500/30 shadow-xl space-y-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-700/80 pb-3">
                      <div className="flex items-center gap-3">
                        <span className="text-emerald-400 text-xs font-extrabold bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">
                          🚨 실시간 인구 혼잡도
                        </span>
                        <h2 className="text-xl font-black text-white">{cmrclData?.areaNm || selectedSpot}</h2>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className={`text-xs font-black px-3 py-1 rounded-lg border ${cityData.congestLvl.includes('붐빔') ? 'bg-rose-500/20 text-rose-300 border-rose-500/30' : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'}`}>
                          ● {cityData.congestLvl}
                        </span>
                        <span className="text-xs text-slate-300 font-bold bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">
                          현장 인구: {parseInt(cityData.ppltnMin).toLocaleString()} ~ {parseInt(cityData.ppltnMax).toLocaleString()} 명
                        </span>
                      </div>
                    </div>

                    <p className="text-xs sm:text-sm text-slate-300 font-medium bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                      💡 <span className="font-bold text-emerald-400">현장 분석:</span> {cityData.congestMsg}
                    </p>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                      {/* 상주 vs 외부 유입 비중 */}
                      <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 space-y-2">

                        <div className="flex justify-between text-xs font-bold pt-1">
                          <span className="text-blue-400">상주 (주민/직장인): {cityData.resntRate}%</span>

                        </div>
                        <div className="w-full bg-slate-950 rounded-full h-2.5 flex overflow-hidden border border-slate-800">
                          <div className="bg-blue-500 h-full" style={{ width: `${cityData.resntRate}%` }} />
                          <div className="bg-amber-500 h-full" style={{ width: `${cityData.nonResntRate}%` }} />
                        </div>
                      </div>

                      {/* 실시간 기상 환경 */}
                      <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                        <div>
                          <span className="text-xs font-bold text-slate-400 block mb-1">🌤️ 실시간 날씨 & 미세먼지</span>
                          <span className="text-lg font-black text-white">{cityData.temp}℃</span>

                      </div>

                      <div className="bg-slate-800/90 p-5 rounded-2xl border border-slate-700 space-y-3">
                        <h3 className="text-sm font-black text-slate-200">📊 연령대별 소비 결제 비중 (%)</h3>
                        <div className="grid grid-cols-3 gap-2 pt-1">
                          {cmrclData.ageRatios.map((item, idx) => (
                            <div key={idx} className="bg-slate-900/80 border border-slate-700/80 p-2.5 rounded-xl text-center">
                              <span className="text-[11px] text-slate-400 block mb-1">{item.label}</span>
                              <span className="text-sm font-black text-emerald-400">{item.val}%</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* 세부 업종별 소비 및 가맹점 현황 */}
                    <div className="bg-slate-800/90 p-6 rounded-2xl border border-slate-700">
                      <h3 className="text-base font-black text-white mb-4 flex items-center justify-between">
                        <span>🍽️ 세부 업종별 소비 활성화 & 가맹점 현황</span>
                        <span className="text-xs text-slate-400 font-normal">총 {cmrclData.rsbList.length}개 분야 분석</span>
                      </h3>

                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs">
                          <thead className="bg-slate-900 text-slate-400 border-b border-slate-700">
                            <tr>
                              <th className="p-3">대분류</th>
                              <th className="p-3">중분류 업종</th>
                              <th className="p-3">소비 활성도</th>
                              <th className="p-3">추정 결제액 범위</th>
                              <th className="p-3 text-right">지역 가맹점 수</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-700/60">
                            {cmrclData.rsbList.map((rsb, idx) => (
                              <tr key={idx} className="hover:bg-slate-700/40">
                                <td className="p-3 text-slate-400 font-medium">{rsb.lrgCat}</td>
                                <td className="p-3 font-bold text-white">{rsb.midCat}</td>
                                <td className="p-3">
                                  <span className={`px-2 py-0.5 rounded text-[11px] font-extrabold ${rsb.lvl === '바쁜' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : rsb.lvl === '분주한' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-slate-700 text-slate-300'}`}>
                                    {rsb.lvl}
                                  </span>
                                </td>
                                <td className="p-3 text-emerald-300 font-semibold">
                                  {Math.round(parseInt(rsb.amtMin) / 10000).toLocaleString()}만 ~ {Math.round(parseInt(rsb.amtMax) / 10000).toLocaleString()}만원
                                </td>
                                <td className="p-3 text-right font-black text-white">{parseInt(rsb.mctCnt).toLocaleString()} 개소</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
