  <script>
    window.onerror = function(message, source, lineno, colno, error) {

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SITE_CONFIG = {
      brandName: "프랜차이즈 창업 진단센터",
      privacyVer: "v1.0 (2026.08.01)",
      marketingVer: "v1.0 (2026.08.01)",
      govSupportLink: "https://www.sbiz24.kr/#/combinePbancList",
      ftcDisclosureLink: "https://franchise.ftc.go.kr/mnu/00013/program/userRqst/list.do"
    };

    const firebaseConfig = {
      apiKey: "AIzaSyC92WWIaye1nZKW6s3gg6RAf-ODjEJ4Xec",
      authDomain: "franchise-lead-b1c73.firebaseapp.com",
      projectId: "franchise-lead-b1c73",
      storageBucket: "franchise-lead-b1c73.firebasestorage.app",
      messagingSenderId: "259891790262",
      appId: "1:259891790262:web:87caa36c126852ae1f4117",
      measurementId: "G-FNLS5Z087P"
    };

    let firebaseAuth = null;
    let firebaseDb = null;

    if (window.FirebaseSDK) {
      try {
        const app = window.FirebaseSDK.initializeApp(firebaseConfig);
        firebaseAuth = window.FirebaseSDK.getAuth(app);
        firebaseDb = window.FirebaseSDK.getFirestore(app);
      } catch (e) {
        console.warn("Firebase status:", e.message);
      }
    }

    const INITIAL_LEADS = [];

    // Data adapters for new scoring engine
    const DB = window.industryDatabase;
    const ScoringEngine = window.DiagnosisScoringEngine;

    // Group industry_master by major_name -> middle_name -> small_name (or just major_name -> small_name)
    const groupedIndustries = {};
    if (DB && DB.industry_master) {
      DB.industry_master.forEach(item => {
        if (!groupedIndustries[item.major_name]) {
          groupedIndustries[item.major_name] = [];
        }
        groupedIndustries[item.major_name].push({ id: item.small_code, name: item.small_name });
      });
      
      // Extended items group removed as requested
    }



    const STATUS_OPTIONS = [
      '신규',
      '상담예정',
      '상담완료',
      '미팅예정',
      '미팅완료',
      '계약진행',
      '계약완료',
      '비가망',
      '유예/보류',
      '이탈/거절'
    ];

    function StatusSelect({ value, onChange, className = "" }) {
      const currentVal = value || '신규';

      let dynamicStyle = "bg-white text-slate-800 border-slate-300 font-semibold";
      if (currentVal === '신규') {
        dynamicStyle = "bg-blue-600 text-white border-blue-500 font-black shadow ring-2 ring-blue-300";
      } else if (currentVal === '계약완료') {
        dynamicStyle = "bg-emerald-100 text-emerald-900 border-emerald-400 font-extrabold";
      } else if (currentVal === '이탈/거절') {
        dynamicStyle = "bg-rose-100 text-rose-900 border-rose-400 font-extrabold";
      } else if (currentVal === '상담예정' || currentVal === '상담완료') {
        dynamicStyle = "bg-indigo-50 text-indigo-900 border-indigo-300 font-bold";
      } else if (currentVal === '미팅예정' || currentVal === '미팅완료') {
        dynamicStyle = "bg-purple-50 text-purple-900 border-purple-300 font-bold";
      } else if (currentVal === '계약진행') {
        dynamicStyle = "bg-amber-50 text-amber-900 border-amber-300 font-bold";
      } else if (currentVal === '비가망' || currentVal === '유예/보류') {
        dynamicStyle = "bg-slate-100 text-slate-700 border-slate-300 font-medium";
      }

      return (
        <select
          value={currentVal}
          onChange={onChange}
          className={`p-1.5 border rounded-lg text-xs cursor-pointer focus:outline-none transition ${dynamicStyle} ${className}`}
        >
          <option value="신규" className="bg-white text-blue-600 font-bold">✨ 신규</option>
          <option disabled className="font-extrabold text-slate-400 bg-slate-100">[통화]</option>
          <option value="상담예정" className="bg-white text-slate-800">&nbsp;&nbsp;상담예정</option>
          <option value="상담완료" className="bg-white text-slate-800">&nbsp;&nbsp;상담완료</option>
          <option disabled className="font-extrabold text-slate-400 bg-slate-100">[대면]</option>
          <option value="미팅예정" className="bg-white text-slate-800">&nbsp;&nbsp;미팅예정</option>
          <option value="미팅완료" className="bg-white text-slate-800">&nbsp;&nbsp;미팅완료</option>
          <option disabled className="font-extrabold text-slate-400 bg-slate-100">[계약]</option>
          <option value="계약진행" className="bg-white text-slate-800">&nbsp;&nbsp;계약진행</option>
          <option value="계약완료" className="bg-white text-emerald-700 font-bold">&nbsp;&nbsp;계약완료</option>
          <option disabled className="font-extrabold text-slate-400 bg-slate-100">[비대상]</option>
          <option value="비가망" className="bg-white text-slate-800">&nbsp;&nbsp;비가망</option>
          <option value="유예/보류" className="bg-white text-slate-800">&nbsp;&nbsp;유예/보류</option>
          <option value="이탈/거절" className="bg-white text-rose-600 font-bold">&nbsp;&nbsp;이탈/거절</option>
        </select>
      );
    }

    const INITIAL_FORM_DATA = {
      startup_purpose: '',
      budget: '',
      region_province: '',
      region_city: '',
      region_detail: '',
      startup_period: '',
      operation_type: '',
      interest_types: []
    };

    function App() {
      const [adminUser, setAdminUser] = useState(() => {
        return localStorage.getItem('fc_admin_user') || sessionStorage.getItem('fc_admin_user') || '';
      });

      const getInitialView = () => {
        const savedView = localStorage.getItem('fc_current_view');
        const path = window.location.pathname;
        const savedUser = localStorage.getItem('fc_admin_user') || sessionStorage.getItem('fc_admin_user');

        if (path.includes('diagnosis')) return 'diagnosis';
        if (path.includes('result')) return 'result';
        if (path.includes('consultation')) return 'consultation';
        if (path.includes('admin/login')) return 'admin_login';
        if (path.includes('admin/dashboard')) return 'admin_dashboard';
        if (path.includes('admin/leads')) return 'admin_leads';
        if (path.includes('admin/funnel')) return 'admin_funnel';
        
        if (savedUser && savedView && savedView.startsWith('admin_') && savedView !== 'admin_detail') {
          return savedView;
        }

        return 'home';
      };

      const [view, setView] = useState(getInitialView);

      const changeView = (newView) => {
        setView(newView);
        localStorage.setItem('fc_current_view', newView);
      };

      const [hasCompletedDiagnosis, setHasCompletedDiagnosis] = useState(false);
      const [formData, setFormData] = useState(INITIAL_FORM_DATA);

      const handleGoHome = () => {
        setFormData(INITIAL_FORM_DATA);
        setHasCompletedDiagnosis(false);
        changeView('home');
      };

      const [leads, setLeads] = useState(INITIAL_LEADS);
      const [selectedLeadId, setSelectedLeadId] = useState(null);

      useEffect(() => {
        if (firebaseAuth && window.FirebaseSDK) {
          const unsubscribe = window.FirebaseSDK.onAuthStateChanged(firebaseAuth, (user) => {
            if (user) {
              setAdminUser(user.email);
              localStorage.setItem('fc_admin_user', user.email);
            }
          });
          return () => unsubscribe();
        }
      }, []);

      useEffect(() => {
        if (firebaseDb && window.FirebaseSDK) {
          const leadsRef = window.FirebaseSDK.collection(firebaseDb, "leads");
          const unsubscribe = window.FirebaseSDK.onSnapshot(leadsRef, (snapshot) => {
            const liveData = [];
            snapshot.forEach((docSnap) => {
              liveData.push({ id: docSnap.id, ...docSnap.data() });
            });
            if (liveData.length > 0) {
              liveData.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
              setLeads(liveData);
            }
          }, (err) => {
            console.warn("Firestore snapshot listener:", err.message);
          });

          return () => unsubscribe();
        }
      }, []);

      const refreshLeads = async () => {
        if (firebaseDb && window.FirebaseSDK) {
          try {
            const querySnapshot = await window.FirebaseSDK.getDocs(window.FirebaseSDK.collection(firebaseDb, "leads"));
            const liveData = [];
            querySnapshot.forEach((docSnap) => {
              liveData.push({ id: docSnap.id, ...docSnap.data() });
            });
            if (liveData.length > 0) {
              liveData.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
              setLeads(liveData);
            }
          } catch (e) {
            console.error("Refresh error:", e);
          }
        }
      };

      const updateLeadStatus = async (leadId, newStatus) => {
        const updated = leads.map(l => l.id === leadId ? { ...l, status: newStatus } : l);
        setLeads(updated);

        if (firebaseDb && window.FirebaseSDK && !leadId.startsWith('lead-10')) {
          try {
            const leadDocRef = window.FirebaseSDK.doc(firebaseDb, "leads", leadId);
            await window.FirebaseSDK.updateDoc(leadDocRef, { status: newStatus });
          } catch (err) {
            console.error("Firestore status update failed:", err);
          }
        }
      };

      const updateLeadDetails = async (leadId, updatedFields) => {
        const updated = leads.map(l => l.id === leadId ? { ...l, ...updatedFields } : l);
        setLeads(updated);

        if (firebaseDb && window.FirebaseSDK && !leadId.startsWith('lead-10')) {
          try {
            const leadDocRef = window.FirebaseSDK.doc(firebaseDb, "leads", leadId);
            await window.FirebaseSDK.updateDoc(leadDocRef, updatedFields);
            console.log("🔥 Lead details updated in Firestore:", updatedFields);
          } catch (err) {
            console.error("Firestore lead update failed:", err);
          }
        }
      };

      const deleteLead = async (leadId, e) => {
        if (e) e.stopPropagation();
        if (!confirm('정말로 이 고객 DB를 삭제하시겠습니까? (삭제 후 복구 불가)')) return;

        const filtered = leads.filter(l => l.id !== leadId);
        setLeads(filtered);

        if (firebaseDb && window.FirebaseSDK && !leadId.startsWith('lead-10')) {
          try {
            const leadDocRef = window.FirebaseSDK.doc(firebaseDb, "leads", leadId);
            await window.FirebaseSDK.deleteDoc(leadDocRef);
          } catch (err) {
            console.error("Firestore delete failed:", err);
          }
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('fc_admin_user');
        localStorage.removeItem('fc_current_view');
        sessionStorage.removeItem('fc_admin_user');
        setAdminUser('');
        if (firebaseAuth && window.FirebaseSDK) {
          window.FirebaseSDK.signOut(firebaseAuth);
        }
        changeView('home');
      };

      useEffect(() => {
        if (window.lucide) lucide.createIcons();
      });

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {!view.startsWith('admin_') && (
            <header className="bg-white border-b border-slate-200 sticky top-0 z-50">
              <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                <div onClick={() => changeView('home')} className="flex items-center gap-2.5 cursor-pointer">
                  <img src="/logo.png" alt="프랜차이즈 창업 진단센터 로고" className="h-9 sm:h-10 w-auto object-contain" />
                  <span className="font-extrabold text-xl text-slate-900">{SITE_CONFIG.brandName}</span>
                  <span className="bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded font-semibold">공식센터</span>
                </div>
                <div className="flex items-center gap-2.5">
                  <button onClick={() => changeView('diagnosis')} className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3.5 sm:px-4 py-2 rounded-lg text-xs sm:text-sm transition">
                    3분 창업진단 시작하기
                  </button>
                  <button onClick={() => { setHasCompletedDiagnosis(false); changeView('consultation'); }} className="bg-slate-800 hover:bg-slate-900 text-white font-bold px-3.5 sm:px-4 py-2 rounded-lg text-xs sm:text-sm transition">
                    상담 바로 예약하기
                  </button>
                </div>
              </div>
            </header>
          )}

          <main className="flex-1">
            {view === 'home' && <HomePage setView={changeView} setHasCompletedDiagnosis={setHasCompletedDiagnosis} setFormData={setFormData} />}
            {view === 'diagnosis' && <DiagnosisPage setView={changeView} formData={formData} setFormData={setFormData} setHasCompletedDiagnosis={setHasCompletedDiagnosis} handleGoHome={handleGoHome} />}
            {view === 'result' && <ResultPage setView={changeView} formData={formData} handleGoHome={handleGoHome} />}
            {view === 'consultation' && <ConsultationPage setView={changeView} formData={formData} hasCompletedDiagnosis={hasCompletedDiagnosis} leads={leads} setLeads={setLeads} handleGoHome={handleGoHome} />}
            
            {view === 'admin_login' && <AdminLoginPage setView={changeView} setAdminUser={setAdminUser} />}
            {view === 'admin_dashboard' && <AdminDashboardPage setView={changeView} leads={leads} setSelectedLeadId={setSelectedLeadId} adminUser={adminUser} refreshLeads={refreshLeads} updateLeadStatus={updateLeadStatus} deleteLead={deleteLead} handleLogout={handleLogout} handleGoHome={handleGoHome} />}
            {view === 'admin_leads' && <AdminLeadsPage setView={changeView} leads={leads} setSelectedLeadId={setSelectedLeadId} adminUser={adminUser} refreshLeads={refreshLeads} updateLeadStatus={updateLeadStatus} deleteLead={deleteLead} handleLogout={handleLogout} handleGoHome={handleGoHome} />}
            {view === 'admin_detail' && <AdminDetailPage setView={changeView} leads={leads} setLeads={setLeads} selectedLeadId={selectedLeadId} adminUser={adminUser} updateLeadStatus={updateLeadStatus} updateLeadDetails={updateLeadDetails} deleteLead={deleteLead} handleLogout={handleLogout} handleGoHome={handleGoHome} />}
            {view === 'admin_funnel' && <AdminFunnelPage setView={changeView} leads={leads} adminUser={adminUser} handleLogout={handleLogout} handleGoHome={handleGoHome} />}
            {view === 'admin_seoul_cmrcl' && <AdminSeoulCmrclPage setView={changeView} adminUser={adminUser} handleLogout={handleLogout} refreshLeads={refreshLeads} handleGoHome={handleGoHome} />}
            {view === 'admin_franchise' && <AdminFranchisePage setView={changeView} adminUser={adminUser} handleLogout={handleLogout} refreshLeads={refreshLeads} handleGoHome={handleGoHome} />}
          </main>

          {!view.startsWith('admin_') && (
            <footer className="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 text-sm mt-12">
              <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs">
                <div className="flex flex-wrap items-center gap-4">
                  <span className="text-white font-bold text-sm">{SITE_CONFIG.brandName}</span>
                  <a href="#" onClick={(e) => { e.preventDefault(); alert(SITE_CONFIG.privacyVer + ' 개인정보 처리방침\n상담 접수 및 고객 관리를 위해 수집합니다.'); }} className="text-blue-400 hover:underline">개인정보 처리방침</a>
                  <a href={SITE_CONFIG.govSupportLink} target="_blank" rel="noopener noreferrer" className="text-emerald-400 font-bold hover:underline flex items-center gap-1">
                    🏛️ 소상공인24 정부지원사업 공고 ↗
                  </a>
                  <a href={SITE_CONFIG.ftcDisclosureLink} target="_blank" rel="noopener noreferrer" className="text-sky-400 font-bold hover:underline flex items-center gap-1">
                    ⚖️ 공정위 가맹사업 정보공개서 ↗
                  </a>
                </div>
              </div>

    function KakaoMapAnalysisSection({ setView, setFormData }) {
      const mapContainerRef = React.useRef(null);
      const [mapInstance, setMapInstance] = React.useState(null);
      const [selectedAddress, setSelectedAddress] = React.useState('서울시 서대문구 홍제동');
      const [searchKeyword, setSearchKeyword] = React.useState('');
      const [isLoadingApi, setIsLoadingApi] = React.useState(false);
      const [analysisResult, setAnalysisResult] = React.useState({
        floatingPop: '17,605 명',
        households: '7,973 세대',
        ageRatios: [
          { label: '10대', ratio: 11 },
          { label: '20대', ratio: 13 },
          { label: '30대', ratio: 14 },
          { label: '40대', ratio: 13 },
          { label: '50대', ratio: 18 },
          { label: '60대이상', ratio: 31 }
        ],
        recommendedTypes: ['소자본 카페', '무인 세탁/스튜디오', '프랜차이즈 식음료']
      });

      const circleRef = useRef(null);
      const markerRef = useRef(null);

      const drawCircleAndMarker = (latlng, mapObj) => {
        if (!mapObj || !window.kakao) return;

        if (circleRef.current) {
          circleRef.current.setMap(null);
        }
        if (markerRef.current) {
          markerRef.current.setMap(null);
        }

        // 1. 선택 위치 핀 마커 생성
        markerRef.current = new window.kakao.maps.Marker({
          position: latlng
        });
        markerRef.current.setMap(mapObj);

        // 2. 선택된 상권 반경 500m 배후지 반투명 영역 시각화
        circleRef.current = new window.kakao.maps.Circle({
          center: latlng,
          radius: 500, // 500m 배후지 표준 영역
          strokeWeight: 2,
          strokeColor: '#3b82f6',
          strokeOpacity: 0.9,
          strokeStyle: 'dashed',
          fillColor: '#60a5fa',
          fillOpacity: 0.28
        });
        circleRef.current.setMap(mapObj);
      };

      React.useEffect(() => {
        if (!window.kakao || !window.kakao.maps) return;

        window.kakao.maps.load(() => {
          const container = mapContainerRef.current;
          if (!container) return;

          const initialCenter = new window.kakao.maps.LatLng(37.5872, 126.9463);
          const options = {
            center: initialCenter,
            level: 4
          };

          const map = new window.kakao.maps.Map(container, options);
          setMapInstance(map);

          const triggerRelayout = () => {
            if (map) {
              map.relayout();
              map.setCenter(map.getCenter());
            }
          };

          requestAnimationFrame(triggerRelayout);
          setTimeout(triggerRelayout, 100);
          setTimeout(triggerRelayout, 300);
          setTimeout(triggerRelayout, 600);

          if (window.ResizeObserver && container) {
            const ro = new ResizeObserver(() => triggerRelayout());
            ro.observe(container);
          }

          window.addEventListener('resize', triggerRelayout);

          const geocoder = new window.kakao.maps.services.Geocoder();
          drawCircleAndMarker(initialCenter, map);

          window.kakao.maps.event.addListener(map, 'click', (mouseEvent) => {
            const latlng = mouseEvent.latLng;
            drawCircleAndMarker(latlng, map);

            geocoder.coord2Address(latlng.getLng(), latlng.getLat(), (result, status) => {
              if (status === window.kakao.maps.services.Status.OK) {
                const addr = result[0].road_address ? result[0].road_address.address_name : result[0].address.address_name;
                setSelectedAddress(addr);
              }
            });
          });
        });
      }, []);

      const handleSearch = (e) => {
        e.preventDefault();
        if (!searchKeyword.trim() || !mapInstance || !window.kakao) return;

        const ps = new window.kakao.maps.services.Places();
        ps.keywordSearch(searchKeyword, (data, status) => {
          if (status === window.kakao.maps.services.Status.OK) {
            const targetPos = new window.kakao.maps.LatLng(data[0].y, data[0].x);
            mapInstance.setCenter(targetPos);
            drawCircleAndMarker(targetPos, mapInstance);
            const targetAddr = data[0].address_name || data[0].place_name;
            setSelectedAddress(targetAddr);
          } else {
            alert('검색 결과를 찾을 수 없습니다. 정확한 지역명이나 도로명을 입력해 보세요.');
          }
        });
      };

      const startDiagnosisWithLocation = () => {
        setFormData(prev => ({ ...prev, region_city: selectedAddress }));
        setView('diagnosis');
      };

      return (
        <div className="bg-slate-900 text-white rounded-3xl p-6 sm:p-10 shadow-2xl border border-slate-800 my-12">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div>
              <div className="flex items-center gap-2 mb-2">
                <span className="text-emerald-400 font-extrabold text-xs tracking-wider uppercase bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">
                  카카오 지도 상권 분석
                </span>
              </div>
              <h3 className="text-xl sm:text-2xl font-black">
                📍 지도에서 원하는 위치를 클릭하고 상권을 자유롭게 확인해보세요.
              </h3>
            </div>

            <form onSubmit={handleSearch} className="flex gap-2">
              <input
                type="text"
                placeholder="예: 홍제동, 장안동, 충정로..."
                value={searchKeyword}
                onChange={(e) => setSearchKeyword(e.target.value)}
                className="bg-slate-800 border border-slate-700 text-white placeholder-slate-400 text-xs sm:text-sm px-4 py-2.5 rounded-xl focus:outline-none focus:border-emerald-500 w-48 sm:w-64"
              />
              <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm px-4 py-2.5 rounded-xl transition">
                검색
              </button>
            </form>
          </div>

          <div className="w-full rounded-2xl overflow-hidden shadow-lg border border-slate-700/80 h-[480px] relative">
            {/* 카카오 지도만 100% 깔끔하게 렌더링 */}
            <div ref={mapContainerRef} className="w-full h-full" />
          </div>
        </div>
      );
    }

    function DiagnosisPage({ setView, formData, setFormData, setHasCompletedDiagnosis, handleGoHome }) {
      const [step, setStep] = useState(1);
      const [regionError, setRegionError] = useState(false);

      const [budgetValue, setBudgetValue] = useState('');
      const [budgetUnit, setBudgetUnit] = useState('');
    
      const [category, setCategory] = useState(formData.industry_category || '');

      useEffect(() => {
        if (formData.budget) {
          const match = formData.budget.match(/([0-9,]+)\s*(만원|억원)/);
          if (match) {
            setBudgetValue(match[1].replace(/,/g, ''));
            setBudgetUnit(match[2]);
          }
        }
      }, []);
    
      const stepTitles = [
        "어디에서 창업을 희망하시나요?",
        "예상 가능한 창업 예산은 어느 정도인가요?",
        "언제쯤 창업을 시작하고 싶으신가요?",
        "가장 관심 있는 창업 아이템은 무엇인가요?",
        "어떤 방식으로 매장을 운영하실 계획인가요?",
        "이전에 창업을 해보신 경험이 있으신가요?",
        "예상하시는 매장의 규모는 어느 정도인가요?"
      ];

      const isStepNextValid = () => {
        if (step === 1) {
          return Boolean(formData.region_province && formData.region_province.trim() !== '' && formData.region_type);
        }
        if (step === 2) {
          return Boolean(budgetValue && Number(budgetValue) > 0 && budgetUnit && formData.budget);
        }
        if (step === 3) {
          return Boolean(formData.startup_period && formData.startup_period.trim() !== '');
        }
        if (step === 4) return Boolean(formData.industry);
        if (step === 5) return Boolean(formData.operation_type);
        if (step === 6) return Boolean(formData.experience);
        if (step === 7) return Boolean(formData.store_size);
        return true;
      };
    
      const handleNext = () => {
        if (step === 1 && (!formData.region_province || formData.region_province.trim() === '')) {
          setRegionError(true);
          setTimeout(() => setRegionError(false), 600);
          return;
        }
        if (!isStepNextValid()) return;
    
        if (step < 7) {
          setStep(step + 1);
        } else {
          setHasCompletedDiagnosis(true);
          setView('result');
        }
      };
    
      const OptionCard = ({ label, value, field }) => {
        const isSelected = formData[field] === value;
        return (
          <button
            onClick={() => setFormData({ ...formData, [field]: value })}
            className={`w-full text-left p-4 rounded-xl border text-sm sm:text-base font-semibold transition-all ${
              isSelected ? 'border-blue-600 bg-blue-50 text-blue-700 shadow-sm ring-1 ring-blue-600' : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700'
            }`}
          >
            {label}
            {isSelected && <span className="float-right text-blue-600">✓</span>}
          </button>
        );
      };
    
      return (
        <div className="max-w-2xl mx-auto px-4 py-8 sm:py-12">
          {/* Progress Bar */}
          <div className="mb-8">
            <div className="flex justify-between items-center text-xs sm:text-sm font-bold text-slate-500 mb-2">
              <button onClick={() => step > 1 ? setStep(step - 1) : handleGoHome()} className="hover:text-slate-800 transition">
                ← 이전
              </button>
              <span className="bg-slate-100 text-slate-700 px-3 py-1 rounded-full border border-slate-200">
                STEP {step} <span className="text-slate-400 font-normal">/ 7</span>
              </span>
            </div>
            <div className="w-full bg-slate-100 h-2 sm:h-2.5 rounded-full overflow-hidden">
              <div className="bg-gradient-to-r from-blue-500 to-blue-600 h-full rounded-full transition-all duration-500 ease-out" style={{ width: `${(step / 7) * 100}%` }}></div>
            </div>
          </div>
    
          <div className="bg-white p-6 sm:p-10 rounded-3xl border border-slate-200 shadow-sm min-h-[400px] flex flex-col">
            <h2 className="text-xl sm:text-2xl font-black text-slate-900 mb-8 tracking-tight">
              {stepTitles[step - 1]}
            </h2>
    
            <div className="flex-1 space-y-3">
              {step === 1 && (
                <div className="space-y-6">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1.5">지역/주소</label>
                    <input
                      type="text"
                      value={formData.region_province || ''}
                      onChange={(e) => setFormData({...formData, region_province: e.target.value})}
                      placeholder="예: 서울시 강남구 역삼동"
                      className={`w-full p-3.5 border rounded-xl text-sm font-semibold outline-none transition-all ${
                        regionError 
                          ? 'border-red-500 ring-2 ring-red-500 animate-shake' 
                          : 'border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500'
                      }`}
                    />
                    {regionError && <p className="text-red-500 text-xs font-bold mt-1.5">지역/주소를 입력해주세요.</p>}
                  </div>
                  
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-2">상권 유형 (택 1)</label>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 sm:gap-3">
                      {['역세권', '주거밀집', '오피스', '대학가', '관광지', '전통시장', '신도시', '산업단지', '교외', '상관없음'].map((opt) => (
                        <OptionCard key={opt} label={opt} value={opt} field="region_type" />
                      ))}
                    </div>
                  </div>
                </div>
              )}
    
              {step === 2 && (
                <div className="space-y-6">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-2">창업 예산 금액 (숫자만 입력)</label>
                    <div className="relative">
                      <input

                        value={budgetValue}
                        onChange={(e) => {
                          const val = e.target.value.replace(/[^0-9]/g, '');
                          setBudgetValue(val);
                          if (!val) {
                            setBudgetUnit('');
                            setFormData({ ...formData, budget: '' });
                          } else if (budgetUnit) {
                            const formatted = `${Number(val).toLocaleString()}${budgetUnit}`;
                            setFormData({ ...formData, budget: formatted });

                        }}
                        className="w-full p-4 border border-slate-300 rounded-2xl text-lg font-bold outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-slate-900 pr-20"

                              setBudgetUnit(unit);

                              setFormData({ ...formData, budget: formatted });

                            className={`p-4 rounded-2xl border text-base font-bold transition-all flex items-center justify-between ${
                              budgetUnit === unit
                                ? 'border-blue-600 bg-blue-50 text-blue-700 ring-2 ring-blue-600 shadow-sm'

                      {budgetUnit && (

                          <strong className="text-xl font-black text-blue-700">
                            {Number(budgetValue).toLocaleString()} {budgetUnit === '만원' ? '만 원' : '억 원'}
                          </strong>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}
    
              {step === 3 && (
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-2">창업 희망 시기 선택</label>
                    <select
                      value={formData.startup_period && formData.startup_period !== '미정' ? formData.startup_period : ''}
                      onChange={(e) => {
                        if (e.target.value) {
                          setFormData({ ...formData, startup_period: e.target.value });
                        }
                      }}
                      className={`w-full p-4 border border-slate-300 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white cursor-pointer transition-all ${
                        formData.startup_period && formData.startup_period !== '미정'
                          ? 'text-base font-bold text-slate-900'
                          : 'text-sm font-normal text-slate-400'
                      }`}
                    >
                      <option value="" disabled className="text-slate-400">시기를 선택해주세요.</option>
                      {Array.from({ length: 12 }, (_, i) => `${i + 1}개월 이내`).map((opt) => (
                        <option key={opt} value={opt} className="text-slate-900 font-bold">{opt}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <button
                      type="button"
                      onClick={() => setFormData({ ...formData, startup_period: '미정' })}
                      className={`w-full p-4 rounded-2xl border transition-all flex items-center justify-between ${
                        formData.startup_period === '미정'
                          ? 'border-blue-600 bg-blue-50 text-blue-700 ring-2 ring-blue-600 shadow-sm font-bold text-base'
                          : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold text-sm sm:text-base'
                      }`}
                    >
                      <span>일정이 정해지지 않았습니다.</span>
                      {formData.startup_period === '미정' && <span className="text-blue-600 font-extrabold text-lg">✓</span>}
                    </button>
                  </div>

                  {formData.startup_period && (
                    <div className="p-4 bg-blue-50 border border-blue-200 rounded-2xl text-center">
                      <span className="text-xs text-blue-600 font-bold block mb-0.5">선택된 창업 시기</span>
                      <strong className="text-xl font-black text-blue-700">

              {step === 4 && (

                  <div>

                    <div className="flex flex-wrap gap-2">

                        <button

                          className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${
                            category === cat ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'

                      ))}

                  </div>
    
                  {category && groupedIndustries[category] && (
                    <div className="pt-4 border-t border-slate-100">
                      <label className="block text-xs font-bold text-slate-500 mb-2">소분류 (상세 업종)</label>
                      <div className="grid grid-cols-2 gap-2.5">
                        {groupedIndustries[category].map((ind) => (
                          <OptionCard key={ind.id} label={ind.name} value={ind.id} field="industry" />

                      </div>

              {step === 5 && (
                <div className="grid sm:grid-cols-2 gap-3">
                  {['직접 운영', '직원 운영', '무인 운영', '부업', '가족 운영', '투자형'].map((opt) => (

    function ResultPage({ setView, formData, handleGoHome }) {
      let profile = null;
      if (DB && DB.industry_profile) {
        profile = DB.industry_profile.find(p => p.industry_id === formData.industry);
      }
      if (!profile) {
        profile = {
          industry_name: formData.industry,
          min_capital: 5000, recommended_capital: 10000, recommended_area: 20,
          preparation_months: 3, operation_difficulty: 5, labor_intensity: 5,
          unstaffed_possible: false, franchise_suitability: 7, land_required: false, license_required: false, license_permit_level: 0,
          commercial_dependency: 50, growth_screening: 50
        };
      }

      const parseBudget = (str) => {
        if (!str) return 50000000;
        let s = str.replace(/,/g, '').trim();
        if (s.includes('억원') || s.includes('억')) {
          const num = parseFloat(s.replace(/[^0-9.]/g, '')) || 1;
          return num * 100000000;
        }
        if (s.includes('만원') || s.includes('만')) {
          const num = parseFloat(s.replace(/[^0-9.]/g, '')) || 5000;
          return num * 10000;
        }
        if (s.includes('2,000만원 미만')) return 15000000;
        if (s.includes('2,000~3,000')) return 25000000;
        if (s.includes('3,000~5,000')) return 40000000;
        if (s.includes('5,000~7,000')) return 60000000;
        if (s.includes('7,000만원~1억')) return 85000000;
        if (s.includes('1~2억')) return 150000000;
        if (s.includes('2억')) return 250000000;
        return 50000000;
      };

      const parseMonths = (str) => {
        if (!str || str === '미정') return 6;
        const match = str.match(/([0-9]+)\s*개월/);
        if (match) {
          return parseInt(match[1], 10);
        }
        if (str.includes('1개월')) return 1;
        if (str.includes('3개월')) return 3;
        if (str.includes('6개월')) return 6;
        return 6;
      };

      const parseRegionType = (str) => {
        if (str === '주거밀집') return 'residential';
        if (str === '역세권') return 'station';
        if (str === '교외/농촌' || str === '교외') return 'suburban';
        if (str === '관광지') return 'tourist';
        if (str === '오피스') return 'office';
        if (str === '전통시장') return 'traditional';
        if (str === '신도시') return 'new_town';
        if (str === '산업단지') return 'industrial';
        return 'mixed_commercial'; 
      };

      const parseArea = (str) => {
        if (!str) return 15;
        if (str.includes('10평 이하')) return 8;
        if (str.includes('10~20평')) return 15;
        if (str.includes('20~30평')) return 25;
        if (str.includes('30~50평')) return 40;
        if (str.includes('50평 이상')) return 60;
        return 20;
      };

      const input = {
        budget: parseBudget(formData.budget),
        monthsAvailable: parseMonths(formData.startup_period),
        regionType: parseRegionType(formData.region_type),
        areaPyeong: parseArea(formData.store_size),
        experience: formData.experience,
        operationType: formData.operation_type
      };

      const rawResult = ScoringEngine.diagnose(input, profile);
      const recommendationsData = ScoringEngine.rankIndustries(input, DB.industry_profile, 3);
      
      const recommendations = recommendationsData.map(item => ({
        name: item.profile.industry_name,
        score: item.result.total
      }));

      // Adapt to old format
      const result = {
        totalScore: rawResult.total,
        grade: rawResult.grade,
        gradeLabel: rawResult.label,
        scores: {
          capital: Math.round(rawResult.scores.capital),
          region: Math.round(rawResult.scores.region),
          industry: Math.round(rawResult.scores.industry),
          timing: Math.round(rawResult.scores.timing),
          operator: Math.round(rawResult.scores.operator),
          market: Math.round(rawResult.scores.market),
          risk: Math.round(rawResult.scores.risk)
        },
        rationales: {
          capital: "투자금 대비 필요 자금을 분석했습니다.",
          region: "선택하신 상권 특성과 업종 궁합을 반영했습니다.",
          industry: "희망 규모와 업종의 권장 요건을 비교했습니다.",
          timing: "준비 기간과 업종별 개점 소요시간을 비교했습니다.",
          operator: "운영 난이도 및 방식이 목표에 부합하는지 평가했습니다.",
          market: "해당 업종의 경쟁 강도와 시장 성장성을 고려했습니다.",
          risk: "인허가 및 난이도 등 리스크 요소를 반영했습니다."
        },
        topPenalties: rawResult.topDeductions.map(d => ({
          name: d.label,
          tip: d.text
        }))
      };
    
      const CircleGauge = ({ score }) => {
        const radius = 60;
        const circumference = 2 * Math.PI * radius;
        const strokeDashoffset = circumference - (score / 100) * circumference;
        
        return (
          <div className="relative flex justify-center items-center w-40 h-40 mx-auto">
            <svg className="w-full h-full transform -rotate-90" viewBox="0 0 140 140">
              <circle cx="70" cy="70" r={radius} stroke="currentColor" strokeWidth="12" fill="transparent" className="text-slate-100" />
              <circle 
                cx="70" cy="70" r={radius} 
                stroke="currentColor" 
                strokeWidth="12" 
                fill="transparent" 
                strokeDasharray={circumference} 
                strokeDashoffset={strokeDashoffset} 
                className={`${score >= 80 ? 'text-emerald-500' : score >= 60 ? 'text-blue-500' : 'text-rose-500'} transition-all duration-1000 ease-out`}
                strokeLinecap="round" 
              />
            </svg>
            <div className="absolute flex flex-col items-center justify-center">
              <span className="text-4xl font-black text-slate-900">{score}<span className="text-xl font-bold text-slate-400">점</span></span>
            </div>
          </div>
        );
      };
    
      const BarChartItem = ({ label, score, maxScore, rationale }) => {
        const percentage = (score / maxScore) * 100;
        return (
          <div className="mb-4">
            <div className="flex justify-between items-end mb-1">
              <span className="text-sm font-bold text-slate-700">{label}</span>
              <span className="text-xs font-black text-slate-900">{score}<span className="text-slate-400 font-normal"> / {maxScore}</span></span>
            </div>
            <div className="w-full bg-slate-100 h-2.5 rounded-full mb-1.5 overflow-hidden">
              <div className="bg-blue-500 h-full rounded-full transition-all duration-1000" style={{ width: `${percentage}%` }}></div>
            </div>
            <p className="text-[11px] text-slate-500 leading-tight">{rationale}</p>
          </div>
        );
      };
    
      return (
        <div className="bg-slate-50 min-h-screen py-10 px-4">
          <div className="max-w-3xl mx-auto space-y-6">
            
            {/* Header */}
            <div className="flex items-center justify-between mb-4">
              <h1 className="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">맞춤 창업 진단 리포트</h1>
              <button onClick={() => handleGoHome()} className="bg-white border border-slate-200 text-slate-600 px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-slate-50">처음으로</button>
            </div>
    
            {/* Main Score Section */}
            <div className="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm text-center">
              <h2 className="text-sm font-bold text-slate-500 mb-6">종합 창업 적합도</h2>
              <CircleGauge score={result.totalScore} />
              
              <div className="mt-6">
                <span className={`inline-block px-4 py-1.5 rounded-full text-sm font-black border ${
                  result.grade === 'S' || result.grade === 'A' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' :
                  result.grade === 'B' ? 'bg-blue-50 text-blue-600 border-blue-200' :
                  result.grade === 'C' ? 'bg-amber-50 text-amber-600 border-amber-200' :
                  'bg-rose-50 text-rose-600 border-rose-200'
                }`}>
                  {result.grade}등급 ({result.gradeLabel})
                </span>
              </div>
              <p className="mt-4 text-sm text-slate-600 font-medium">
                입력하신 조건과 <strong className="text-blue-600">[{profile.industry_name}]</strong> 업종의 매칭 결과를 분석했습니다.
              </p>
            </div>
    
            {/* Diagnostic Comments (Top Penalties) */}
            {result.topPenalties.length > 0 && (
              <div className="bg-rose-50/50 rounded-3xl p-6 sm:p-8 border border-rose-100">
                <h3 className="text-lg font-black text-rose-800 mb-4 flex items-center gap-2">
                  <span>⚠️</span> 주요 보완 필요 항목 TOP 3
                </h3>
                <div className="space-y-4">
                  {result.topPenalties.map((penalty, idx) => (
                    <div key={idx} className="bg-white rounded-2xl p-4 border border-rose-100 shadow-sm flex gap-4">
                      <div className="w-8 h-8 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center font-black flex-shrink-0">
                        {idx + 1}
                      </div>
                      <div>
                        <h4 className="font-bold text-slate-800 mb-1">{penalty.name}</h4>
                        <p className="text-xs text-slate-600 leading-relaxed">{penalty.tip}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
    
            {/* Detailed Scores */}
            <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
              <h3 className="text-lg font-black text-slate-900 mb-6">세부 항목별 진단 점수</h3>
              <div className="grid sm:grid-cols-2 gap-x-8 gap-y-2">
                <BarChartItem label="자금 적합도" score={result.scores.capital} maxScore={25} rationale={result.rationales.capital} />
                <BarChartItem label="지역 적합도" score={result.scores.region} maxScore={20} rationale={result.rationales.region} />
                <BarChartItem label="업종 적합도" score={result.scores.industry} maxScore={20} rationale={result.rationales.industry} />
                <BarChartItem label="시기 적합도" score={result.scores.timing} maxScore={10} rationale={result.rationales.timing} />
                <BarChartItem label="운영자 적합도" score={result.scores.operator} maxScore={10} rationale={result.rationales.operator} />
                <BarChartItem label="업종 특성 기반 시장성/경쟁환경 평가" score={result.scores.market} maxScore={10} rationale={result.rationales.market} />
              </div>
            </div>
    
            {/* Recommended Industries */}
            <div className="bg-blue-600 rounded-3xl p-6 sm:p-8 text-white shadow-lg">
              <div className="mb-6">
                <h3 className="text-lg font-black mb-1">💡 현재 조건에 딱 맞는 추천 업종</h3>
                <p className="text-blue-200 text-xs sm:text-sm">입력하신 예산, 상권, 운영방식을 분석하여 가장 적합도가 높은 업종을 추천합니다.</p>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                {recommendations.map((rec, idx) => (
                  <div key={idx} className="bg-white/10 backdrop-blur-sm border border-white/20 rounded-2xl p-4 flex flex-col justify-between">
                    <div className="text-blue-100 text-xs font-bold mb-2">추천 {idx + 1}위</div>
                    <div className="text-xl font-black mb-1">{rec.name}</div>
                    <div className="text-emerald-300 font-bold text-sm">적합도 {rec.score}점</div>
                  </div>
                ))}
              </div>
            </div>
    
            {/* CTA */}
            <div className="pt-4 pb-8">
              <button onClick={() => setView('consultation')} className="w-full bg-slate-900 hover:bg-slate-800 text-white text-lg font-black py-5 rounded-2xl shadow-xl transition-all">
                전문가와 1:1 창업 상담 예약하기 →
              </button>
            </div>
    
          </div>
        </div>
      );
    }
    

    function ConsultationPage({ setView, formData, hasCompletedDiagnosis, leads, setLeads, handleGoHome }) {
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('010-');
      
      const getTodayString = () => {
        const d = new Date();
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      };

      const [prefDate, setPrefDate] = useState(getTodayString());
      const [privacy, setPrivacy] = useState(false);
      const [marketing, setMarketing] = useState(false);
      const [done, setDone] = useState(false);
      const [submitting, setSubmitting] = useState(false);

      const [nameTouched, setNameTouched] = useState(false);
      const [phoneTouched, setPhoneTouched] = useState(false);

      // 성함 검증 함수: 숫자/초성/단일모음/특수문자 제외, 2자 이상 완성형 한글 또는 영문
      const isNameValid = (val) => {
        if (!val || val.trim().length < 2) return false;
        const trimmed = val.trim();
        const hasInvalidChars = /[0-9ㄱ-ㅎㅏ-ㅣ!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(trimmed);
        if (hasInvalidChars) return false;
        return /^[가-힣]{2,10}$/.test(trimmed) || /^[a-zA-Z\s]{2,20}$/.test(trimmed);
      };

      const nameIsValid = isNameValid(name);

      // 휴대폰 번호 핸들러: 010 고정, 숫자만 허용, 010-XXXX-XXXX 자동 하이픈
      const handlePhoneChange = (e) => {
        setPhoneTouched(true);
        const inputVal = e.target.value;
        let numbers = inputVal.replace(/[^0-9]/g, '');

        if (!numbers.startsWith('010')) {
          if (numbers.length === 0) {
            setPhone('010-');
            return;
          }
          numbers = '010' + numbers;
        }

        if (numbers.length > 11) {
          numbers = numbers.slice(0, 11);
        }

        if (numbers.length <= 3) {
          setPhone('010-');
        } else if (numbers.length <= 7) {
          setPhone(`${numbers.slice(0, 3)}-${numbers.slice(3)}`);
        } else {
          setPhone(`${numbers.slice(0, 3)}-${numbers.slice(3, 7)}-${numbers.slice(7)}`);
        }
      };

      // 휴대폰 번호 검증 함수: 010 포함 정확히 11자리 (010-XXXX-XXXX)
      const isPhoneValid = (val) => {
        const rawDigits = val.replace(/[^0-9]/g, '');
        return rawDigits.length === 11 && rawDigits.startsWith('010');
      };

      const phoneIsValid = isPhoneValid(phone);

      // 폼 전체 제출 가능 조건: 유효한 이름 + 유효한 휴대폰 번호 + 희망일 선택 + 필수동의 체크
      const isFormReady = nameIsValid && phoneIsValid && prefDate && privacy && !submitting;

      const onGoHome = () => {
        if (typeof handleGoHome === 'function') {
          handleGoHome();
        } else if (typeof setView === 'function') {
          setView('home');
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!isFormReady) return;

        setSubmitting(true);

        const finalStartupPurpose = hasCompletedDiagnosis ? (formData.startup_purpose || '미입력') : '미입력 (바로 상담 예약)';
        const finalBudget = hasCompletedDiagnosis ? (formData.budget || '미입력') : '미입력';
        const finalRegionProvince = hasCompletedDiagnosis ? (formData.region_province || '') : '';
        const finalRegionCity = hasCompletedDiagnosis ? (formData.region_city || '미입력') : '미입력';
        const finalRegionType = hasCompletedDiagnosis ? (formData.region_type || '미입력') : '미입력';
        const finalStartupPeriod = hasCompletedDiagnosis ? (formData.startup_period || '미입력') : '미입력';
        const finalIndustryCategory = hasCompletedDiagnosis ? (formData.industry_category || '') : '';
        const finalIndustry = hasCompletedDiagnosis ? (formData.industry || '미입력') : '미입력';
        const finalOperationType = hasCompletedDiagnosis ? (formData.operation_type || '미입력') : '미입력';
        const finalExperience = hasCompletedDiagnosis ? (formData.experience || '미입력') : '미입력';
        const finalStoreSize = hasCompletedDiagnosis ? (formData.store_size || '미입력') : '미입력';

        const newLead = {
          created_at: new Date().toISOString(),
          name: name.trim(),
          phone,
          startup_purpose: finalStartupPurpose,
          budget: finalBudget,
          region_province: finalRegionProvince,
          region_city: finalRegionCity,
          region_type: finalRegionType,
          startup_period: finalStartupPeriod,
          industry_category: finalIndustryCategory,
          industry: finalIndustry,
          operation_type: finalOperationType,
          experience: finalExperience,
          store_size: finalStoreSize,
          interest_types: formData.interest_types || [],
          customer_diagnosis_score: hasCompletedDiagnosis ? 85 : 0,
          preferred_consultation_date: prefDate,
          preferred_consultation_time_slot: '순차 진행 (시간 미지정)',
          privacy_consent: true,
          privacy_consent_at: new Date().toISOString(),
          privacy_policy_version: SITE_CONFIG.privacyVer,
          marketing_consent: marketing,
          lead_score: hasCompletedDiagnosis ? 85 : 60,
          lead_grade: hasCompletedDiagnosis ? 'A' : 'B',
          status: '신규',
          first_utm_source: 'direct',
          referrer: document.referrer || '직접 방문'
        };

        if (firebaseDb && window.FirebaseSDK) {
          try {
            const docRef = await window.FirebaseSDK.addDoc(
              window.FirebaseSDK.collection(firebaseDb, "leads"),
              newLead
            );
            console.log("🔥 Firestore real doc added ID:", docRef.id);
            setLeads([{ id: docRef.id, ...newLead }, ...leads]);
          } catch (err) {
            console.error("Firestore save error:", err);
            setLeads([{ id: 'lead-' + Date.now(), ...newLead }, ...leads]);
          }
        } else {
          setLeads([{ id: 'lead-' + Date.now(), ...newLead }, ...leads]);
        }

        setSubmitting(false);
        setDone(true);
      };

      if (done) {
        return (
          <div className="max-w-md mx-auto px-4 py-16 text-center">
            <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-2 font-black text-2xl">✓</div>
              <h2 className="text-2xl font-bold">상담 예약 완료!</h2>
              <p className="text-slate-600 text-sm leading-relaxed">전문 컨설턴트가 입력해주신 연락처를 통해 순차적으로 상담을 진행합니다.</p>
              <button onClick={onGoHome} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3.5 rounded-xl transition cursor-pointer">홈으로 돌아가기</button>
            </div>
          </div>
        );
      }

      // 성함 입력창 스타일
      let nameInputClass = "w-full p-3.5 border rounded-xl text-sm font-bold text-slate-900 transition focus:outline-none ";
      if (nameTouched || name.length > 0) {
        nameInputClass += nameIsValid
          ? "border-emerald-500 ring-2 ring-emerald-200 bg-emerald-50/20"
          : "border-rose-500 ring-2 ring-rose-200 bg-rose-50/20";
      } else {
        nameInputClass += "border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100";
      }

      // 휴대폰 번호 입력창 스타일
      let phoneInputClass = "w-full p-3.5 border rounded-xl text-sm font-mono font-bold transition focus:outline-none ";
      if (!nameIsValid) {
        phoneInputClass += "border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed";
      } else if (phoneTouched || phone.replace(/[^0-9]/g, '').length > 3) {
        phoneInputClass += phoneIsValid
          ? "border-emerald-500 ring-2 ring-emerald-200 bg-emerald-50/20 text-slate-900"
          : "border-rose-500 ring-2 ring-rose-200 bg-rose-50/20 text-slate-900";
      } else {
        phoneInputClass += "border-slate-300 text-slate-900 focus:border-blue-500 focus:ring-2 focus:ring-blue-100";
      }

      return (
        <div className="max-w-xl mx-auto px-4 py-10">
          <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
            <div>
              <h2 className="text-xl font-black text-slate-900 mb-1">무료 창업 상담 예약하기</h2>
              <p className="text-xs text-slate-500">전문 컨설턴트가 1:1 맞춤 창업 상담을 도와드립니다.</p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-5">
              {/* 1. 성함 입력 (문자/초성 검증 및 테두리 세팅) */}
              <div>
                <label className="block text-xs font-extrabold text-slate-800 mb-1.5">
                  성함 <span className="text-rose-500">*</span>
                </label>
                <input
                  type="text"
                  placeholder="홍길동"
                  value={name}
                  onChange={(e) => { setNameTouched(true); setName(e.target.value); }}
                  onBlur={() => setNameTouched(true)}
                  className={nameInputClass}
                />
                {(nameTouched || name.length > 0) && (
                  nameIsValid ? (
                    <p className="text-[11px] text-emerald-600 font-bold mt-1.5 flex items-center gap-1">
                      ✓ 성함이 올바르게 입력되었습니다.
                    </p>
                  ) : (
                    <p className="text-[11px] text-rose-500 font-bold mt-1.5 flex items-center gap-1">
                      ⚠️ 올바른 성함을 입력해주세요. (숫자, 초성/모음 단위 입력 불가)
                    </p>
                  )
                )}
              </div>

              {/* 2. 휴대폰 번호 입력 (이름 검증 시 활성화, 010 자동 및 8자리 완료 시 초록 테두리) */}
              <div>
                <div className="flex items-center justify-between mb-1.5">
                  <label className="block text-xs font-extrabold text-slate-800">
                    휴대폰 번호 <span className="text-rose-500">*</span>
                  </label>
                  {!nameIsValid && (
                    <span className="text-[11px] text-slate-400 font-medium">성함을 먼저 입력하면 활성화됩니다</span>
                  )}
                </div>
                <input
                  type="tel"
                  placeholder="010-0000-0000"
                  value={phone}
                  onChange={handlePhoneChange}
                  onFocus={() => { setPhoneTouched(true); if (!phone || phone === '') setPhone('010-'); }}
                  disabled={!nameIsValid}
                  className={phoneInputClass}
                />
                {!nameIsValid ? (
                  <p className="text-[11px] text-slate-400 font-medium mt-1.5">성함을 올바르게 입력하면 휴대폰 번호 칸이 활성화됩니다.</p>
                ) : (phoneTouched || phone.replace(/[^0-9]/g, '').length > 3) && (
                  phoneIsValid ? (
                    <p className="text-[11px] text-emerald-600 font-bold mt-1.5 flex items-center gap-1">
                      ✓ 휴대폰 번호 입력이 완료되었습니다. (010-XXXX-XXXX)
                    </p>
                  ) : (
                    <p className="text-[11px] text-rose-500 font-bold mt-1.5 flex items-center gap-1">
                      ⚠️ 010을 포함하여 휴대폰 번호 8자리를 모두 입력해주세요.
                    </p>
                  )
                )}
              </div>

              {/* 3. 상담 희망일 (희망시간대는 제거됨) */}
              <div>
                <label className="block text-xs font-extrabold text-slate-800 mb-1.5">상담 희망일 *</label>
                <input
                  type="date"
                  value={prefDate}
                  onChange={(e) => setPrefDate(e.target.value)}
                  className="w-full p-3.5 border border-slate-300 rounded-xl text-sm font-bold text-slate-800 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                />
              </div>

              {/* 4. 개인정보 수집 필수 및 마케팅 선택 동의 */}
              <div className="bg-slate-50 p-4 rounded-xl space-y-2.5 border border-slate-200">
                <label className="flex items-center gap-2.5 text-xs font-extrabold text-slate-800 cursor-pointer select-none">
                  <input type="checkbox" checked={privacy} onChange={(e) => setPrivacy(e.target.checked)} className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 cursor-pointer" />
                  <span>[필수] 개인정보 수집 및 이용 동의 ({SITE_CONFIG.privacyVer})</span>
                </label>
                <label className="flex items-center gap-2.5 text-xs text-slate-600 font-semibold cursor-pointer select-none">
                  <input type="checkbox" checked={marketing} onChange={(e) => setMarketing(e.target.checked)} className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 cursor-pointer" />
                  <span>[선택] 마케팅 활용 및 안내 수신 동의 ({SITE_CONFIG.marketingVer})</span>
                </label>
              </div>

              {/* 5. 제출 버튼 (모든 정보 입력 + 필수 동의 시만 활성화) */}
              <div>
                {!isFormReady && (
                  <p className="text-center text-[11px] text-slate-400 font-semibold mb-2">
                    성함, 휴대폰 번호 입력 및 [필수] 동의를 완료하면 제출 버튼이 활성화됩니다.
                  </p>
                )}
                <button
                  type="submit"
                  disabled={!isFormReady}
                  className={`w-full p-4 rounded-xl font-black text-sm sm:text-base transition ${
                    isFormReady
                      ? 'bg-blue-600 hover:bg-blue-700 text-white shadow-lg shadow-blue-500/30 cursor-pointer active:scale-95'
                      : 'bg-slate-200 text-slate-400 border border-slate-300/60 cursor-not-allowed'
                  }`}
                >
                  {submitting ? '제출 중...' : '상담 예약 제출하기'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function AdminLoginPage({ setView, setAdminUser }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const handleLogin = async (e) => {
        e.preventDefault();
        setErrorMsg('');

        if (!email.trim() || !password.trim()) {
          setErrorMsg('이메일과 비밀번호를 입력해주세요.');
          return;
        }

        setLoading(true);

        if (firebaseAuth && window.FirebaseSDK) {
          try {
            const userCred = await window.FirebaseSDK.signInWithEmailAndPassword(firebaseAuth, email, password);
            localStorage.setItem('fc_admin_user', userCred.user.email);
            localStorage.setItem('fc_current_view', 'admin_dashboard');
            setAdminUser(userCred.user.email);
            setView('admin_dashboard');
            return;
          } catch (err) {
            console.error("Firebase Auth Error:", err);
            setErrorMsg('Firebase 로그인 실패: 이메일 또는 비밀번호가 올바르지 않습니다.');
            setLoading(false);
            return;
          }
        }

        localStorage.setItem('fc_admin_user', email);

        setAdminUser(email);
        setView('admin_dashboard');
      };

      return (
        <div className="max-w-md mx-auto px-4 py-20">
          <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-md">
            <h2 className="text-xl font-extrabold text-center mb-2">영업자 CRM 로그인 (관리자 전용)</h2>

              <div className="bg-rose-50 text-rose-600 border border-rose-100 p-3 rounded-xl text-xs mb-4 font-semibold">

                <label className="block text-xs font-bold text-slate-700 mb-1">이메일 계정</label>
                <input type="email" placeholder="admin@domain.com" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl text-sm" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">비밀번호</label>
                <input type="password" placeholder="••••••••" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl text-sm" />
              </div>
              <button type="submit" disabled={loading} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold p-3.5 rounded-xl shadow-md">
                {loading ? '인증 처리 중...' : 'CRM 접속하기'}
              </button>
            </form>
          </div>
        </div>
      );
    }
