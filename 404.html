        Object.values(storeMarkerMapRef.current).forEach(item => {
          if (item.marker && defaultImg) {
            item.marker.setImage(defaultImg);
            item.marker.setZIndex(1);
          }
        });

        if (activeInfoWindowRef.current) {
          activeInfoWindowRef.current.close();
        }

        // 2. 선택된 상가 마커 하이라이트
        const targetItem = storeMarkerMapRef.current[bizesId];
        if (targetItem && targetItem.marker) {
          if (highlightImg) {
            targetItem.marker.setImage(highlightImg);
            targetItem.marker.setZIndex(20);
          }
          
          map.panTo(targetItem.marker.getPosition());
          targetItem.infowindow.open(map, targetItem.marker);
          activeInfoWindowRef.current = targetItem.infowindow;
          setSelectedBizesId(bizesId);

          if (targetItem.store) {
            const mainCat = targetItem.store.indsLclsNm || '기타 서비스';
            const subCat = targetItem.store.indsSclsNm || targetItem.store.indsMclsNm || '기타 업종';
            setCollapsedCategories(prev => ({ ...prev, [mainCat]: false }));
            setCollapsedSubCategories(prev => ({ ...prev, [`${mainCat}::${subCat}`]: false }));
          }
        }
      };

      const drawCenterMarker = (latlng, mapObj) => {
        if (!mapObj || !window.kakao) return;
        if (centerMarkerRef.current) centerMarkerRef.current.setMap(null);

        const redPinSvg = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="42" viewBox="0 0 36 42">
            <path fill="#ef4444" stroke="#ffffff" stroke-width="2.5" d="M18 0C8.059 0 0 8.059 0 18c0 13.5 18 24 18 24s18-10.5 18-24C36 8.059 27.941 0 18 0z"/>
            <circle cx="18" cy="16" r="6" fill="#ffffff"/>
          </svg>
        `)}`;

        const redMarkerImage = new window.kakao.maps.MarkerImage(
          redPinSvg,
          new window.kakao.maps.Size(36, 42),
          { offset: new window.kakao.maps.Point(18, 42) }
        );

        centerMarkerRef.current = new window.kakao.maps.Marker({
          position: latlng,
          image: redMarkerImage,
          zIndex: 10
        });
        centerMarkerRef.current.setMap(mapObj);
      };

      const handleToggleNearbyStores = () => {
        if (activeApi === 'nearby_stores') {
          setActiveApi(null);
          activeApiRef.current = null;
          // 기존 맵 레이어 지우기 등 처리가 필요하다면 추가
        } else {
          setActiveApi('nearby_stores');
          activeApiRef.current = 'nearby_stores';
          const { lat, lng } = currentPosRef.current;
          fetchStoresInRadius(lat, lng);
        }
      };

      const handleToggleFranchise = () => {
        if (activeApi === 'franchise') {
          setActiveApi(null);
          activeApiRef.current = null;
          clearFranchiseLayers();
        } else {
          setActiveApi('franchise');
          activeApiRef.current = 'franchise';
          fetchFranchiseData(); // 바로 조회
        }
      };
      useEffect(() => {
        const initMap = () => {
          if (!window.kakao || !window.kakao.maps || !mapContainerRef.current) return;

          window.kakao.maps.load(() => {
            const container = mapContainerRef.current;
            if (!container) return;

            const initialLat = 37.5665;
            const initialLng = 126.9780;
            currentPosRef.current = { lat: initialLat, lng: initialLng };
            const centerPos = new window.kakao.maps.LatLng(initialLat, initialLng);

            if (!mapObjRef.current) {
              const options = { center: centerPos, level: 4 };
              mapObjRef.current = new window.kakao.maps.Map(container, options);
            } else {
              mapObjRef.current.relayout();
              mapObjRef.current.setCenter(centerPos);
            }

            drawCenterMarker(centerPos, mapObjRef.current);

            // 초기 위치 지오코딩 주소 확인
            const geocoder = new window.kakao.maps.services.Geocoder();
            geocoder.coord2Address(initialLng, initialLat, (result, status) => {
              if (status === window.kakao.maps.services.Status.OK && result[0]) {
                setCurrentAddress(result[0].address ? result[0].address.address_name : '서울 중구 태평로1가');
              }
            });

            const triggerRelayout = () => {
              if (mapObjRef.current) {
                mapObjRef.current.relayout();
              }
            };

            requestAnimationFrame(triggerRelayout);
            setTimeout(triggerRelayout, 100);
            setTimeout(triggerRelayout, 300);

            if (window.ResizeObserver && mapContainerRef.current) {
              const ro = new ResizeObserver(() => triggerRelayout());
              ro.observe(mapContainerRef.current);
            }

            window.addEventListener('resize', triggerRelayout);

            // 지도 클릭 이벤트: 중심점 이동 및 API가 활성화되어 있으면 데이터 재조회
            window.kakao.maps.event.addListener(mapObjRef.current, 'click', (mouseEvent) => {
              const latlng = mouseEvent.latLng;
              const lat = latlng.getLat();
              const lng = latlng.getLng();
              currentPosRef.current = { lat, lng };

              mapObjRef.current.panTo(latlng);
              drawCenterMarker(latlng, mapObjRef.current);

              geocoder.coord2Address(lng, lat, (result, status) => {
                if (status === window.kakao.maps.services.Status.OK && result[0]) {
                  setCurrentAddress(result[0].address ? result[0].address.address_name : '선택 위치');
                }
              });

              if (activeApiRef.current === 'nearby_stores') {
                fetchStoresInRadius(lat, lng);
              }
            });
          });
        };

        if (window.kakao && window.kakao.maps) {
          initMap();
        } else {
          const timer = setInterval(() => {
            if (window.kakao && window.kakao.maps) {
              clearInterval(timer);
              initMap();
            }
          }, 300);
          return () => clearInterval(timer);
        }
      }, []);

      const handleSearchSubmit = (e) => {
        e.preventDefault();
        if (!searchKeyword.trim() || !mapObjRef.current || !window.kakao) return;

        const ps = new window.kakao.maps.services.Places();
        ps.keywordSearch(searchKeyword, (data, status) => {
          if (status === window.kakao.maps.services.Status.OK && data[0]) {
            const targetLat = parseFloat(data[0].y);
            const targetLng = parseFloat(data[0].x);
            currentPosRef.current = { lat: targetLat, lng: targetLng };
            const targetPos = new window.kakao.maps.LatLng(targetLat, targetLng);
            
            mapObjRef.current.panTo(targetPos);
            drawCenterMarker(targetPos, mapObjRef.current);
            setCurrentAddress(data[0].address_name || data[0].place_name || '검색 위치');

            if (activeApiRef.current === 'nearby_stores') {
              fetchStoresInRadius(targetLat, targetLng);
            }
          } else {
            alert('검색한 위치를 찾을 수 없습니다.');
          }
        });
      };

      return (
        <div className="bg-slate-900 text-white min-h-screen flex flex-col relative overflow-hidden">
          <AdminNav setView={setView} currentView="admin_seoul_cmrcl" adminUser={adminUser} refreshLeads={refreshLeads} handleLogout={handleLogout} />
          
          <div className="flex-1 w-full relative overflow-hidden">
            {/* 좌측 상단 패널: 위치 검색 + 현재 지도 위치 (항상 고정) */}
            <div className="absolute top-4 left-4 z-10 w-80 sm:w-96 bg-slate-900/95 border border-slate-700/90 backdrop-blur-xl rounded-2xl shadow-2xl p-4 text-white space-y-3.5 flex flex-col transition-all duration-300">
              
              {/* 상단 위치 검색 폼 */}
              <form onSubmit={handleSearchSubmit} className="flex gap-2 flex-shrink-0">
                <input
                  type="text"
                  value={searchKeyword}
                  onChange={(e) => setSearchKeyword(e.target.value)}
                  placeholder="위치/주소 검색 (예: 강남역, 명동)"
                  className="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs font-medium text-white placeholder-slate-400 focus:outline-none focus:border-blue-500"
                />
                <button
                  type="submit"
                  disabled={isLoading}
                  className="bg-blue-600 hover:bg-blue-500 font-extrabold text-xs px-3 py-2 rounded-xl transition flex items-center gap-1 shadow-md whitespace-nowrap"
                >
                  {isLoading ? '⏳' : '🔍'} 검색
                </button>
              </form>

              {/* 중심 위치 안내 카드 */}
              <div className="bg-slate-800/90 rounded-xl p-3 border border-slate-700/80 space-y-1.5 text-xs flex-shrink-0">
                <div className="flex justify-between items-center">
                  <span className="text-[11px] font-bold text-slate-400">📍 현재 지도 위치</span>
                  <span className="text-xs font-black text-emerald-400 truncate max-w-[190px]">{currentAddress}</span>
                </div>
              </div>
            </div>

            {/* 좌측 하단 패널: 사용 가능한 API 기능 선택 섹션 (토글 가능) */}
            <div className={`absolute top-48 z-10 transition-all duration-300 ${isApiPanelOpen ? 'left-4' : '-left-80 sm:-left-96'}`}>
              <div className="w-80 sm:w-96 bg-slate-900/95 border border-slate-700/90 backdrop-blur-xl rounded-2xl shadow-2xl p-4 text-white flex flex-col relative">
                {/* 토글 버튼 */}
                <button 
                  onClick={() => setIsApiPanelOpen(!isApiPanelOpen)} 
                  className="absolute top-1/2 -translate-y-1/2 -right-8 w-8 h-16 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 border-l-0 rounded-r-xl shadow-lg flex items-center justify-center cursor-pointer transition-colors"
                >
                  {isApiPanelOpen ? '◀' : '▶'}
                </button>

                <div className="bg-slate-800/80 rounded-xl p-3 border border-slate-700/80 space-y-2 flex-shrink-0">
                  <div className="flex justify-between items-center text-xs font-extrabold text-blue-300">
                    <span>⚡ 상권 분석 API 기능 선택</span>
                    <span className="text-[10px] bg-blue-950/80 text-blue-300 px-2 py-0.5 rounded-md border border-blue-800/60 font-bold">1개 연동됨</span>
                  </div>

                  <div className="grid grid-cols-1 gap-2 pt-0.5">
                    <button
                      type="button"
                      onClick={handleToggleNearbyStores}
                      disabled={isLoading}
                      className={`w-full p-2.5 rounded-xl border text-xs font-bold transition flex items-center justify-between cursor-pointer ${
                        activeApi === 'nearby_stores'
                          ? 'bg-blue-600 border-blue-400 text-white shadow-lg ring-2 ring-blue-400/50'
                          : 'bg-slate-800 border-slate-700/80 hover:bg-slate-750 text-slate-200 hover:border-slate-600'
                      }`}
                    >
                      <div className="flex items-center gap-2">
                        <span className="text-base">🏪</span>
                        <div className="text-left">
                          <div className="font-extrabold text-xs">근처 상가 (300m)</div>
                          <div className={`text-[10px] ${activeApi === 'nearby_stores' ? 'text-blue-100' : 'text-slate-400'}`}>
                            소상공인시장진흥공단 API
                          </div>
                        </div>
                      </div>
                      <span className={`text-[10px] px-2 py-0.5 rounded-full font-extrabold ${
                        activeApi === 'nearby_stores' ? 'bg-white text-blue-700' : 'bg-slate-900 text-slate-400'
                      }`}>
                        {activeApi === 'nearby_stores' ? 'ON (조회 완료)' : '선택 실행'}
                      </span>
                    </button>
                    
                    <button
                      type="button"
                      onClick={handleToggleFranchise}
                      disabled={isFranchiseLoading}
                      className={`w-full p-2.5 rounded-xl border text-xs font-bold transition flex items-center justify-between cursor-pointer ${
                        activeApi === 'franchise'
                          ? 'bg-blue-600 border-blue-400 text-white shadow-lg ring-2 ring-blue-400/50'
                          : 'bg-slate-800 border-slate-700/80 hover:bg-slate-750 text-slate-200 hover:border-slate-600'
                      }`}
                    >
                      <div className="flex items-center gap-2">
                        <span className="text-base">📊</span>
                        <div className="text-left">
                          <div className="font-extrabold text-xs">프랜차이즈 지역 분포</div>
                          <div className={`text-[10px] ${activeApi === 'franchise' ? 'text-blue-100' : 'text-slate-400'}`}>
                            공정거래위원회 API
                          </div>
                        </div>
                      </div>
                      <span className={`text-[10px] px-2 py-0.5 rounded-full font-extrabold ${
                        activeApi === 'franchise' ? 'bg-white text-blue-700' : 'bg-slate-900 text-slate-400'
                      }`}>
                        {activeApi === 'franchise' ? 'ON (조회 완료)' : '선택 실행'}
                      </span>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {/* 우측 패널: API 결과 표시 영역 (토글 가능) */}
            {activeApi === 'nearby_stores' && (
              <div className={`absolute top-4 z-10 transition-all duration-300 ${isResultPanelOpen ? 'right-4' : '-right-80 sm:-right-96'}`}>
                <div className="w-80 sm:w-96 bg-slate-900/95 border border-slate-700/90 backdrop-blur-xl rounded-2xl shadow-2xl p-4 text-white space-y-3.5 max-h-[calc(100vh-80px)] flex flex-col relative">
                  {/* 토글 버튼 */}
                  <button 
                    onClick={() => setIsResultPanelOpen(!isResultPanelOpen)} 
                    className="absolute top-1/2 -translate-y-1/2 -left-8 w-8 h-16 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 border-r-0 rounded-l-xl shadow-lg flex items-center justify-center cursor-pointer transition-colors"
                  >
                    {isResultPanelOpen ? '▶' : '◀'}
                  </button>
                  
                  <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1">
                  {/* 반경 300m 요약 바 */}
                  <div className="bg-slate-800/90 rounded-xl p-2.5 border border-slate-700/80 flex justify-between items-center text-xs flex-shrink-0 mb-1">
                    <span className="text-[11px] font-bold text-blue-300">⭕ 반경: <strong className="text-sky-400">300m</strong></span>
                    <span className="text-xs font-black text-amber-400 bg-amber-950/80 px-2 py-0.5 rounded-full border border-amber-700/80">
                      🏪 상가업소: <strong>{storeCount}개</strong>
                    </span>
                  </div>

                  {isLoading ? (
                    <div className="py-8 text-center text-xs text-slate-400 space-y-2">
                      <div className="animate-spin text-lg">⏳</div>
                      <p>반경 300m 상가업소를 불러오는 중...</p>
                    </div>
                  ) : Object.keys(groupedStores).length === 0 ? (
                    <div className="py-8 text-center text-xs text-slate-400">
                      반경 300m 이내에 검색된 상가가 없습니다.
                    </div>
                  ) : (
                    <>
                    {/* 전체 펼치기 / 접기 버튼 Bar */}
                    <div className="flex justify-between items-center pb-1 text-[11px] text-slate-400 border-b border-slate-700/50 mb-2">
                      <span className="font-bold text-slate-300">업종 분류 ({Object.keys(groupedStores).length}개)</span>
                      <div className="flex gap-2 text-[10px]">
                        <button
                          type="button"
                          onClick={expandAllCategories}
                          className="text-blue-400 hover:text-blue-300 transition cursor-pointer font-bold"
                        >
                          📂 전체 펼치기
                        </button>
                        <span className="text-slate-600">|</span>
                        <button
                          type="button"
                          onClick={collapseAllCategories}
                          className="text-slate-400 hover:text-amber-300 transition cursor-pointer font-bold"
                        >
                          📁 전체 접기
                        </button>
                      </div>
                    </div>

                    {Object.entries(groupedStores).map(([mainCategory, subMap]) => {
                      const isMainCollapsed = !!collapsedCategories[mainCategory];
                      const mainStoreCount = Object.values(subMap).reduce((sum, list) => sum + list.length, 0);

                      return (
                        <div key={mainCategory} className="space-y-1.5">
                          {/* 1단계: 대분류 카테고리 헤더 */}
                          <div
                            onClick={() => toggleCategory(mainCategory)}
                            className="flex justify-between items-center sticky top-0 bg-slate-800/95 py-1.5 px-2.5 rounded-xl border-l-4 border-blue-500 backdrop-blur-md cursor-pointer hover:bg-slate-700/90 transition select-none shadow-sm z-10"
                          >
                            <div className="flex items-center gap-1.5 min-w-0">
                              <span className={`text-[10px] text-blue-400 transition-transform duration-200 inline-block ${isMainCollapsed ? '' : 'rotate-90'}`}>
                                ▶
                              </span>
                              <span className="text-xs font-black text-blue-200 truncate">
                                📁 {mainCategory}
                              </span>
                            </div>
                            <span className="text-[10px] bg-slate-900 text-slate-300 font-bold px-2 py-0.5 rounded-full border border-slate-700/80 flex-shrink-0">
                              {mainStoreCount}개
                            </span>
                          </div>

                          {/* 2단계: 소분류 카테고리 그룹 (대분류가 펼쳐져 있을 때만) */}
                          {!isMainCollapsed && (
                            <div className="pl-2 space-y-1.5 pt-0.5">
                              {Object.entries(subMap).map(([subCategory, stores]) => {
                                const subKey = `${mainCategory}::${subCategory}`;
                                const isSubCollapsed = !!collapsedSubCategories[subKey];

                                return (
                                  <div key={subCategory} className="space-y-1">
                                    {/* 소분류 카테고리 헤더 */}
                                    <div
                                      onClick={() => toggleSubCategory(mainCategory, subCategory)}
                                      className="flex justify-between items-center bg-slate-800/80 py-1 px-2.5 rounded-lg border-l-2 border-sky-400 cursor-pointer hover:bg-slate-750 transition select-none text-xs"
                                    >
                                      <div className="flex items-center gap-1.5 min-w-0">
                                        <span className={`text-[9px] text-sky-400 transition-transform duration-200 inline-block ${isSubCollapsed ? '' : 'rotate-90'}`}>
                                          ▶
                                        </span>
                                        <span className="text-xs font-bold text-sky-300 truncate">
                                          🏷️ {subCategory}
                                        </span>
                                      </div>
                                      <span className="text-[9px] bg-slate-900/80 text-sky-200 font-bold px-1.5 py-0.5 rounded-md border border-slate-700/60 flex-shrink-0">
                                        {stores.length}개
                                      </span>
                                    </div>

                                    {/* 3단계: 세부 상가 업소 리스트 (소분류가 펼쳐져 있을 때만) */}
                                    {!isSubCollapsed && (
                                      <ul className="space-y-1 pl-1.5 pt-0.5">
                                        {stores.map((store) => {
                                          const bId = store.bizesId || `store_${Math.random()}`;
                                          const isSelected = selectedBizesId === bId;

                                          return (
                                            <li
                                              key={bId}
                                              data-id={bId}
                                              onClick={() => highlightStoreMarker(bId)}
                                              className={`p-2.5 rounded-xl border transition cursor-pointer text-xs ${
                                                isSelected
                                                  ? 'bg-amber-500/20 border-amber-400 text-amber-200 shadow-md ring-1 ring-amber-400'
                                                  : 'bg-slate-800/50 border-slate-700/60 hover:bg-slate-800 hover:border-slate-600 text-slate-200'
                                              }`}
                                            >
                                              <div className="flex justify-between items-start mb-0.5">
                                                <strong className="font-extrabold text-white text-xs truncate max-w-[200px]">
                                                  {store.bizesNm}
                                                </strong>
                                                <span className="text-[10px] text-blue-400 font-bold bg-blue-950/60 px-1.5 py-0.5 rounded border border-blue-800/50">
                                                  {subCategory}
                                                </span>
                                              </div>
                                              <p className="text-[10px] text-slate-400 truncate">
                                                📍 {store.rdnmAdr || store.lnoAdr || '주소 미상'}
                                              </p>
                                            </li>
                                          );
                                        })}
                                      </ul>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </>
                  )}
                </div>

                <div className="text-[9px] text-slate-400 text-center pt-1 border-t border-slate-800 flex-shrink-0">
                  💡 목록 클릭 시 해당 마커로 지도 이동 및 황금색 핀 하이라이트 표시
                </div>
              </div>
              </div>
            )}

            {/* 우측 패널 2: 프랜차이즈 API 결과 표시 영역 (토글 가능) */}
            {activeApi === 'franchise' && (
              <div className={`absolute top-4 z-10 transition-all duration-300 ${isResultPanelOpen ? 'right-4' : '-right-80 sm:-right-96'}`}>
                <div className="w-80 sm:w-96 bg-slate-900/95 border border-slate-700/90 backdrop-blur-xl rounded-2xl shadow-2xl p-4 text-white space-y-3.5 max-h-[calc(100vh-80px)] flex flex-col relative">
                  {/* 토글 버튼 */}
                  <button 
                    onClick={() => setIsResultPanelOpen(!isResultPanelOpen)} 
                    className="absolute top-1/2 -translate-y-1/2 -left-8 w-8 h-16 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 border-r-0 rounded-l-xl shadow-lg flex items-center justify-center cursor-pointer transition-colors"
                  >
                    {isResultPanelOpen ? '▶' : '◀'}
                  </button>
                  
                  <div className="flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-1">
                    <div className="bg-slate-800/90 rounded-xl p-3 border border-slate-700/80 flex flex-col gap-2">
                      <div className="text-[11px] font-bold text-blue-300">📊 프랜차이즈 매장 검색</div>
                      
                      <div className="flex gap-2">
                        <input
                          type="text"
                          value={franchiseBrandNo}
                          onChange={(e) => setFranchiseBrandNo(e.target.value)}
                          placeholder="브랜드명 검색 (데모)"
                          className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
                        />
                        <button
                          onClick={fetchFranchiseData}
                          disabled={isFranchiseLoading}
                          className="bg-blue-600 hover:bg-blue-500 font-bold text-xs px-3 py-1.5 rounded-lg transition"
                        >
                          {isFranchiseLoading ? '⏳' : '검색'}
                        </button>
                      </div>
                    </div>

                    {isFranchiseLoading ? (
                      <div className="py-8 text-center text-xs text-slate-400">데이터를 불러오는 중...</div>
                    ) : (
                      <>
                        <div className="grid grid-cols-2 gap-2">
                          <div className="bg-slate-800/90 p-3 rounded-xl border border-slate-700/80 text-center">
                            <div className="text-[10px] text-slate-400 mb-1">총 매장 수</div>
                            <div className="text-sm font-black text-amber-400">{franchiseSummary.totalStores.toLocaleString()}개</div>
                          </div>
                          <div className="bg-slate-800/90 p-3 rounded-xl border border-slate-700/80 text-center">
                            <div className="text-[10px] text-slate-400 mb-1">총 가맹점 수</div>
                            <div className="text-sm font-black text-blue-400">{franchiseSummary.totalFrcs.toLocaleString()}개</div>
                          </div>
                        </div>

                        <div className="space-y-2 mt-2">
                          {franchiseData.map((item, idx) => {
                            const frcs = parseInt(item.frcsCnt) || 0;
                            const drtms = parseInt(item.drtmsCnt) || 0;
                            return (
                              <div key={idx} className="bg-slate-800/50 p-2.5 rounded-xl border border-slate-700/60 flex justify-between items-center text-xs">
                                <span className="font-bold text-slate-200">{item.ctprvnNm}</span>
                                <div className="text-right">
                                  <div className="text-amber-300 font-bold">매장 {frcs + drtms}개</div>
                                  <div className="text-[9px] text-slate-400">가맹 {frcs} / 직영 {drtms}</div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* Kakao Map 지도 영역 100% */}
            <div ref={mapContainerRef} className="w-full h-[calc(100vh-64px)] z-0" />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
