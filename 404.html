    function getKoreanIndustryName(input) {
      if (!input || input === '미입력') return '미입력';
      const trimmed = input.trim();

      if (window.industryDatabase && Array.isArray(window.industryDatabase.industry_master)) {
        const codeMatch = trimmed.match(/([A-Z0-9]{4,7})/i);
        if (codeMatch) {
          const code = codeMatch[1].toUpperCase();
          const item = window.industryDatabase.industry_master.find(x => 
            x.small_code === code || x.middle_code === code || x.major_code === code
          );
          if (item) {
            return item.small_name || item.middle_name || item.major_name;
          }
        }
      }

      let clean = trimmed.replace(/\s*\/\s*[A-Z0-9]+$/i, '').replace(/^[A-Z0-9]+$/i, '').trim();
      return clean || trimmed;
    }

    function formatIndustryName(cat, ind) {
      let catKorean = getKoreanIndustryName(cat);
      let indKorean = getKoreanIndustryName(ind);

      if (catKorean === '미입력') catKorean = '';
      if (indKorean === '미입력') indKorean = '';

      if (catKorean && indKorean && catKorean !== indKorean) {
        return `${catKorean} > ${indKorean}`;
      }
      return catKorean || indKorean || '미입력';
    }

    function getIndustryParts(cat, ind) {
      let catKorean = getKoreanIndustryName(cat);
      let indKorean = getKoreanIndustryName(ind);

      if (catKorean === '미입력') catKorean = '';
      if (indKorean === '미입력') indKorean = '';

      if (catKorean && indKorean && catKorean !== indKorean) {
        return { major: catKorean, small: indKorean };
      }
      return { major: catKorean || indKorean || '미입력', small: '' };
    }

    function formatRegionAddress(prov, city) {
      const p = (prov && prov !== '미입력') ? prov.trim() : '';
      const c = (city && city !== '미입력') ? city.trim() : '';
      if (p && c) return `${p} ${c}`;
      return p || c || '-';
    }

    const getRowBgClass = (status) => {
      if (status === '계약완료') return 'bg-emerald-950/60 hover:bg-emerald-900/60 border-emerald-800/80';
      if (status === '이탈/거절' || status === '비가망') return 'bg-rose-950/50 hover:bg-rose-900/50 border-rose-800/60';
      if (!status || status === '신규') return 'bg-blue-950/40 hover:bg-blue-900/40 border-blue-800/60 font-semibold';
      return 'border-b border-slate-800/60 hover:bg-slate-800/50';
    };

    function AdminDashboardPage({ setView, leads, setSelectedLeadId, adminUser, refreshLeads, updateLeadStatus, deleteLead, handleLogout, handleGoHome }) {
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [searchTerm, setSearchTerm] = useState('');

      // 퍼널 단계별 수치 계산
      const totalLeads = leads.length;
      const newLeadsCount = leads.filter(l => l.status === '신규').length;
      const consultCount = leads.filter(l => ['상담예정', '상담완료'].includes(l.status)).length;
      const meetingCount = leads.filter(l => ['미팅예정', '미팅완료'].includes(l.status)).length;
      const contractProcessCount = leads.filter(l => l.status === '계약진행').length;
      const contractDoneCount = leads.filter(l => l.status === '계약완료').length;
      const droppedCount = leads.filter(l => ['비가망', '유예/보류', '이탈/거절'].includes(l.status)).length;

      const getRatio = (count) => (totalLeads > 0 ? Math.round((count / totalLeads) * 100) : 0);

      // 필터링 적용
      const filteredLeads = leads.filter(l => {
        // 퍼널 단계 필터
        if (filterStatus === 'NEW' && l.status !== '신규') return false;
        if (filterStatus === 'CONSULT' && !['상담예정', '상담완료'].includes(l.status)) return false;
        if (filterStatus === 'MEETING' && !['미팅예정', '미팅완료'].includes(l.status)) return false;
        if (filterStatus === 'CONTRACT' && l.status !== '계약진행') return false;
        if (filterStatus === 'DONE' && l.status !== '계약완료') return false;
        if (filterStatus === 'DROPPED' && !['비가망', '유예/보류', '이탈/거절'].includes(l.status)) return false;
        if (filterStatus !== 'ALL' && filterStatus !== 'NEW' && filterStatus !== 'CONSULT' && filterStatus !== 'MEETING' && filterStatus !== 'CONTRACT' && filterStatus !== 'DONE' && filterStatus !== 'DROPPED' && l.status !== filterStatus) return false;

        // 검색어 필터 (성함, 연락처, 지역, 상권유형, 예산, 희망업종, 창업시기, 운영방식 등 3분 진단 전 항목 검색 지원)
        if (searchTerm.trim()) {
          const kw = searchTerm.toLowerCase();
          const matchName = l.name && l.name.toLowerCase().includes(kw);
          const matchPhone = l.phone && l.phone.includes(kw);
          const matchRegion = ( (l.region_province || '') + ' ' + (l.region_city || '') + ' ' + (l.region_type || '') ).toLowerCase().includes(kw);
          const matchBudget = l.budget && l.budget.toLowerCase().includes(kw);
          const matchIndustry = ( (l.industry_category || '') + ' ' + (l.industry || '') ).toLowerCase().includes(kw);
          const matchOp = l.operation_type && l.operation_type.toLowerCase().includes(kw);
          const matchExp = l.experience && l.experience.toLowerCase().includes(kw);
          const matchPeriod = l.startup_period && l.startup_period.toLowerCase().includes(kw);
          return matchName || matchPhone || matchRegion || matchBudget || matchIndustry || matchOp || matchExp || matchPeriod;
        }

        return true;
      });

      return (
        <div className="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
          <AdminNav setView={setView} currentView="admin_dashboard" adminUser={adminUser} refreshLeads={refreshLeads} handleLogout={handleLogout} handleGoHome={handleGoHome} />

          <main className="flex-1 max-w-[1600px] w-full mx-auto px-4 py-8 space-y-6">
            
            {/* 상단 타이틀 & 실시간 수신 상태 */}
            <div className="bg-slate-900/90 border border-slate-800 backdrop-blur-xl rounded-2xl p-6 shadow-xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="bg-blue-600/20 text-blue-400 text-xs font-black px-2.5 py-1 rounded-md border border-blue-500/30">
                    통합 CRM 대시보드
                  </span>
                  <span className="text-xs text-slate-400 font-bold">3분 창업진단 DB & 영업 퍼널 파이프라인</span>
                </div>
                <h1 className="text-2xl font-black text-white tracking-tight">📊 고객 DB 관리 및 퍼널 분석 대시보드</h1>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={refreshLeads}
                  className="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs px-3 py-2 rounded-xl border border-slate-700 transition flex items-center gap-1.5 cursor-pointer active:scale-95"
                >
                  🔄 DB 새로고침
                </button>
                <span className="text-xs font-black text-emerald-400 bg-emerald-950/80 border border-emerald-800/80 px-3 py-2 rounded-xl flex items-center gap-1.5 shadow">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                  실시간 DB 연동 ({totalLeads}건)
                </span>
              </div>
            </div>

            {/* 퍼널 프로세스 파이프라인 대시보드 (최상단 통합 배치) */}
            <div className="bg-slate-900/90 border border-slate-800 backdrop-blur-xl rounded-2xl p-6 shadow-xl space-y-4">
              <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                <h2 className="text-sm font-black text-white flex items-center gap-2">
                  ⚡ 고객 영업 진행 단계별 퍼널 (Process Pipeline)
                  <span className="text-xs text-slate-400 font-normal hidden sm:inline">(각 파이프라인 단계를 클릭하면 해당 고객만 필터링됩니다)</span>
                </h2>
                {filterStatus !== 'ALL' && (
                  <button
                    onClick={() => setFilterStatus('ALL')}
                    className="text-xs text-sky-400 hover:text-sky-300 font-bold underline cursor-pointer"
                  >
                    전체 DB 보기 ({totalLeads}명)
                  </button>
                )}
              </div>

              {/* 퍼널 프로세스 카드 5단계 파이프라인 */}
              <div className="grid grid-cols-1 sm:grid-cols-5 gap-3">
                {/* 1단계: 신규 접수 */}
                <div
                  onClick={() => setFilterStatus(filterStatus === 'NEW' ? 'ALL' : 'NEW')}
                  className={`p-4 rounded-xl border transition cursor-pointer ${
                    filterStatus === 'NEW'
                      ? 'bg-blue-900/60 border-blue-500 ring-2 ring-blue-500/50 shadow-lg'
                      : 'bg-slate-950/80 border-slate-800 hover:border-slate-700 hover:bg-slate-900'
                  }`}
                >
                  <div className="flex items-center justify-between text-xs font-bold text-slate-400 mb-1">
                    <span>1. ✨ 신규 접수</span>
                    <span className="text-[10px] bg-blue-950 text-blue-300 px-1.5 py-0.5 rounded border border-blue-800">{getRatio(newLeadsCount)}%</span>
                  </div>
                  <div className="text-2xl font-black text-blue-400">{newLeadsCount}<span className="text-xs font-bold text-slate-400">명</span></div>
                  <div className="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                    <div className="bg-blue-500 h-full transition-all duration-500" style={{ width: `${getRatio(newLeadsCount)}%` }}></div>
                  </div>
                </div>

                {/* 2단계: 전화 상담 */}
                <div
                  onClick={() => setFilterStatus(filterStatus === 'CONSULT' ? 'ALL' : 'CONSULT')}
                  className={`p-4 rounded-xl border transition cursor-pointer ${
                    filterStatus === 'CONSULT'
                      ? 'bg-sky-900/60 border-sky-500 ring-2 ring-sky-500/50 shadow-lg'
                      : 'bg-slate-950/80 border-slate-800 hover:border-slate-700 hover:bg-slate-900'
                  }`}
                >
                  <div className="flex items-center justify-between text-xs font-bold text-slate-400 mb-1">
                    <span>2. 📞 전화 상담</span>
                    <span className="text-[10px] bg-sky-950 text-sky-300 px-1.5 py-0.5 rounded border border-sky-800">{getRatio(consultCount)}%</span>
                  </div>
                  <div className="text-2xl font-black text-sky-400">{consultCount}<span className="text-xs font-bold text-slate-400">명</span></div>
                  <div className="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                    <div className="bg-sky-500 h-full transition-all duration-500" style={{ width: `${getRatio(consultCount)}%` }}></div>
                  </div>
                </div>

                {/* 3단계: 대면 미팅 */}
                <div
                  onClick={() => setFilterStatus(filterStatus === 'MEETING' ? 'ALL' : 'MEETING')}
                  className={`p-4 rounded-xl border transition cursor-pointer ${
                    filterStatus === 'MEETING'
                      ? 'bg-indigo-900/60 border-indigo-500 ring-2 ring-indigo-500/50 shadow-lg'
                      : 'bg-slate-950/80 border-slate-800 hover:border-slate-700 hover:bg-slate-900'
                  }`}
                >
                  <div className="flex items-center justify-between text-xs font-bold text-slate-400 mb-1">
                    <span>3. 🤝 대면 미팅</span>
                    <span className="text-[10px] bg-indigo-950 text-indigo-300 px-1.5 py-0.5 rounded border border-indigo-800">{getRatio(meetingCount)}%</span>
                  </div>
                  <div className="text-2xl font-black text-indigo-400">{meetingCount}<span className="text-xs font-bold text-slate-400">명</span></div>
                  <div className="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                    <div className="bg-indigo-500 h-full transition-all duration-500" style={{ width: `${getRatio(meetingCount)}%` }}></div>
                  </div>
                </div>

                {/* 4단계: 계약 진행 */}
                <div
                  onClick={() => setFilterStatus(filterStatus === 'CONTRACT' ? 'ALL' : 'CONTRACT')}
                  className={`p-4 rounded-xl border transition cursor-pointer ${
                    filterStatus === 'CONTRACT'
                      ? 'bg-purple-900/60 border-purple-500 ring-2 ring-purple-500/50 shadow-lg'
                      : 'bg-slate-950/80 border-slate-800 hover:border-slate-700 hover:bg-slate-900'
                  }`}
                >
                  <div className="flex items-center justify-between text-xs font-bold text-slate-400 mb-1">
                    <span>4. 📝 계약 검토</span>
                    <span className="text-[10px] bg-purple-950 text-purple-300 px-1.5 py-0.5 rounded border border-purple-800">{getRatio(contractProcessCount)}%</span>
                  </div>
                  <div className="text-2xl font-black text-purple-400">{contractProcessCount}<span className="text-xs font-bold text-slate-400">명</span></div>
                  <div className="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                    <div className="bg-purple-500 h-full transition-all duration-500" style={{ width: `${getRatio(contractProcessCount)}%` }}></div>
                  </div>
                </div>

                {/* 5단계: 최종 계약 완료 */}
                <div
                  onClick={() => setFilterStatus(filterStatus === 'DONE' ? 'ALL' : 'DONE')}
                  className={`p-4 rounded-xl border transition cursor-pointer ${
                    filterStatus === 'DONE'
                      ? 'bg-emerald-900/60 border-emerald-500 ring-2 ring-emerald-500/50 shadow-lg'
                      : 'bg-slate-950/80 border-slate-800 hover:border-slate-700 hover:bg-slate-900'
                  }`}
                >
                  <div className="flex items-center justify-between text-xs font-bold text-slate-400 mb-1">
                    <span>5. 🎉 계약 완료</span>
                    <span className="text-[10px] bg-emerald-950 text-emerald-300 px-1.5 py-0.5 rounded border border-emerald-800">{getRatio(contractDoneCount)}%</span>
                  </div>
                  <div className="text-2xl font-black text-emerald-400">{contractDoneCount}<span className="text-xs font-bold text-slate-400">명</span></div>
                  <div className="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                    <div className="bg-emerald-500 h-full transition-all duration-500" style={{ width: `${getRatio(contractDoneCount)}%` }}></div>
                  </div>
                </div>
              </div>
            </div>

            {/* 종합 고객 DB 표 (Customer Lead Table) */}
            <div className="bg-slate-900/90 border border-slate-800 backdrop-blur-xl rounded-2xl p-6 shadow-xl space-y-4">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                <div className="flex items-center gap-3">
                  <h2 className="text-sm font-black text-white flex items-center gap-2">
                    📋 3분 창업진단 연동 종합 고객 DB 리스트
                    <span className="bg-blue-950 text-blue-300 text-xs px-2.5 py-0.5 rounded-full border border-blue-800 font-bold">
                      표시: {filteredLeads.length}건 / 총 {totalLeads}건
                    </span>
                  </h2>
                </div>

                {/* 검색 및 필터 컨트롤 */}
                <div className="flex flex-wrap items-center gap-2">
                  <input
                    type="text"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    placeholder="성함, 연락처, 지역, 상권, 예산, 업종 검색..."
                    className="bg-slate-950 border border-slate-800 text-xs text-white placeholder-slate-500 rounded-xl px-3.5 py-2 w-52 sm:w-64 focus:outline-none focus:border-blue-500"
                  />
                  <select
                    value={filterStatus}
                    onChange={(e) => setFilterStatus(e.target.value)}
                    className="bg-slate-950 border border-slate-800 text-xs text-white rounded-xl px-3.5 py-2 focus:outline-none focus:border-blue-500 font-bold cursor-pointer"
                  >
                    <option value="ALL">전체 단계</option>
                    <option value="NEW">✨ 신규</option>
                    <option value="CONSULT">📞 전화상담 (예정/완료)</option>
                    <option value="MEETING">🤝 대면미팅 (예정/완료)</option>
                    <option value="CONTRACT">📝 계약진행</option>
                    <option value="DONE">🎉 계약완료</option>
                    <option value="DROPPED">🚫 보류/이탈 (비가망/유예)</option>
                  </select>
                </div>
              </div>

              {/* 고객 DB 테이블 */}
              <div className="overflow-x-auto custom-scrollbar">
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="bg-slate-800/90 text-slate-300 font-extrabold border-b border-slate-700">
                      <th className="py-3 px-2">접수일시</th>
                      <th className="py-3 px-2">성함</th>
                      <th className="py-3 px-2">연락처</th>
                      <th className="py-3 px-2">희망지역 & 상권유형</th>
                      <th className="py-3 px-2">창업 예산</th>
                      <th className="py-3 px-2">희망 업종</th>
                      <th className="py-3 px-2">시기 / 운영방식</th>
                      <th className="py-3 px-2">창업경험 / 규모</th>
                      <th className="py-3 px-2">진단 등급</th>
                      <th className="py-3 px-2">상담 희망일</th>
                      <th className="py-3 px-2">진행단계</th>
                      <th className="py-3 px-2 text-center">관리</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60">
                    {filteredLeads.length === 0 ? (
                      <tr>
                        <td colSpan="12" className="py-12 text-center text-slate-500 font-semibold">
                          접수된 고객 DB 정보가 없거나 검색 조건에 부합하는 리드가 없습니다.
                        </td>
                      </tr>
                    ) : (
                      filteredLeads.map((l) => {
                        const dateStr = l.created_at ? l.created_at.slice(0, 10) : '-';
                        const regionAddr = formatRegionAddress(l.region_province, l.region_city);
                        const indParts = getIndustryParts(l.industry_category, l.industry);

                        return (
                          <tr key={l.id} className={`hover:bg-slate-800/50 transition-colors ${getRowBgClass(l.status)}`}>
                            <td className="py-2.5 px-2 text-slate-500 font-mono text-[11px] whitespace-nowrap">
                              {dateStr}
                            </td>
                            <td
                              onClick={() => { setSelectedLeadId(l.id); setView('admin_detail'); }}
                              className="py-2.5 px-2 font-bold text-white hover:text-blue-400 cursor-pointer whitespace-nowrap"
                            >
                              {l.name}
                            </td>
                            <td className="py-2.5 px-2 font-mono text-slate-300 whitespace-nowrap">
                              <div className="flex items-center gap-1">
                                <span>{l.phone}</span>
                                <a href={`tel:${l.phone ? l.phone.replace(/-/g,'') : ''}`} className="text-[10px] bg-slate-800 hover:bg-blue-600 text-slate-300 hover:text-white px-1.5 py-0.5 rounded border border-slate-700">전화</a>
                              </div>
                            </td>
                            <td className="py-2.5 px-2 text-slate-300 text-[11px] whitespace-nowrap">
                              <div className="font-bold text-white max-w-[170px] truncate" title={regionAddr}>
                                {regionAddr}
                              </div>
                              <div className="text-sky-400 font-bold text-[10px]">
                                {l.region_type && l.region_type !== '미입력' ? l.region_type : ''}
                              </div>
                            </td>
                            <td className="py-2.5 px-2 font-bold text-emerald-400 whitespace-nowrap">
                              {l.budget === '미입력' ? <span className="text-slate-500 text-[11px]">미입력</span> : l.budget}
                            </td>
                            <td className="py-2.5 px-2 text-slate-300 text-[11px] whitespace-nowrap">
                              <div className="font-bold text-white max-w-[140px] truncate" title={indParts.major}>
                                {indParts.major}
                              </div>
                              <div className="text-sky-300 font-semibold text-[10px] max-w-[140px] truncate" title={indParts.small}>
                                {indParts.small}
                              </div>
                            </td>
                            <td className="py-2.5 px-2 text-slate-300 text-[11px] whitespace-nowrap">
                              <div>{l.startup_period || '미입력'}</div>
                              <div className="text-slate-400">{l.operation_type || '미입력'}</div>
                            </td>
                            <td className="py-2.5 px-2 text-slate-300 text-[11px] whitespace-nowrap">
                              <div>{l.experience || '미입력'}</div>
                              <div className="text-slate-400">{l.store_size || '미입력'}</div>
                            </td>
                            <td className="py-2.5 px-2 whitespace-nowrap">
                              <span className={`px-2 py-0.5 rounded text-[11px] font-extrabold badge-${l.lead_grade ? l.lead_grade.toLowerCase() : 'a'}`}>
                                {l.lead_grade || 'A'}급 ({l.customer_diagnosis_score || l.lead_score || 80}점)
                              </span>
                            </td>
                            <td className="py-2.5 px-2 text-blue-400 font-mono text-[11px] font-bold whitespace-nowrap">
                              {l.preferred_consultation_date || '-'}
                            </td>
                            <td className="py-2.5 px-2 whitespace-nowrap">
                              <StatusSelect value={l.status} onChange={(e) => updateLeadStatus(l.id, e.target.value)} />
                            </td>
                            <td className="py-2.5 px-2 text-center whitespace-nowrap">
                              <div className="flex items-center justify-center gap-1">
                                <button
                                  onClick={() => { setSelectedLeadId(l.id); setView('admin_detail'); }}
                                  className="bg-slate-800 hover:bg-blue-600 text-slate-300 hover:text-white font-bold px-2 py-1 rounded text-[11px] transition cursor-pointer"
                                >
                                  🔍 상세
                                </button>
                                <button
                                  onClick={(e) => deleteLead(l.id, e)}
                                  className="bg-rose-950/80 hover:bg-rose-600 text-rose-300 hover:text-white font-bold px-2 py-1 rounded text-[11px] border border-rose-800/60 transition cursor-pointer"
                                >
                                  🗑️ 삭제
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>
        </div>
      );
    }

    function AdminLeadsPage(props) {
      return <AdminDashboardPage {...props} />;
    }

    function AdminFunnelPage(props) {
      return <AdminDashboardPage {...props} />;
    }

    function AdminDetailPage({ setView, leads, setLeads, selectedLeadId, adminUser, updateLeadStatus, updateLeadDetails, deleteLead, handleLogout, handleGoHome }) {
      const lead = leads.find(l => l.id === selectedLeadId) || leads[0];
      const [isEditing, setIsEditing] = useState(false);
      
      const [editBudget, setEditBudget] = useState('');
      const [editPurpose, setEditPurpose] = useState('');
      const [editPeriod, setEditPeriod] = useState('');
      const [editOpType, setEditOpType] = useState('');
      const [editCity, setEditCity] = useState('');
      const [editRegionType, setEditRegionType] = useState('');
      const [editIndustry, setEditIndustry] = useState('');

      const [history, setHistory] = useState([]);
      const [editingHistoryId, setEditingHistoryId] = useState(null);
      const [editingHistoryText, setEditingHistoryText] = useState('');
      const [note, setNote] = useState('');

      useEffect(() => {
        if (lead) {
          const rawBudget = lead.budget || '미입력';
          setEditBudget(rawBudget.replace('만원', '').trim());
          setEditPurpose(lead.startup_purpose || '미입력');
          setEditPeriod(lead.startup_period || '미입력');
          setEditOpType(lead.operation_type || '미입력');
          setEditCity((lead.region_city === '미입력') ? '' : (lead.region_city || ''));
          setEditRegionType((lead.region_type === '미입력') ? '' : (lead.region_type || ''));
          setEditIndustry(getKoreanIndustryName(lead.industry || '미입력'));

          setHistory(Array.isArray(lead.history) ? lead.history : []);
        }
      }, [lead]);

      const addNote = (e) => {
        e.preventDefault();
        if (!note.trim()) return;
        const newEntry = {
          id: Date.now(),
          author: adminUser ? adminUser.split('@')[0] : '영업담당자',
          content: note.trim(),
          date: new Date().toISOString().slice(0, 16).replace('T', ' ')
        };
        const updatedHistory = [newEntry, ...history];
        setHistory(updatedHistory);
        setNote('');
        updateLeadDetails(lead.id, { history: updatedHistory });
      };

      const deleteHistoryItem = (id) => {
        if (!confirm('이 상담 기록을 삭제하시겠습니까?')) return;
        const updatedHistory = history.filter(h => h.id !== id);
        setHistory(updatedHistory);
