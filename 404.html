          { offset: new window.kakao.maps.Point(18, 42) }
        );

        centerMarkerRef.current = new window.kakao.maps.Marker({
          position: centerLatLng,
          image: redMarkerImage,
          zIndex: 10
        });
        centerMarkerRef.current.setMap(map);

        // 3. 반경 300m 원(Circle) 시각화 (strokeColor: #00a0e9, strokeOpacity: 0.8, fillColor: #00a0e9, fillOpacity: 0.2)
        radiusCircleRef.current = new window.kakao.maps.Circle({
          center: centerLatLng,
          radius: 300,
          strokeWeight: 1,
          strokeColor: '#00a0e9',
          strokeOpacity: 0.9,
          strokeStyle: 'solid',
          fillColor: '#00a0e9',
          fillOpacity: 0.2
        });
        radiusCircleRef.current.setMap(map);

        // Geocoder로 현재 주소 변환
        const geocoder = new window.kakao.maps.services.Geocoder();
        geocoder.coord2Address(lng, lat, (result, status) => {
          if (status === window.kakao.maps.services.Status.OK && result[0]) {
            setCurrentAddress(result[0].address ? result[0].address.address_name : '선택 위치');
          }
        });

        // 4. 소상공인시장진흥공단 반경내 상가업소 조회 API 요청 (radius=300)
        const targetUrl = `https://apis.data.go.kr/B553077/api/open/sdsc2/storeListInRadius?radius=300&cx=${lng}&cy=${lat}&type=json&numOfRows=100&ServiceKey=${SERVICE_KEY}`;
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

        try {
          const res = await fetch(proxyUrl).catch(() => null);
          let items = [];

          if (res && res.ok) {
            const data = await res.json().catch(() => null);
            if (data && data.body && data.body.items) {
              const rawItems = Array.isArray(data.body.items) ? data.body.items : [data.body.items];
              
              // 카카오맵 Polyline을 사용하여 실제 반경 300m 이내의 상가만 필터링
              items = rawItems.filter(store => {
                const storeLat = parseFloat(store.lat);
                const storeLng = parseFloat(store.lon);
                if (!storeLat || !storeLng) return false;
                const storePos = new window.kakao.maps.LatLng(storeLat, storeLng);
                const poly = new window.kakao.maps.Polyline({
                  path: [centerLatLng, storePos]
                });
                return poly.getLength() <= 300;
              });
            }
          }

          setStoreCount(items.length);

          // 5. 업종 대분류(indsLclsNm) -> 소분류(indsSclsNm / indsMclsNm) 2단계 데이터 그룹화
          const groups = items.reduce((acc, store) => {
            const mainCat = store.indsLclsNm || '기타 서비스';
            const subCat = store.indsSclsNm || store.indsMclsNm || '기타 업종';

            if (!acc[mainCat]) acc[mainCat] = {};
            if (!acc[mainCat][subCat]) acc[mainCat][subCat] = [];
            acc[mainCat][subCat].push(store);
            return acc;
          }, {});

          setGroupedStores(groups);
          setCollapsedCategories({});
          setCollapsedSubCategories({});

          // 6. 상가업소 마커 렌더링 및 markerMapRef 맵핑
          items.forEach(store => {
            const storeLat = parseFloat(store.lat);
            const storeLng = parseFloat(store.lon);
            const bId = store.bizesId || `store_${Math.random()}`;

            if (!storeLat || !storeLng) return;

            const storePos = new window.kakao.maps.LatLng(storeLat, storeLng);
            const storeMarker = new window.kakao.maps.Marker({
              position: storePos,
              image: defaultImg,
              map: map
            });

            const contentHtml = `
              <div style="padding: 12px; min-width: 200px; font-family: 'Pretendard', sans-serif; background: #ffffff; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);">
                <div style="font-weight: 800; font-size: 13px; color: #0f172a; margin-bottom: 4px; line-height: 1.3;">
                  🏢 ${store.bizesNm || '상가업소'}
                </div>
                <div style="display: inline-block; font-size: 10px; font-weight: 700; color: #2563eb; background: #eff6ff; padding: 2px 6px; border-radius: 4px; margin-bottom: 6px;">
                  ${store.indsLclsNm || ''} > ${store.indsSclsNm || store.indsMclsNm || '업종'}
                </div>
                <div style="font-size: 11px; color: #64748b; line-height: 1.4;">
                  📍 ${store.rdnmAdr || store.lnoAdr || '주소 정보 없음'}
                </div>
              </div>
            `;

            const infowindow = new window.kakao.maps.InfoWindow({
              content: contentHtml,
              removable: true
            });

            // 마커 맵핑 저장
            storeMarkerMapRef.current[bId] = {
              marker: storeMarker,
              infowindow: infowindow,
              store: store
            };

            // 마커 클릭 이벤트: 해당 리포트 하이라이트
            window.kakao.maps.event.addListener(storeMarker, 'click', () => {
              highlightStoreMarker(bId);
            });
          });
        } catch (err) {
          console.warn("storeListInRadius fetch warning:", err);
        } finally {
          setIsLoading(false);
        }
      };

      // 프랜차이즈 오버레이 초기화
      const clearFranchiseLayers = () => {
        if (franchiseOverlayRefs.current) {
          franchiseOverlayRefs.current.forEach(overlay => {
            if (overlay) overlay.setMap(null);
          });
        }
        franchiseOverlayRefs.current = [];
      };

      // 카카오 마커 및 인포윈도우 초기화
      const clearKakaoMarkers = () => {
        if (kakaoMarkerRefs.current && kakaoMarkerRefs.current.length > 0) {
          kakaoMarkerRefs.current.forEach(item => {
            if (item.marker) item.marker.setMap(null);
            if (item.infowindow) item.infowindow.close();
          });
        }
        kakaoMarkerRefs.current = [];
        if (activeKakaoInfoWindowRef.current) {
          activeKakaoInfoWindowRef.current.close();
          activeKakaoInfoWindowRef.current = null;
        }
      };

      // 전체 프랜차이즈 및 카카오 관련 상태/지도 오버레이 초기화 (예외 발생 시 실행)
      const clearAllFranchiseStateAndMap = () => {
        setFranchiseData([]);
        setFranchiseSummary({ totalFrcs: 0, totalDrtms: 0, totalStores: 0 });
        setKakaoStores([]);
        setSelectedKakaoStoreId(null);
        setIsKakaoPanelOpen(false);
        setSearchedRegion('');
        clearFranchiseLayers();
        clearKakaoMarkers();
      };

      // 공정위 가맹정보 API 조회 (더미 데이터 사용 금지 & 예외 처리 강화)
      const fetchFranchiseData = async () => {
        if (!mapObjRef.current || !window.kakao) return;
        setIsFranchiseLoading(true);
        clearAllFranchiseStateAndMap();

        const searchBrand = franchiseBrandNo.trim();
        let items = [];
        let data = null;

        try {
          const params = new URLSearchParams({
            ServiceKey: decodeURIComponent(SERVICE_KEY),
            pageNo: '1',
            numOfRows: '100',
            resultType: 'json'
          });
          if (franchiseYear) params.append('yr', franchiseYear);
          if (searchBrand) {
            params.append('brandNm', searchBrand);
          }

          const targetUrl = `https://apis.data.go.kr/1130000/FftcBrandFrcsDropInfo3_Service/getbrandFrcsDmsstus2?${params.toString()}`;
          const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

          let res = null;
          try {
            res = await fetch(proxyUrl);
          } catch(err1) {
            res = await fetch(targetUrl).catch(() => null);
          }

          if (res && res.ok) {
            const text = await res.text();
            try {
              data = JSON.parse(text);
            } catch(e) {
              data = null;
            }
          }
        } catch (err) {
          console.error("FTC API Error:", err);
          data = null;
        }

        if (data) {
          let raw = data?.response?.body?.items?.item 
                 || data?.response?.body?.items 
                 || data?.body?.items?.item 
                 || data?.body?.items 
                 || data?.items;
          if (raw) {
            if (Array.isArray(raw)) items = raw;
            else if (typeof raw === 'object') items = [raw];
          }
        }

        // 브랜드명 클라이언트 2차 검증 필터링
        if (searchBrand && items.length > 0) {
          const query = searchBrand.toLowerCase();
          const filtered = items.filter(item => {
            const bNm = (item.brandNm || item.fzbaNm || item.brdNm || '').toLowerCase();
            return !bNm || bNm.includes(query);
          });
          if (filtered.length > 0) {
            items = filtered;
          }
        }

        // API 응답 결과가 없거나, 통신 에러/유효하지 않은 데이터인 경우
        if (!items || items.length === 0) {
          setIsFranchiseLoading(false);
          clearAllFranchiseStateAndMap();
          alert("정확하지 않은 브랜드명이거나 정보가 없습니다.");
          return;
        }

        let sumFrcs = 0;
        let sumDrtms = 0;
        let sumStores = 0;
        const map = mapObjRef.current;

        // 결과 지도 오버레이 렌더링
        items.forEach((item) => {
          const region = item.ctprvnNm || item.areaNm || item.sidoNm;
          if (!region) return;
          const coords = REGION_COORDS[region];

          const frcsCnt = parseInt(item.frcsCnt) || 0;
          const drtmsCnt = parseInt(item.drtmsCnt) || 0;
          const total = parseInt(item.totCnt) || (frcsCnt + drtmsCnt);

          sumFrcs += frcsCnt;
          sumDrtms += drtmsCnt;
          sumStores += total;

          if (coords && map) {
            const pos = new window.kakao.maps.LatLng(coords.lat, coords.lng);
            const size = Math.max(32, Math.min(80, 24 + Math.sqrt(total) * 1.8));

            const overlayDiv = document.createElement('div');
            overlayDiv.style.cssText = `
              width: ${size}px; height: ${size}px;
              background-color: rgba(37, 99, 235, 0.9);
              border: 2px solid #ffffff;
              border-radius: 50%;
              display: flex; flex-direction: column; align-items: center; justify-content: center;
              color: white; font-weight: bold; font-size: 11px;
              box-shadow: 0 4px 10px rgba(0,0,0,0.3);
              cursor: pointer;
              transition: all 0.2s ease-in-out;
            `;
            overlayDiv.innerHTML = `
              <span style="font-size: 10px; opacity: 0.9;">${region}</span>
              <span style="font-size: 12px; font-weight: 800;">${total}</span>
            `;
            overlayDiv.onclick = () => {
              searchKakaoPlacesByRegion(region);
            };

            const customOverlay = new window.kakao.maps.CustomOverlay({
              position: pos,
              content: overlayDiv,
              yAnchor: 0.5,
              xAnchor: 0.5
            });

            customOverlay.setMap(map);
            franchiseOverlayRefs.current.push(customOverlay);
          }
        });

        setFranchiseData(items);
        setFranchiseSummary({
          totalFrcs: sumFrcs,
          totalDrtms: sumDrtms,
          totalStores: sumStores
        });
        setIsFranchiseLoading(false);
      };

      // 카카오 장소 검색 API 연동 (지역 클릭 시 실제 매장 좌표/주소 조회)
      const searchKakaoPlacesByRegion = (regionName) => {
        if (!window.kakao || !window.kakao.maps || !window.kakao.maps.services) {
          alert("카카오 지도 장소 검색 서비스를 사용할 수 없습니다.");
          return;
        }
        const map = mapObjRef.current;
        if (!map) return;

        const brandName = franchiseBrandNo.trim();
        const searchKeyword = brandName ? `${brandName} ${regionName}` : regionName;
        setSearchedRegion(regionName);
        setIsKakaoLoading(true);

        const ps = new window.kakao.maps.services.Places();
        ps.keywordSearch(searchKeyword, (data, status) => {
          setIsKakaoLoading(false);
          if (status === window.kakao.maps.services.Status.OK && data && data.length > 0) {
            clearKakaoMarkers();
            setKakaoStores(data);
            setIsKakaoPanelOpen(true);

            const bounds = new window.kakao.maps.LatLngBounds();
            const newMarkerRefs = [];

            const redPinSvg = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`
              <svg xmlns="http://www.w3.org/2000/svg" width="30" height="36" viewBox="0 0 30 36">
                <path fill="#ef4444" stroke="#ffffff" stroke-width="2" d="M15 0C6.716 0 0 6.716 0 15c0 11.25 15 21 15 21s15-9.75 15-21C30 6.716 23.284 0 15 0z"/>
                <circle cx="15" cy="13" r="5" fill="#ffffff"/>
              </svg>
            `)}`;
            const markerImage = new window.kakao.maps.MarkerImage(
              redPinSvg,
              new window.kakao.maps.Size(30, 36),
              { offset: new window.kakao.maps.Point(15, 36) }
            );

            data.forEach(place => {
              const lat = parseFloat(place.y);
              const lng = parseFloat(place.x);
              if (!lat || !lng) return;

              const pos = new window.kakao.maps.LatLng(lat, lng);
              bounds.extend(pos);

              const marker = new window.kakao.maps.Marker({
                position: pos,
                image: markerImage,
                map: map,
                zIndex: 30
              });

              const addressText = place.road_address_name || place.address_name || '주소 정보 없음';
              const contentHtml = `
                <div style="padding: 10px 14px; min-width: 190px; font-family: 'Pretendard', sans-serif; background: #0f172a; color: #ffffff; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
                  <div style="font-weight: 800; font-size: 13px; color: #38bdf8; margin-bottom: 4px;">
                    📍 ${place.place_name}
                  </div>
                  <div style="font-size: 11px; color: #cbd5e1; line-height: 1.4;">
                    ${addressText}
                  </div>
                  ${place.phone ? `<div style="font-size: 10px; color: #94a3b8; margin-top: 4px;">📞 ${place.phone}</div>` : ''}
                </div>
              `;

              const infowindow = new window.kakao.maps.InfoWindow({
                content: contentHtml,
                removable: true
              });

              window.kakao.maps.event.addListener(marker, 'click', () => {
                highlightKakaoStoreMarker(place.id);
              });

              newMarkerRefs.push({
                id: place.id,
                marker: marker,
                infowindow: infowindow,
                place: place
              });
            });

            kakaoMarkerRefs.current = newMarkerRefs;
            map.setBounds(bounds);
          } else {
            clearKakaoMarkers();
            setKakaoStores([]);
            setIsKakaoPanelOpen(false);
            alert(`'${searchKeyword}' 검색 결과가 없거나 위치 정보를 찾을 수 없습니다.`);
          }
        });
      };

      // 카카오 매장 리스트 항목 클릭 시 하이라이트 & 이동 & 인포윈도우
      const highlightKakaoStoreMarker = (placeId) => {
        if (!mapObjRef.current || !window.kakao) return;
        const map = mapObjRef.current;

        if (activeKakaoInfoWindowRef.current) {
          activeKakaoInfoWindowRef.current.close();
        }

        const target = kakaoMarkerRefs.current.find(item => item.id === placeId);
        if (target && target.marker) {
          map.panTo(target.marker.getPosition());
          target.infowindow.open(map, target.marker);
          activeKakaoInfoWindowRef.current = target.infowindow;
          setSelectedKakaoStoreId(placeId);
        }
      };

      // 리스트 항목 클릭 시 마커 하이라이트 & 지도 이동 & 인포윈도우 오픈
      const highlightStoreMarker = (bizesId) => {
        if (!mapObjRef.current || !window.kakao) return;
        const map = mapObjRef.current;
        const { defaultImg, highlightImg } = getMarkerImages();

        // 1. 모든 마커 이미지 기본 초기화
        Object.values(storeMarkerMapRef.current).forEach(item => {
          if (item.marker && defaultImg) {
            item.marker.setImage(defaultImg);
            item.marker.setZIndex(1);
          }
        });

        if (activeInfoWindowRef.current) {
          activeInfoWindowRef.current.close();
        }

        // 2. 선택된 상가 마커 하이라이트
        const targetItem = storeMarkerMapRef.current[bizesId];
        if (targetItem && targetItem.marker) {
          if (highlightImg) {
            targetItem.marker.setImage(highlightImg);
            targetItem.marker.setZIndex(20);
          }
          
          map.panTo(targetItem.marker.getPosition());
          targetItem.infowindow.open(map, targetItem.marker);
          activeInfoWindowRef.current = targetItem.infowindow;
          setSelectedBizesId(bizesId);

          if (targetItem.store) {
            const mainCat = targetItem.store.indsLclsNm || '기타 서비스';
            const subCat = targetItem.store.indsSclsNm || targetItem.store.indsMclsNm || '기타 업종';
            setCollapsedCategories(prev => ({ ...prev, [mainCat]: false }));
            setCollapsedSubCategories(prev => ({ ...prev, [`${mainCat}::${subCat}`]: false }));
          }
        }
      };

      const drawCenterMarker = (latlng, mapObj) => {
        if (!mapObj || !window.kakao) return;
        if (centerMarkerRef.current) centerMarkerRef.current.setMap(null);

        const redPinSvg = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="42" viewBox="0 0 36 42">
            <path fill="#ef4444" stroke="#ffffff" stroke-width="2.5" d="M18 0C8.059 0 0 8.059 0 18c0 13.5 18 24 18 24s18-10.5 18-24C36 8.059 27.941 0 18 0z"/>
            <circle cx="18" cy="16" r="6" fill="#ffffff"/>
          </svg>
        `)}`;

        const redMarkerImage = new window.kakao.maps.MarkerImage(
          redPinSvg,
          new window.kakao.maps.Size(36, 42),
          { offset: new window.kakao.maps.Point(18, 42) }
        );

        centerMarkerRef.current = new window.kakao.maps.Marker({
          position: latlng,
          image: redMarkerImage,
          zIndex: 10
        });
        centerMarkerRef.current.setMap(mapObj);
      };

      const handleToggleNearbyStores = () => {
        if (activeApi === 'nearby_stores') {
          setActiveApi(null);
          activeApiRef.current = null;
          // 기존 맵 레이어 지우기 등 처리가 필요하다면 추가
        } else {
          setActiveApi('nearby_stores');
          activeApiRef.current = 'nearby_stores';
          const { lat, lng } = currentPosRef.current;
          fetchStoresInRadius(lat, lng);
        }
      };

      const handleToggleFranchise = () => {
        if (activeApi === 'franchise') {
          setActiveApi(null);
          activeApiRef.current = null;
          clearAllFranchiseStateAndMap();
        } else {
          setActiveApi('franchise');
          activeApiRef.current = 'franchise';
          clearAllFranchiseStateAndMap();
        }
      };
      useEffect(() => {
        const initMap = () => {
          if (!window.kakao || !window.kakao.maps || !mapContainerRef.current) return;

          window.kakao.maps.load(() => {
            const container = mapContainerRef.current;
            if (!container) return;

            const initialLat = 37.5665;
            const initialLng = 126.9780;
            currentPosRef.current = { lat: initialLat, lng: initialLng };
            const centerPos = new window.kakao.maps.LatLng(initialLat, initialLng);

            if (!mapObjRef.current) {
              const options = { center: centerPos, level: 4 };
              mapObjRef.current = new window.kakao.maps.Map(container, options);
            } else {
              mapObjRef.current.relayout();
              mapObjRef.current.setCenter(centerPos);
            }

            drawCenterMarker(centerPos, mapObjRef.current);

            // 초기 위치 지오코딩 주소 확인
            const geocoder = new window.kakao.maps.services.Geocoder();
            geocoder.coord2Address(initialLng, initialLat, (result, status) => {
              if (status === window.kakao.maps.services.Status.OK && result[0]) {
                setCurrentAddress(result[0].address ? result[0].address.address_name : '서울 중구 태평로1가');
              }
            });

            const triggerRelayout = () => {
              if (mapObjRef.current) {
                mapObjRef.current.relayout();
              }
            };

            requestAnimationFrame(triggerRelayout);
            setTimeout(triggerRelayout, 100);
            setTimeout(triggerRelayout, 300);

            if (window.ResizeObserver && mapContainerRef.current) {
              const ro = new ResizeObserver(() => triggerRelayout());
              ro.observe(mapContainerRef.current);
            }

            window.addEventListener('resize', triggerRelayout);

            // 지도 클릭 이벤트: 중심점 이동 및 API가 활성화되어 있으면 데이터 재조회
            window.kakao.maps.event.addListener(mapObjRef.current, 'click', (mouseEvent) => {
              const latlng = mouseEvent.latLng;
              const lat = latlng.getLat();
              const lng = latlng.getLng();
              currentPosRef.current = { lat, lng };

              mapObjRef.current.panTo(latlng);
              drawCenterMarker(latlng, mapObjRef.current);

              geocoder.coord2Address(lng, lat, (result, status) => {
                if (status === window.kakao.maps.services.Status.OK && result[0]) {
                  setCurrentAddress(result[0].address ? result[0].address.address_name : '선택 위치');
                }
              });

              if (activeApiRef.current === 'nearby_stores') {
                fetchStoresInRadius(lat, lng);
              }
            });
          });
        };

        if (window.kakao && window.kakao.maps) {
          initMap();
        } else {
          const timer = setInterval(() => {
            if (window.kakao && window.kakao.maps) {
              clearInterval(timer);
              initMap();
            }
          }, 300);
          return () => clearInterval(timer);
        }
      }, []);

      const handleSearchSubmit = (e) => {
        e.preventDefault();
        if (!searchKeyword.trim() || !mapObjRef.current || !window.kakao) return;

        const ps = new window.kakao.maps.services.Places();
        ps.keywordSearch(searchKeyword, (data, status) => {
          if (status === window.kakao.maps.services.Status.OK && data[0]) {
            const targetLat = parseFloat(data[0].y);
            const targetLng = parseFloat(data[0].x);
            currentPosRef.current = { lat: targetLat, lng: targetLng };
            const targetPos = new window.kakao.maps.LatLng(targetLat, targetLng);
            
            mapObjRef.current.panTo(targetPos);
            drawCenterMarker(targetPos, mapObjRef.current);
            setCurrentAddress(data[0].address_name || data[0].place_name || '검색 위치');

            if (activeApiRef.current === 'nearby_stores') {
              fetchStoresInRadius(targetLat, targetLng);
            }
          } else {
            alert('검색한 위치를 찾을 수 없습니다.');
          }
        });
      };

      return (
        <div className="bg-slate-900 text-white min-h-screen flex flex-col relative overflow-hidden">
          <AdminNav setView={setView} currentView="admin_seoul_cmrcl" adminUser={adminUser} refreshLeads={refreshLeads} handleLogout={handleLogout} />
          
          <div className="flex-1 w-full relative overflow-hidden">
            {/* 좌측 상단 패널: 위치 검색 + 현재 지도 위치 (항상 고정) */}
            <div className="absolute top-4 left-4 z-10 w-80 sm:w-96 bg-slate-900/95 border border-slate-700/90 backdrop-blur-xl rounded-2xl shadow-2xl p-4 text-white space-y-3.5 flex flex-col transition-all duration-300">
              
              {/* 상단 위치 검색 폼 */}
              <form onSubmit={handleSearchSubmit} className="flex gap-2 flex-shrink-0">
                <input
                  type="text"
                  value={searchKeyword}
                  onChange={(e) => setSearchKeyword(e.target.value)}
                  placeholder="위치/주소 검색 (예: 강남역, 명동)"
                  className="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs font-medium text-white placeholder-slate-400 focus:outline-none focus:border-blue-500"
                />
                <button
                  type="submit"
                  disabled={isLoading}
                  className="bg-blue-600 hover:bg-blue-500 font-extrabold text-xs px-3 py-2 rounded-xl transition flex items-center gap-1 shadow-md whitespace-nowrap"
                >
                  {isLoading ? '⏳' : '🔍'} 검색
                </button>
              </form>

              {/* 중심 위치 안내 카드 */}
              <div className="bg-slate-800/90 rounded-xl p-3 border border-slate-700/80 space-y-1.5 text-xs flex-shrink-0">
                <div className="flex justify-between items-center">
                  <span className="text-[11px] font-bold text-slate-400">📍 현재 지도 위치</span>
                  <span className="text-xs font-black text-emerald-400 truncate max-w-[190px]">{currentAddress}</span>
                </div>
              </div>
            </div>

            {/* 좌측 하단 패널: 사용 가능한 API 기능 선택 섹션 (토글 가능) */}
            <div className={`absolute top-48 z-10 transition-all duration-300 ${isApiPanelOpen ? 'left-4' : '-left-80 sm:-left-96'}`}>
              <div className="w-80 sm:w-96 bg-slate-900/95 border border-slate-700/90 backdrop-blur-xl rounded-2xl shadow-2xl p-4 text-white flex flex-col relative">
                {/* 토글 버튼 */}
                <button 
                  onClick={() => setIsApiPanelOpen(!isApiPanelOpen)} 
                  className="absolute top-1/2 -translate-y-1/2 -right-8 w-8 h-16 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 border-l-0 rounded-r-xl shadow-lg flex items-center justify-center cursor-pointer transition-colors"
                >
                  {isApiPanelOpen ? '◀' : '▶'}
                </button>

                <div className="bg-slate-800/80 rounded-xl p-3 border border-slate-700/80 space-y-2 flex-shrink-0">
                  <div className="flex justify-between items-center text-xs font-extrabold text-blue-300">
                    <span>⚡ 상권 분석 API 기능 선택</span>
                    <span className="text-[10px] bg-blue-950/80 text-blue-300 px-2 py-0.5 rounded-md border border-blue-800/60 font-bold">1개 연동됨</span>
                  </div>

                  <div className="grid grid-cols-1 gap-2 pt-0.5">
                    <button
                      type="button"
                      onClick={handleToggleNearbyStores}
                      disabled={isLoading}
                      className={`w-full p-2.5 rounded-xl border text-xs font-bold transition flex items-center justify-between cursor-pointer ${
                        activeApi === 'nearby_stores'
                          ? 'bg-blue-600 border-blue-400 text-white shadow-lg ring-2 ring-blue-400/50'
                          : 'bg-slate-800 border-slate-700/80 hover:bg-slate-750 text-slate-200 hover:border-slate-600'
                      }`}
                    >
                      <div className="flex items-center gap-2">
                        <span className="text-base">🏪</span>
                        <div className="text-left">
                          <div className="font-extrabold text-xs">근처 상가 (300m)</div>
                          <div className={`text-[10px] ${activeApi === 'nearby_stores' ? 'text-blue-100' : 'text-slate-400'}`}>
                            소상공인시장진흥공단 API
                          </div>
                        </div>
                      </div>
                      <span className={`text-[10px] px-2 py-0.5 rounded-full font-extrabold ${
                        activeApi === 'nearby_stores' ? 'bg-white text-blue-700' : 'bg-slate-900 text-slate-400'
                      }`}>
                        {activeApi === 'nearby_stores' ? 'ON (조회 완료)' : '선택 실행'}
                      </span>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {/* 우측 패널: API 결과 표시 영역 (토글 가능) */}
            {activeApi === 'nearby_stores' && (
              <div className={`absolute top-4 z-10 transition-all duration-300 ${isResultPanelOpen ? 'right-4' : '-right-80 sm:-right-96'}`}>
                <div className="w-80 sm:w-96 bg-slate-900/95 border border-slate-700/90 backdrop-blur-xl rounded-2xl shadow-2xl p-4 text-white space-y-3.5 max-h-[calc(100vh-80px)] flex flex-col relative">
                  {/* 토글 버튼 */}
                  <button 
                    onClick={() => setIsResultPanelOpen(!isResultPanelOpen)} 
                    className="absolute top-1/2 -translate-y-1/2 -left-8 w-8 h-16 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 border-r-0 rounded-l-xl shadow-lg flex items-center justify-center cursor-pointer transition-colors"
                  >
                    {isResultPanelOpen ? '▶' : '◀'}
                  </button>
                  
                  <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1">
                  {/* 반경 300m 요약 바 */}
                  <div className="bg-slate-800/90 rounded-xl p-2.5 border border-slate-700/80 flex justify-between items-center text-xs flex-shrink-0 mb-1">
                    <span className="text-[11px] font-bold text-blue-300">⭕ 반경: <strong className="text-sky-400">300m</strong></span>
                    <span className="text-xs font-black text-amber-400 bg-amber-950/80 px-2 py-0.5 rounded-full border border-amber-700/80">
                      🏪 상가업소: <strong>{storeCount}개</strong>
                    </span>
                  </div>

                  {isLoading ? (
                    <div className="py-8 text-center text-xs text-slate-400 space-y-2">
                      <div className="animate-spin text-lg">⏳</div>
                      <p>반경 300m 상가업소를 불러오는 중...</p>
                    </div>
                  ) : Object.keys(groupedStores).length === 0 ? (
                    <div className="py-8 text-center text-xs text-slate-400">
                      반경 300m 이내에 검색된 상가가 없습니다.
                    </div>
                  ) : (
                    <>
                    {/* 전체 펼치기 / 접기 버튼 Bar */}
                    <div className="flex justify-between items-center pb-1 text-[11px] text-slate-400 border-b border-slate-700/50 mb-2">
                      <span className="font-bold text-slate-300">업종 분류 ({Object.keys(groupedStores).length}개)</span>
                      <div className="flex gap-2 text-[10px]">
                        <button
                          type="button"
                          onClick={expandAllCategories}
                          className="text-blue-400 hover:text-blue-300 transition cursor-pointer font-bold"
                        >
                          📂 전체 펼치기
                        </button>
                        <span className="text-slate-600">|</span>
                        <button
                          type="button"
                          onClick={collapseAllCategories}
                          className="text-slate-400 hover:text-amber-300 transition cursor-pointer font-bold"
                        >
                          📁 전체 접기
                        </button>
                      </div>
                    </div>

                    {Object.entries(groupedStores).map(([mainCategory, subMap]) => {
                      const isMainCollapsed = !!collapsedCategories[mainCategory];
                      const mainStoreCount = Object.values(subMap).reduce((sum, list) => sum + list.length, 0);

                      return (
                        <div key={mainCategory} className="space-y-1.5">
                          {/* 1단계: 대분류 카테고리 헤더 */}
                          <div
                            onClick={() => toggleCategory(mainCategory)}
                            className="flex justify-between items-center sticky top-0 bg-slate-800/95 py-1.5 px-2.5 rounded-xl border-l-4 border-blue-500 backdrop-blur-md cursor-pointer hover:bg-slate-700/90 transition select-none shadow-sm z-10"
                          >
                            <div className="flex items-center gap-1.5 min-w-0">
                              <span className={`text-[10px] text-blue-400 transition-transform duration-200 inline-block ${isMainCollapsed ? '' : 'rotate-90'}`}>
                                ▶
                              </span>
                              <span className="text-xs font-black text-blue-200 truncate">
                                📁 {mainCategory}
                              </span>
                            </div>
                            <span className="text-[10px] bg-slate-900 text-slate-300 font-bold px-2 py-0.5 rounded-full border border-slate-700/80 flex-shrink-0">
                              {mainStoreCount}개
                            </span>
                          </div>

                          {/* 2단계: 소분류 카테고리 그룹 (대분류가 펼쳐져 있을 때만) */}
                          {!isMainCollapsed && (
                            <div className="pl-2 space-y-1.5 pt-0.5">
                              {Object.entries(subMap).map(([subCategory, stores]) => {
                                const subKey = `${mainCategory}::${subCategory}`;
                                const isSubCollapsed = !!collapsedSubCategories[subKey];

                                return (
                                  <div key={subCategory} className="space-y-1">
                                    {/* 소분류 카테고리 헤더 */}
                                    <div
                                      onClick={() => toggleSubCategory(mainCategory, subCategory)}
                                      className="flex justify-between items-center bg-slate-800/80 py-1 px-2.5 rounded-lg border-l-2 border-sky-400 cursor-pointer hover:bg-slate-750 transition select-none text-xs"
                                    >
                                      <div className="flex items-center gap-1.5 min-w-0">
                                        <span className={`text-[9px] text-sky-400 transition-transform duration-200 inline-block ${isSubCollapsed ? '' : 'rotate-90'}`}>
                                          ▶
                                        </span>
                                        <span className="text-xs font-bold text-sky-300 truncate">
                                          🏷️ {subCategory}
                                        </span>
                                      </div>
                                      <span className="text-[9px] bg-slate-900/80 text-sky-200 font-bold px-1.5 py-0.5 rounded-md border border-slate-700/60 flex-shrink-0">
                                        {stores.length}개
                                      </span>
                                    </div>

                                    {/* 3단계: 세부 상가 업소 리스트 (소분류가 펼쳐져 있을 때만) */}
                                    {!isSubCollapsed && (
                                      <ul className="space-y-1 pl-1.5 pt-0.5">
                                        {stores.map((store) => {
                                          const bId = store.bizesId || `store_${Math.random()}`;
                                          const isSelected = selectedBizesId === bId;

                                          return (
                                            <li
                                              key={bId}
                                              data-id={bId}
                                              onClick={() => highlightStoreMarker(bId)}
                                              className={`p-2.5 rounded-xl border transition cursor-pointer text-xs ${
                                                isSelected
                                                  ? 'bg-amber-500/20 border-amber-400 text-amber-200 shadow-md ring-1 ring-amber-400'
                                                  : 'bg-slate-800/50 border-slate-700/60 hover:bg-slate-800 hover:border-slate-600 text-slate-200'
                                              }`}
                                            >
                                              <div className="flex justify-between items-start mb-0.5">
                                                <strong className="font-extrabold text-white text-xs truncate max-w-[200px]">
                                                  {store.bizesNm}
                                                </strong>
                                                <span className="text-[10px] text-blue-400 font-bold bg-blue-950/60 px-1.5 py-0.5 rounded border border-blue-800/50">
                                                  {subCategory}
                                                </span>
                                              </div>
                                              <p className="text-[10px] text-slate-400 truncate">
                                                📍 {store.rdnmAdr || store.lnoAdr || '주소 미상'}
                                              </p>
                                            </li>
                                          );
                                        })}
                                      </ul>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </>
                  )}
                </div>

                <div className="text-[9px] text-slate-400 text-center pt-1 border-t border-slate-800 flex-shrink-0">
                  💡 목록 클릭 시 해당 마커로 지도 이동 및 황금색 핀 하이라이트 표시
                </div>
              </div>
              </div>
            )}

            {/* Kakao Map 지도 영역 100% */}
            <div ref={mapContainerRef} className="w-full h-[calc(100vh-64px)] z-0" />
          </div>
        </div>
      );
    }

    function AdminFranchisePage({ setView, adminUser, handleLogout, refreshLeads }) {
      const [year, setYear] = useState('2025');
      const [brandName, setBrandName] = useState('');
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(false);
      const [hasSearched, setHasSearched] = useState(false);
      
      // 50개씩 목록을 보여주고 하단 버튼으로 이동하기 위한 페이지 네비게이션 상태
      const [currentPage, setCurrentPage] = useState(1);
      const ITEMS_PER_PAGE = 50;

      const SERVICE_KEY = 'BahaUoW8jiYD6HVMXVBRJEpafXTnR%2FVHFkUWR0WwW%2BOzXumYn3YlV8oqDnoc8PYSg0vcwp3qT%2FalQ7707m0fKA%3D%3D';

      const handleSearch = async (e, customBrandName = null, customYear = null) => {
        if (e) e.preventDefault();

        const searchYr = customYear !== null ? customYear : (year.trim() || '2025');
        const targetBrandName = customBrandName !== null ? customBrandName : brandName.trim();

        if (customBrandName !== null) {
          setBrandName(customBrandName);
        }
        if (customYear !== null) {
          setYear(customYear);
        }

        setLoading(true);
        setHasSearched(true);
        setCurrentPage(1);

        try {
          // 공정위 가맹점 매출 현황 API (FftcBrandFrcsStatsService/getBrandFrcsStats)
          const fetchPage = async (pNo, nRows) => {
            const params = new URLSearchParams({
              serviceKey: decodeURIComponent(SERVICE_KEY),
              yr: searchYr,
              pageNo: String(pNo),
              numOfRows: String(nRows),
              resultType: 'json'
            });

            const targetUrl = `https://apis.data.go.kr/1130000/FftcBrandFrcsStatsService/getBrandFrcsStats?${params.toString()}`;
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

            let res = null;
            try {
              res = await fetch(proxyUrl);
            } catch (err1) {
              res = await fetch(targetUrl).catch(() => null);
            }

            if (res && res.ok) {
              const text = await res.text();
              try {
                const data = JSON.parse(text);
                let raw = data?.response?.body?.items?.item 
                       || data?.response?.body?.items 
                       || data?.body?.items?.item 
                       || data?.body?.items 
                       || data?.items;
                if (raw) return Array.isArray(raw) ? raw : [raw];
              } catch (e) {}
            }
            return [];
          };

          // 전 브랜드 병렬 로딩 (페이지 1~12, 각 1,000개씩 = 총 12,000개 브랜드 확보하여 DB 전체 데이터 100% 커버)
          const fetchPromises = [];
          for (let p = 1; p <= 12; p++) {
            fetchPromises.push(fetchPage(p, 1000));
          }

          const pageResults = await Promise.all(fetchPromises);
          const combinedList = pageResults.flat();

          if (combinedList.length > 0) {
            if (targetBrandName) {
              const kw = targetBrandName.toLowerCase();
              const filtered = combinedList.filter(item => 
                (item.brandNm && item.brandNm.toLowerCase().includes(kw)) ||
                (item.corpNm && item.corpNm.toLowerCase().includes(kw)) ||
                (item.indutyMlsfcNm && item.indutyMlsfcNm.toLowerCase().includes(kw)) ||
                (item.indutyLclasNm && item.indutyLclasNm.toLowerCase().includes(kw))
              );

              setItems(filtered);
            } else {
              setItems(combinedList);
            }
          } else {
            setItems([]);
          }
        } catch (err) {
          console.error("Franchise Stats API Search Error:", err);
          setItems([]);
        } finally {
          setLoading(false);
        }
      };

      // 매출금액 포맷터 (천원 단위 데이터를 천 단위 콤마와 함께 원/천원 표시)
      const formatAmount = (amt) => {
        const num = parseInt(amt);
        if (isNaN(num) || num === 0) return '정보 없음 (0원)';
        const won = num * 1000;
        return `${num.toLocaleString()} 천원 (${won.toLocaleString()} 원)`;
      };

      const formatUnitAmount = (amt) => {
        const num = parseInt(amt);
        if (isNaN(num) || num === 0) return '정보 없음';
        const won = num * 1000;
        return `${num.toLocaleString()} 천원/3.3㎡ (${won.toLocaleString()} 원/3.3㎡)`;
      };

      // 50개 단위 페이징 계산
      const totalPages = Math.ceil(items.length / ITEMS_PER_PAGE) || 1;
      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIndex = startIndex + ITEMS_PER_PAGE;
      const paginatedItems = items.slice(startIndex, endIndex);

      // 페이지 번호 생성 함수 (현재 페이지 기준 max 5개 번호 표시)
      const getPageNumbers = () => {
        const pages = [];
        let start = Math.max(1, currentPage - 2);
        let end = Math.min(totalPages, start + 4);
        if (end - start < 4) {
          start = Math.max(1, end - 4);
        }
        for (let i = start; i <= end; i++) {
          pages.push(i);
        }
        return pages;
      };

      return (
        <div className="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
          <AdminNav setView={setView} currentView="admin_franchise" adminUser={adminUser} refreshLeads={refreshLeads} handleLogout={handleLogout} />

          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-8 space-y-6">
            {/* 상단 타이틀 및 안내 */}
            <div className="bg-slate-900/90 border border-slate-800 backdrop-blur-xl rounded-2xl p-6 shadow-xl flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="bg-blue-600/20 text-blue-400 text-xs font-black px-2.5 py-1 rounded-md border border-blue-500/30">
                    공정거래위원회 API 연동
                  </span>
                  <span className="text-xs text-slate-400 font-bold">브랜드별 가맹점 현황 (매출 등)</span>
                </div>
                <h1 className="text-2xl font-black text-white tracking-tight">🔍 프랜차이즈 브랜드 매출 및 가맹 현황 조회</h1>
                <p className="text-xs text-slate-400 mt-1">
                  기준년도(드롭다운) 선택 및 브랜드명 키워드를 검색하여 상호명, 평균매출금액, 면적단위평균매출금액 현황을 조회하세요. (50개씩 목록 보기 제공)
                </p>
              </div>
            </div>

            {/* 검색 폼 영역 */}
            <div className="bg-slate-900/90 border border-slate-800 backdrop-blur-xl rounded-2xl p-6 shadow-xl space-y-4">
              <form onSubmit={(e) => handleSearch(e)} className="grid grid-cols-1 sm:grid-cols-12 gap-4 items-end">
                <div className="sm:col-span-4 space-y-1.5">
                  <label className="block text-xs font-extrabold text-slate-300">
                    📅 가맹사업 기준년도 <span className="text-blue-400">(yr 선택)</span>
                  </label>
                  <select
                    value={year}
                    onChange={(e) => {
                      const selectedYr = e.target.value;
                      setYear(selectedYr);
                      handleSearch(null, null, selectedYr);
                    }}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition cursor-pointer font-bold"
                  >
                    <option value="2025">2025년 (최신 가맹점/매출 현황)</option>
                    <option value="2024">2024년</option>
                    <option value="2023">2023년</option>
                    <option value="2022">2022년</option>
                    <option value="2021">2021년</option>
                    <option value="2020">2020년</option>
                  </select>
                </div>

                <div className="sm:col-span-5 space-y-1.5">
                  <label className="block text-xs font-extrabold text-slate-300">
                    🏢 브랜드명 / 상호명 <span className="text-blue-400">(brandNm)</span>
                  </label>
                  <input
                    type="text"
                    value={brandName}
                    onChange={(e) => setBrandName(e.target.value)}
                    placeholder="브랜드명 또는 상호명 입력 (예: 메가, 치킨, 피자, 커피 등)"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
                  />
                </div>

                <div className="sm:col-span-3">
                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs py-2.5 px-4 rounded-xl transition shadow-lg flex items-center justify-center gap-1.5 cursor-pointer active:scale-95 disabled:opacity-50"
                  >
                    {loading ? '⏳ 데이터 검색 중...' : '🔍 매출정보 검색'}
                  </button>
                </div>
              </form>

              {/* 샘플 브랜드 테스트 버튼 및 안내 */}
              <div className="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3.5 space-y-2 text-[11px] text-slate-400">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="font-extrabold text-blue-400 flex items-center gap-1">
                    ⚡ 인기 키워드 원클릭 검색:
                  </span>
                  <button
                    type="button"
                    onClick={(e) => handleSearch(e, '메가')}
                    className="bg-slate-800 hover:bg-blue-600 text-slate-200 hover:text-white px-2.5 py-1 rounded-lg border border-slate-700 font-bold transition text-[11px]"
                  >
                    ☕ 메가 (메가MGC커피)
                  </button>
                  <button
                    type="button"
                    onClick={(e) => handleSearch(e, '치킨')}
                    className="bg-slate-800 hover:bg-blue-600 text-slate-200 hover:text-white px-2.5 py-1 rounded-lg border border-slate-700 transition text-[11px]"
                  >
                    치킨
                  </button>
                  <button
                    type="button"
                    onClick={(e) => handleSearch(e, '커피')}
                    className="bg-slate-800 hover:bg-blue-600 text-slate-200 hover:text-white px-2.5 py-1 rounded-lg border border-slate-700 transition text-[11px]"
                  >
                    커피
                  </button>
                  <button
                    type="button"
                    onClick={(e) => handleSearch(e, '돼지')}
                    className="bg-slate-800 hover:bg-blue-600 text-slate-200 hover:text-white px-2.5 py-1 rounded-lg border border-slate-700 transition text-[11px]"
                  >
                    돼지
                  </button>
                  <button
                    type="button"
                    onClick={(e) => handleSearch(e, '')}
                    className="bg-slate-800 hover:bg-emerald-600 text-slate-200 hover:text-white px-2.5 py-1 rounded-lg border border-slate-700 font-bold transition text-[11px]"
                  >
                    📋 {year}년 전체 브랜드 목록 보기
                  </button>
                </div>
                <div className="flex items-center justify-between text-slate-400 border-t border-slate-800/80 pt-2 flex-col sm:flex-row gap-2">
                  <div className="flex items-start gap-1.5">
                    <span className="text-blue-400">💡</span>
                    <div>
                      공정거래위원회 브랜드별 가맹점 현황 API(<code className="text-sky-400">getBrandFrcsStats</code>) {year}년 전 데이터(12,000여개)를 실시간 검색하며, 한 페이지당 50개씩 레이아웃 흔들림 없이 보여줍니다.
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* 데이터 목록 표 (Table) 영역 - 높이 고정(min-h-[640px])으로 화면 흔들림 방지 */}
            <div className="bg-slate-900/90 border border-slate-800 backdrop-blur-xl rounded-2xl p-6 shadow-xl space-y-4 min-h-[640px] relative flex flex-col justify-between">
              <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                <h2 className="text-sm font-black text-white flex items-center gap-2">
                  📊 브랜드별 가맹점 현황 및 매출 정보 목록 ({year}년 기준)
                  {items.length > 0 && (
                    <span className="bg-blue-950 text-blue-300 text-[11px] px-2.5 py-0.5 rounded-full border border-blue-800/60 font-bold">
                      검색결과: 총 {items.length}개 브랜드 ({startIndex + 1}~{Math.min(endIndex, items.length)}번째 표시)
                    </span>
                  )}
                </h2>
              </div>

              {loading ? (
                <div className="flex-1 flex flex-col items-center justify-center py-20 text-slate-400 space-y-3">
                  <div className="text-3xl animate-spin">⏳</div>
                  <p className="text-xs font-bold text-slate-200">공정거래위원회 {year}년 전체 가맹점 매출 API 데이터(12,000여개)를 실시간 검색 중입니다...</p>
                  <p className="text-[11px] text-slate-500">잠시만 기다려주세요 (화면 흔들림 방지 처리 적용)</p>
                </div>
              ) : !hasSearched ? (
                <div className="flex-1 flex flex-col items-center justify-center py-20 text-slate-400 space-y-2">
                  <div className="text-3xl">🔎</div>
                  <p className="text-xs font-semibold">위 검색 조건 입력 후 '매출정보 검색' 버튼을 누르면 통계 표가 표시됩니다.</p>
                </div>
              ) : items.length === 0 ? (
                <div className="flex-1 flex flex-col items-center justify-center py-20 text-slate-400 space-y-2 bg-slate-950/50 rounded-xl border border-slate-800/80 my-auto">
                  <div className="text-3xl">⚠️</div>
                  <p className="text-xs font-bold text-amber-400">해당 조건에 맞는 {year}년도 프랜차이즈 가맹/매출 정보가 존재하지 않습니다.</p>
                  <p className="text-[11px] text-slate-500">검색어 '{brandName}' 에 일치하는 브랜드가 없습니다. 단어를 축소하거나 다른 키워드로 검색해 주세요.</p>
                </div>
              ) : (
                <div className="flex-1 flex flex-col justify-between space-y-4">
                  <div className="overflow-x-auto custom-scrollbar flex-1">
                    <table className="w-full text-left text-xs border-collapse">
                      <thead>
                        <tr className="bg-slate-800/90 text-slate-300 font-extrabold border-b border-slate-700">
                          <th className="py-3.5 px-4">No.</th>
                          <th className="py-3.5 px-4">상호명 (corpNm)</th>
                          <th className="py-3.5 px-4">브랜드명 (brandNm)</th>
                          <th className="py-3.5 px-4">업종 (대분류/중분류)</th>
                          <th className="py-3.5 px-4 text-right">가맹점 수 (frcsCnt)</th>
                          <th className="py-3.5 px-4 text-right">평균매출금액 (avrgSlsAmt)</th>
                          <th className="py-3.5 px-4 text-right">면적단위평균매출금액 (arUnitAvrgSlsAmt)</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {paginatedItems.map((item, idx) => {
                          const globalIdx = startIndex + idx + 1;
                          const corp = item.corpNm || item.bznoNm || item.cmpNm || '-';
                          const brand = item.brandNm || '-';
                          const indutyL = item.indutyLclasNm || '-';
                          const indutyM = item.indutyMlsfcNm || '-';
                          const frcs = parseInt(item.frcsCnt) || 0;
                          const avrgSls = item.avrgSlsAmt;
                          const arUnitSls = item.arUnitAvrgSlsAmt;

                          return (
                            <tr key={idx} className="hover:bg-slate-800/50 transition-colors">
                              <td className="py-3.5 px-4 text-slate-500 font-mono">{globalIdx}</td>
                              <td className="py-3.5 px-4 font-bold text-slate-200">
                                {corp}
                              </td>
                              <td className="py-3.5 px-4 font-bold text-sky-400">
                                <span className="bg-sky-950/80 text-sky-300 px-2 py-1 rounded-md border border-sky-800/60 font-black">
                                  {brand}
                                </span>
                              </td>
                              <td className="py-3.5 px-4 font-semibold text-slate-300">
                                <span className="bg-slate-800 text-slate-300 px-2 py-0.5 rounded text-[10px] border border-slate-700 mr-1.5">{indutyL}</span>
                                <span className="text-slate-400">{indutyM}</span>
                              </td>
                              <td className="py-3.5 px-4 text-right font-bold text-slate-200">
                                {frcs.toLocaleString()}개
                              </td>
                              <td className="py-3.5 px-4 text-right font-extrabold text-emerald-400">
                                {formatAmount(avrgSls)}
                              </td>
                              <td className="py-3.5 px-4 text-right font-extrabold text-amber-400">
                                {formatUnitAmount(arUnitSls)}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  {/* 50개 단위 하단 페이지 네비게이션 버튼 UI */}
                  {totalPages > 1 && (
                    <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-slate-800 text-xs mt-auto">
                      <div className="text-slate-400 text-xs">
                        페이지 <strong className="text-white">{currentPage}</strong> / <strong>{totalPages}</strong> (총 {items.length}개 중 {startIndex + 1}~{Math.min(endIndex, items.length)}개 표시)
                      </div>
                      
                      <div className="flex items-center gap-1.5">
                        <button
                          type="button"
                          onClick={() => setCurrentPage(prev => Math.max(1, prev - 1))}
                          disabled={currentPage === 1}
                          className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed font-bold transition flex items-center gap-1"
                        >
                          ◀ 이전
                        </button>

                        {getPageNumbers().map(pageNum => (
                          <button
                            key={pageNum}
                            type="button"
                            onClick={() => setCurrentPage(pageNum)}
                            className={`px-3 py-1.5 rounded-lg text-xs font-black transition ${
                              currentPage === pageNum
                                ? 'bg-blue-600 text-white shadow-md ring-2 ring-blue-400/50'
                                : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                            }`}
                          >
                            {pageNum}
                          </button>
                        ))}

                        <button
                          type="button"
                          onClick={() => setCurrentPage(prev => Math.min(totalPages, prev + 1))}
                          disabled={currentPage === totalPages}
                          className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed font-bold transition flex items-center gap-1"
                        >
                          다음 ▶
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
