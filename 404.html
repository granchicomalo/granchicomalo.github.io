        if (path.includes('diagnosis')) return 'diagnosis';
        if (path.includes('result')) return 'result';
        if (path.includes('consultation')) return 'consultation';
        if (path.includes('admin/login')) return 'admin_login';
        if (path.includes('admin/dashboard')) return 'admin_dashboard';
        if (path.includes('admin/leads')) return 'admin_leads';
        if (path.includes('admin/funnel')) return 'admin_funnel';

        return 'home';

            }

          return () => unsubscribe();
        }
      }, []);

        if (firebaseDb && window.FirebaseSDK) {
          const leadsRef = window.FirebaseSDK.collection(firebaseDb, "leads");
          const unsubscribe = window.FirebaseSDK.onSnapshot(leadsRef, (snapshot) => {
            const liveData = [];
            snapshot.forEach((docSnap) => {
              liveData.push({ id: docSnap.id, ...docSnap.data() });
            });
            if (liveData.length > 0) {
              liveData.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
              setLeads(liveData);
            }
          }, (err) => {
            console.warn("Firestore snapshot listener:", err.message);
          });

          return () => unsubscribe();
        }
      }, []);

      const refreshLeads = async () => {
        if (firebaseDb && window.FirebaseSDK) {
          try {
            const querySnapshot = await window.FirebaseSDK.getDocs(window.FirebaseSDK.collection(firebaseDb, "leads"));
            const liveData = [];
            querySnapshot.forEach((docSnap) => {
              liveData.push({ id: docSnap.id, ...docSnap.data() });
            });
            if (liveData.length > 0) {
              liveData.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
              setLeads(liveData);
            }
          } catch (e) {
            console.error("Refresh error:", e);
          }
        }
      };

      const updateLeadStatus = async (leadId, newStatus) => {
        const updated = leads.map(l => l.id === leadId ? { ...l, status: newStatus } : l);
        setLeads(updated);

        if (firebaseDb && window.FirebaseSDK && !leadId.startsWith('lead-10')) {
          try {
            const leadDocRef = window.FirebaseSDK.doc(firebaseDb, "leads", leadId);
            await window.FirebaseSDK.updateDoc(leadDocRef, { status: newStatus });
          } catch (err) {
            console.error("Firestore status update failed:", err);
          }
        }
      };

      const updateLeadDetails = async (leadId, updatedFields) => {
        const updated = leads.map(l => l.id === leadId ? { ...l, ...updatedFields } : l);

        if (firebaseDb && window.FirebaseSDK && !leadId.startsWith('lead-10')) {

    function KakaoMapAnalysisSection({ setView, setFormData }) {
      const mapContainerRef = React.useRef(null);
      const [mapInstance, setMapInstance] = React.useState(null);
      const [selectedAddress, setSelectedAddress] = React.useState('서울시 서대문구 홍제동');
      const [searchKeyword, setSearchKeyword] = React.useState('');
      const [isLoadingApi, setIsLoadingApi] = React.useState(false);
      const [analysisResult, setAnalysisResult] = React.useState({
        floatingPop: '17,605 명',
        households: '7,973 세대',
        ageRatios: [
          { label: '10대', ratio: 11 },
          { label: '20대', ratio: 13 },
          { label: '30대', ratio: 14 },
          { label: '40대', ratio: 13 },
          { label: '50대', ratio: 18 },
          { label: '60대이상', ratio: 31 }
        ],
        recommendedTypes: ['소자본 카페', '무인 세탁/스튜디오', '프랜차이즈 식음료']
      });

      const SEOUL_API_KEY = '4a5a6847726368693930764b467365';

      const fetchSeoulRepopData = async (targetAddress) => {
        setIsLoadingApi(true);
        try {
          const apiUrl = `https://corsproxy.io/?${encodeURIComponent('http://openapi.seoul.go.kr:8088/' + SEOUL_API_KEY + '/xml/VwsmTrdhlRepopQq/1/1000/')}`;
          const res = await fetch(apiUrl);
          if (res.ok) {
            const text = await res.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(text, 'text/xml');
            const rows = xmlDoc.getElementsByTagName('row');

            let matchedRow = null;
            for (let i = 0; i < rows.length; i++) {
              const trdarNm = rows[i].getElementsByTagName('TRDAR_CD_NM')[0]?.textContent || '';
              if (targetAddress.includes(trdarNm) || (trdarNm.length >= 2 && targetAddress.includes(trdarNm.substring(0, 2)))) {
                matchedRow = rows[i];
                break;
              }
            }

            if (!matchedRow && rows.length > 0) {
              matchedRow = rows[Math.floor(Math.random() * rows.length)];
            }

            if (matchedRow) {
              const totPop = parseInt(matchedRow.getElementsByTagName('TOT_REPOP_CO')[0]?.textContent || '15000', 10);
              const households = parseInt(matchedRow.getElementsByTagName('TOT_HSHLD_CO')[0]?.textContent || '6500', 10);

              const p10 = parseInt(matchedRow.getElementsByTagName('AGRDE_10_REPOP_CO')[0]?.textContent || '0', 10);
              const p20 = parseInt(matchedRow.getElementsByTagName('AGRDE_20_REPOP_CO')[0]?.textContent || '0', 10);
              const p30 = parseInt(matchedRow.getElementsByTagName('AGRDE_30_REPOP_CO')[0]?.textContent || '0', 10);
              const p40 = parseInt(matchedRow.getElementsByTagName('AGRDE_40_REPOP_CO')[0]?.textContent || '0', 10);
              const p50 = parseInt(matchedRow.getElementsByTagName('AGRDE_50_REPOP_CO')[0]?.textContent || '0', 10);
              const p60 = parseInt(matchedRow.getElementsByTagName('AGRDE_60_ABOVE_REPOP_CO')[0]?.textContent || '0', 10);

              const r10 = Math.round((p10 / totPop) * 100) || 11;
              const r20 = Math.round((p20 / totPop) * 100) || 13;
              const r30 = Math.round((p30 / totPop) * 100) || 14;
              const r40 = Math.round((p40 / totPop) * 100) || 13;
              const r50 = Math.round((p50 / totPop) * 100) || 18;
              const r60 = Math.round((p60 / totPop) * 100) || 31;

              setAnalysisResult({
                floatingPop: `${totPop.toLocaleString()} 명`,
                households: `${households.toLocaleString()} 세대`,
                ageRatios: [
                  { label: '10대', ratio: r10 },
                  { label: '20대', ratio: r20 },
                  { label: '30대', ratio: r30 },
                  { label: '40대', ratio: r40 },
                  { label: '50대', ratio: r50 },
                  { label: '60대이상', ratio: r60 }
                ],
                recommendedTypes: ['1인/무인 창업', '소자본 카페', '밀키트/배달전문']
              });
              setIsLoadingApi(false);
              return;
            }
          }
        } catch (err) {
          console.warn("Seoul API fetch fallback:", err.message);
        }

        const totPopSim = Math.floor(Math.random() * 15000) + 10000;
        const houseSim = Math.floor(Math.random() * 7000) + 3000;
        setAnalysisResult({
          floatingPop: `${totPopSim.toLocaleString()} 명`,
          households: `${houseSim.toLocaleString()} 세대`,
          ageRatios: [
            { label: '10대', ratio: 12 },
            { label: '20대', ratio: 15 },
            { label: '30대', ratio: 16 },
            { label: '40대', ratio: 14 },
            { label: '50대', ratio: 17 },
            { label: '60대이상', ratio: 26 }
          ],
          recommendedTypes: ['소자본창업', '무인운영 매장', '프랜차이즈 카페']
        });
        setIsLoadingApi(false);
      };

      const circleRef = useRef(null);
      const markerRef = useRef(null);

      const drawCircleAndMarker = (latlng, mapObj) => {
        if (!mapObj || !window.kakao) return;

        if (circleRef.current) {
          circleRef.current.setMap(null);
        }
        if (markerRef.current) {
          markerRef.current.setMap(null);
        }

        // 1. 선택 위치 핀 마커 생성
        markerRef.current = new window.kakao.maps.Marker({
          position: latlng
        });
        markerRef.current.setMap(mapObj);

        // 2. 선택된 상권 반경 500m 배후지 반투명 영역 시각화
        circleRef.current = new window.kakao.maps.Circle({
          center: latlng,
          radius: 500, // 500m 배후지 표준 영역
          strokeWeight: 2,
          strokeColor: '#3b82f6',
          strokeOpacity: 0.9,
          strokeStyle: 'dashed',
          fillColor: '#60a5fa',
          fillOpacity: 0.28
        });
        circleRef.current.setMap(mapObj);
      };

      React.useEffect(() => {
        if (!window.kakao || !window.kakao.maps) return;

        window.kakao.maps.load(() => {
          const container = mapContainerRef.current;
          if (!container) return;

          const initialCenter = new window.kakao.maps.LatLng(37.5872, 126.9463);
          const options = {
            center: initialCenter,
            level: 4
          };

          const map = new window.kakao.maps.Map(container, options);
          setMapInstance(map);

          const triggerRelayout = () => {
            if (map) {
              map.relayout();
              map.setCenter(map.getCenter());
            }
          };

          requestAnimationFrame(triggerRelayout);
          setTimeout(triggerRelayout, 100);
          setTimeout(triggerRelayout, 300);
          setTimeout(triggerRelayout, 600);

          if (window.ResizeObserver && container) {
            const ro = new ResizeObserver(() => triggerRelayout());
            ro.observe(container);
          }

          window.addEventListener('resize', triggerRelayout);

          const geocoder = new window.kakao.maps.services.Geocoder();
          drawCircleAndMarker(initialCenter, map);

          window.kakao.maps.event.addListener(map, 'click', (mouseEvent) => {
            const latlng = mouseEvent.latLng;
            drawCircleAndMarker(latlng, map);

            geocoder.coord2Address(latlng.getLng(), latlng.getLat(), (result, status) => {
              if (status === window.kakao.maps.services.Status.OK) {
                const addr = result[0].road_address ? result[0].road_address.address_name : result[0].address.address_name;
                setSelectedAddress(addr);
                fetchSeoulRepopData(addr);
              }
            });
          });
        });
      }, []);

      const handleSearch = (e) => {
        e.preventDefault();
        if (!searchKeyword.trim() || !mapInstance || !window.kakao) return;

        const ps = new window.kakao.maps.services.Places();
        ps.keywordSearch(searchKeyword, (data, status) => {
          if (status === window.kakao.maps.services.Status.OK) {
            const targetPos = new window.kakao.maps.LatLng(data[0].y, data[0].x);
            mapInstance.setCenter(targetPos);
            drawCircleAndMarker(targetPos, mapInstance);
            const targetAddr = data[0].address_name || data[0].place_name;
            setSelectedAddress(targetAddr);
            fetchSeoulRepopData(targetAddr);
          } else {
            alert('검색 결과를 찾을 수 없습니다. 정확한 지역명이나 도로명을 입력해 보세요.');
          }
        });
      };

      const startDiagnosisWithLocation = () => {
        setFormData(prev => ({ ...prev, region_city: selectedAddress }));
        setView('diagnosis');
      };

      return (
        <div className="bg-slate-900 text-white rounded-3xl p-6 sm:p-10 shadow-2xl border border-slate-800 my-12">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div>

                <span className="text-emerald-400 font-extrabold text-xs tracking-wider uppercase bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">
                  카카오 지도 상권 분석
                </span>
              </div>
              <h3 className="text-xl sm:text-2xl font-black">
                📍 지도에서 원하는 위치를 클릭하고 상권을 자유롭게 확인해보세요.
              </h3>
            </div>

            <form onSubmit={handleSearch} className="flex gap-2">
              <input
                type="text"
                placeholder="예: 홍제동, 장안동, 충정로..."
                value={searchKeyword}
                onChange={(e) => setSearchKeyword(e.target.value)}
                className="bg-slate-800 border border-slate-700 text-white placeholder-slate-400 text-xs sm:text-sm px-4 py-2.5 rounded-xl focus:outline-none focus:border-emerald-500 w-48 sm:w-64"
              />
              <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm px-4 py-2.5 rounded-xl transition">
                검색

          </div>

          <div className="w-full rounded-2xl overflow-hidden shadow-lg border border-slate-700/80 h-[480px] relative">
            {/* 카카오 지도만 100% 깔끔하게 렌더링 */}
            <div ref={mapContainerRef} className="w-full h-full" />
          </div>
        </div>
      );
    }order border-slate-700/60">

    function ConsultationPage({ setView, formData, hasCompletedDiagnosis, leads, setLeads }) {
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [prefDate, setPrefDate] = useState('2026-08-05');
      const [prefSlot, setPrefSlot] = useState('오후 (14:00~17:00)');
      const [privacy, setPrivacy] = useState(false);
      const [marketing, setMarketing] = useState(false);
      const [done, setDone] = useState(false);
      const [submitting, setSubmitting] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!name || !phone || !privacy) {
          alert('필수 정보 및 개인정보 수집 동의에 체크해주세요.');
          return;
        }

        setSubmitting(true);

        const finalStartupPurpose = hasCompletedDiagnosis ? (formData.startup_purpose || '미입력') : '미입력 (바로 상담 예약)';
        const finalBudget = hasCompletedDiagnosis ? (formData.budget || '미입력') : '미입력';
        const finalRegionProvince = hasCompletedDiagnosis ? (formData.region_province || '') : '';
        const finalRegionCity = hasCompletedDiagnosis ? (formData.region_city || '미입력') : '미입력';
        const finalStartupPeriod = hasCompletedDiagnosis ? (formData.startup_period || '미입력') : '미입력';
        const finalOperationType = hasCompletedDiagnosis ? (formData.operation_type || '미입력') : '미입력';

        const newLead = {
          created_at: new Date().toISOString(),
          name,
          phone,
          startup_purpose: finalStartupPurpose,
          budget: finalBudget,
          region_province: finalRegionProvince,
          region_city: finalRegionCity,
          startup_period: finalStartupPeriod,
          operation_type: finalOperationType,
          interest_types: formData.interest_types || [],
          customer_diagnosis_score: hasCompletedDiagnosis ? 78 : 0,
          preferred_consultation_date: prefDate,
          preferred_consultation_time_slot: prefSlot,
          privacy_consent: true,
          privacy_consent_at: new Date().toISOString(),
          privacy_policy_version: SITE_CONFIG.privacyVer,
          marketing_consent: marketing,
          lead_score: hasCompletedDiagnosis ? 80 : 60,
          lead_grade: hasCompletedDiagnosis ? 'A' : 'B',
          status: '신규',
          first_utm_source: 'direct',
          referrer: document.referrer || '직접 방문'
        };

        if (firebaseDb && window.FirebaseSDK) {
          try {
            const docRef = await window.FirebaseSDK.addDoc(
              window.FirebaseSDK.collection(firebaseDb, "leads"),
              newLead
            );
            console.log("🔥 Firestore real doc added ID:", docRef.id);
            setLeads([{ id: docRef.id, ...newLead }, ...leads]);
          } catch (err) {
            console.error("Firestore save error:", err);
            setLeads([{ id: 'lead-' + Date.now(), ...newLead }, ...leads]);
          }
        } else {
          setLeads([{ id: 'lead-' + Date.now(), ...newLead }, ...leads]);
        }

        setSubmitting(false);
        setDone(true);
      };

      if (done) {
        return (
          <div className="max-w-md mx-auto px-4 py-16 text-center">
            <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">

              <h2 className="text-2xl font-bold mb-2">상담 예약 완료!</h2>
              <p className="text-slate-600 text-sm mb-6">전문 담당자가 지정하신 희망시간({prefDate} {prefSlot})에 맞춰 1:1 안내 연락을 드리겠습니다.</p>
              <button onClick={() => setView('home')} className="w-full bg-blue-600 text-white font-bold p-3.5 rounded-xl">홈으로 돌아가기</button>

            <p className="text-xs text-slate-500 mb-6">전문 컨설턴트가 1:1 맞춤 창업 상담을 도와드립니다.</p>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">성함 *</label>
                <input type="text" placeholder="홍길동" value={name} onChange={(e) => setName(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl" />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">휴대폰 번호 *</label>

              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">상담 희망일</label>

                    <option value="오전 (10:00~12:00)">오전 (10:00~12:00)</option>
                    <option value="오후 (14:00~17:00)">오후 (14:00~17:00)</option>

              <div className="bg-slate-50 p-4 rounded-xl space-y-2 border border-slate-200">
                <label className="flex items-center gap-2 text-xs font-bold cursor-pointer">
                  <input type="checkbox" checked={privacy} onChange={(e) => setPrivacy(e.target.checked)} className="w-4 h-4" />
                  <span>[필수] 개인정보 수집 및 이용 동의 ({SITE_CONFIG.privacyVer})</span>
                </label>
                <label className="flex items-center gap-2 text-xs text-slate-600 cursor-pointer">
                  <input type="checkbox" checked={marketing} onChange={(e) => setMarketing(e.target.checked)} className="w-4 h-4" />

            </form>
          </div>
        </div>
      );

    function AdminLoginPage({ setView, setAdminUser }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const handleLogin = async (e) => {
        e.preventDefault();
        setErrorMsg('');

        if (!email.trim() || !password.trim()) {
          setErrorMsg('이메일과 비밀번호를 입력해주세요.');
          return;
        }

        setLoading(true);

        if (firebaseAuth && window.FirebaseSDK) {
          try {
            const userCred = await window.FirebaseSDK.signInWithEmailAndPassword(firebaseAuth, email, password);
            localStorage.setItem('fc_admin_user', userCred.user.email);
            localStorage.setItem('fc_current_view', 'admin_dashboard');
            setAdminUser(userCred.user.email);
            setView('admin_dashboard');
            return;
          } catch (err) {
            console.error("Firebase Auth Error:", err);
            setErrorMsg('Firebase 로그인 실패: 이메일 또는 비밀번호가 올바르지 않습니다.');
            setLoading(false);
            return;
          }
        }

        localStorage.setItem('fc_admin_user', email);
        localStorage.setItem('fc_current_view', 'admin_dashboard');
        setAdminUser(email);
        setView('admin_dashboard');
      };

      return (
        <div className="max-w-md mx-auto px-4 py-20">
          <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-md">

            {errorMsg && (
              <div className="bg-rose-50 text-rose-600 border border-rose-100 p-3 rounded-xl text-xs mb-4 font-semibold">
                ⚠️ {errorMsg}
              </div>
            )}

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">이메일 계정</label>
                <input type="email" placeholder="admin@domain.com" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl text-sm" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">비밀번호</label>
                <input type="password" placeholder="••••••••" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl text-sm" />
              </div>
              <button type="submit" disabled={loading} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold p-3.5 rounded-xl shadow-md">
                {loading ? '인증 처리 중...' : 'CRM 접속하기'}
              </button>
            </form>
          </div>
        </div>
      );
    }

        `)}`;

        const defaultImg = new window.kakao.maps.MarkerImage(
          defaultSvg,
          new window.kakao.maps.Size(28, 34),
          { offset: new window.kakao.maps.Point(14, 34) }
        );

        const highlightImg = new window.kakao.maps.MarkerImage(
          highlightSvg,
          new window.kakao.maps.Size(38, 46),
          { offset: new window.kakao.maps.Point(19, 46) }
        );

        return { defaultImg, highlightImg };
      };

      // 300m 반경 내 소상공인 상가업소 조회 API 호출 및 지도 마커 렌더링
      const fetchStoresInRadius = async (lat, lng) => {
        if (!mapObjRef.current || !window.kakao) return;
        setIsLoading(true);
        setSelectedBizesId(null);

        const map = mapObjRef.current;
        const centerLatLng = new window.kakao.maps.LatLng(lat, lng);
        const { defaultImg } = getMarkerImages();

        // 1. 기존 마커 및 300m 반경 원, 맵핑 객체 초기화
        Object.values(storeMarkerMapRef.current).forEach(item => {
          if (item.marker) item.marker.setMap(null);
        });
        storeMarkerMapRef.current = {};

        if (activeInfoWindowRef.current) activeInfoWindowRef.current.close();
        if (centerMarkerRef.current) centerMarkerRef.current.setMap(null);
        if (radiusCircleRef.current) radiusCircleRef.current.setMap(null);

        // 2. 중심점 마커 표시 (붉은색 핀 마커)
        const redPinSvg = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="42" viewBox="0 0 36 42">
            <path fill="#ef4444" stroke="#ffffff" stroke-width="2.5" d="M18 0C8.059 0 0 8.059 0 18c0 13.5 18 24 18 24s18-10.5 18-24C36 8.059 27.941 0 18 0z"/>
            <circle cx="18" cy="16" r="6" fill="#ffffff"/>
          </svg>
        `)}`;

        const redMarkerImage = new window.kakao.maps.MarkerImage(
          redPinSvg,
          new window.kakao.maps.Size(36, 42),
          { offset: new window.kakao.maps.Point(18, 42) }
        );

        centerMarkerRef.current = new window.kakao.maps.Marker({
          position: centerLatLng,
          image: redMarkerImage,
          zIndex: 10
        });
        centerMarkerRef.current.setMap(map);

        // 3. 반경 300m 원(Circle) 시각화 (strokeColor: #00a0e9, strokeOpacity: 0.8, fillColor: #00a0e9, fillOpacity: 0.2)
        radiusCircleRef.current = new window.kakao.maps.Circle({
          center: centerLatLng,
          radius: 300,
          strokeWeight: 1,
          strokeColor: '#00a0e9',
          strokeOpacity: 0.9,
          strokeStyle: 'solid',
          fillColor: '#00a0e9',
          fillOpacity: 0.2
        });
        radiusCircleRef.current.setMap(map);

        // Geocoder로 현재 주소 변환
        const geocoder = new window.kakao.maps.services.Geocoder();
        geocoder.coord2Address(lng, lat, (result, status) => {
          if (status === window.kakao.maps.services.Status.OK && result[0]) {
            setCurrentAddress(result[0].address ? result[0].address.address_name : '선택 위치');
          }
        });

        // 4. 소상공인시장진흥공단 반경내 상가업소 조회 API 요청 (radius=300)
        const targetUrl = `https://apis.data.go.kr/B553077/api/open/sdsc2/storeListInRadius?radius=300&cx=${lng}&cy=${lat}&type=json&numOfRows=100&ServiceKey=${SERVICE_KEY}`;
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

        try {
          const res = await fetch(proxyUrl).catch(() => null);
          let items = [];

          if (res && res.ok) {
            const data = await res.json().catch(() => null);
            if (data && data.body && data.body.items) {
              const rawItems = Array.isArray(data.body.items) ? data.body.items : [data.body.items];
              
              // 카카오맵 Polyline을 사용하여 실제 반경 300m 이내의 상가만 필터링
              items = rawItems.filter(store => {
                const storeLat = parseFloat(store.lat);
                const storeLng = parseFloat(store.lon);
                if (!storeLat || !storeLng) return false;
                const storePos = new window.kakao.maps.LatLng(storeLat, storeLng);
                const poly = new window.kakao.maps.Polyline({
                  path: [centerLatLng, storePos]
                });
                return poly.getLength() <= 300;
              });
            }
          }

          setStoreCount(items.length);

          // 5. 업종 대분류(indsLclsNm) 기준 데이터 그룹화
          const groups = items.reduce((acc, store) => {
            const cat = store.indsLclsNm || '기타 서비스';
            if (!acc[cat]) acc[cat] = [];
            acc[cat].push(store);
            return acc;
          }, {});

          setGroupedStores(groups);
          setCollapsedCategories({});

          // 6. 상가업소 마커 렌더링 및 markerMapRef 맵핑
          items.forEach(store => {
            const storeLat = parseFloat(store.lat);
            const storeLng = parseFloat(store.lon);
            const bId = store.bizesId || `store_${Math.random()}`;

            if (!storeLat || !storeLng) return;

            const storePos = new window.kakao.maps.LatLng(storeLat, storeLng);
            const storeMarker = new window.kakao.maps.Marker({
              position: storePos,
              image: defaultImg,
              map: map
            });

            const contentHtml = `
              <div style="padding: 12px; min-width: 200px; font-family: 'Pretendard', sans-serif; background: #ffffff; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);">
                <div style="font-weight: 800; font-size: 13px; color: #0f172a; margin-bottom: 4px; line-height: 1.3;">
                  🏢 ${store.bizesNm || '상가업소'}
                </div>
                <div style="display: inline-block; font-size: 10px; font-weight: 700; color: #2563eb; background: #eff6ff; padding: 2px 6px; border-radius: 4px; margin-bottom: 6px;">
                  ${store.indsLclsNm || ''} > ${store.indsSclsNm || store.indsMclsNm || '업종'}
                </div>
                <div style="font-size: 11px; color: #64748b; line-height: 1.4;">
                  📍 ${store.rdnmAdr || store.lnoAdr || '주소 정보 없음'}
                </div>
              </div>
            `;

            const infowindow = new window.kakao.maps.InfoWindow({
              content: contentHtml,
              removable: true
            });

            // 마커 맵핑 저장
            storeMarkerMapRef.current[bId] = {
              marker: storeMarker,
              infowindow: infowindow,
              store: store
            };

            // 마커 클릭 이벤트: 해당 리포트 하이라이트
            window.kakao.maps.event.addListener(storeMarker, 'click', () => {
              highlightStoreMarker(bId);
            });
          });
        } catch (err) {
          console.warn("storeListInRadius fetch warning:", err);
        } finally {
          setIsLoading(false);
        }
      };

      // 리스트 항목 클릭 시 마커 하이라이트 & 지도 이동 & 인포윈도우 오픈
      const highlightStoreMarker = (bizesId) => {
        if (!mapObjRef.current || !window.kakao) return;
        const map = mapObjRef.current;
        const { defaultImg, highlightImg } = getMarkerImages();

        // 1. 모든 마커 이미지 기본 초기화
        Object.values(storeMarkerMapRef.current).forEach(item => {
          if (item.marker && defaultImg) {
            item.marker.setImage(defaultImg);
            item.marker.setZIndex(1);
          }
        });

        if (activeInfoWindowRef.current) {
          activeInfoWindowRef.current.close();
        }

        // 2. 선택된 상가 마커 하이라이트
        const targetItem = storeMarkerMapRef.current[bizesId];
        if (targetItem && targetItem.marker) {
          if (highlightImg) {
            targetItem.marker.setImage(highlightImg);
            targetItem.marker.setZIndex(20);
          }
          
          map.panTo(targetItem.marker.getPosition());
          targetItem.infowindow.open(map, targetItem.marker);
          activeInfoWindowRef.current = targetItem.infowindow;
          setSelectedBizesId(bizesId);

          if (targetItem.store) {
            const cat = targetItem.store.indsLclsNm || '기타 서비스';
            setCollapsedCategories(prev => ({ ...prev, [cat]: false }));
          }
        }
      };

      useEffect(() => {
        const initMap = () => {
          if (!window.kakao || !window.kakao.maps || !mapContainerRef.current) return;

          window.kakao.maps.load(() => {
            const container = mapContainerRef.current;
            if (!container) return;

            const initialLat = 37.5665;
            const initialLng = 126.9780;
            const centerPos = new window.kakao.maps.LatLng(initialLat, initialLng);

            if (!mapObjRef.current) {
              const options = { center: centerPos, level: 4 };
              mapObjRef.current = new window.kakao.maps.Map(container, options);
            } else {
              mapObjRef.current.relayout();
              mapObjRef.current.setCenter(centerPos);
            }

            // 초기 300m 상가업소 조회
            fetchStoresInRadius(initialLat, initialLng);

            const triggerRelayout = () => {
              if (mapObjRef.current) {
                mapObjRef.current.relayout();
              }
            };

            requestAnimationFrame(triggerRelayout);
            setTimeout(triggerRelayout, 100);
            setTimeout(triggerRelayout, 300);

            if (window.ResizeObserver && mapContainerRef.current) {
              const ro = new ResizeObserver(() => triggerRelayout());
              ro.observe(mapContainerRef.current);
            }

            window.addEventListener('resize', triggerRelayout);

            // 지도 클릭 이벤트: 중심점 이동 및 300m 상가 조회
            window.kakao.maps.event.addListener(mapObjRef.current, 'click', (mouseEvent) => {
              const latlng = mouseEvent.latLng;
              mapObjRef.current.panTo(latlng);
              fetchStoresInRadius(latlng.getLat(), latlng.getLng());
            });
          });
        };

        if (window.kakao && window.kakao.maps) {
          initMap();
        } else {
          const timer = setInterval(() => {
            if (window.kakao && window.kakao.maps) {
              clearInterval(timer);
              initMap();
            }
          }, 300);
          return () => clearInterval(timer);
        }
      }, []);

      const handleSearchSubmit = (e) => {
        e.preventDefault();
        if (!searchKeyword.trim() || !mapObjRef.current || !window.kakao) return;

        const ps = new window.kakao.maps.services.Places();
        ps.keywordSearch(searchKeyword, (data, status) => {
          if (status === window.kakao.maps.services.Status.OK && data[0]) {
            const targetLat = parseFloat(data[0].y);
            const targetLng = parseFloat(data[0].x);
            const targetPos = new window.kakao.maps.LatLng(targetLat, targetLng);
            
            mapObjRef.current.panTo(targetPos);
            fetchStoresInRadius(targetLat, targetLng);
          } else {
            alert('검색한 위치를 찾을 수 없습니다.');
          }
        });
      };

      return (
        <div className="bg-slate-900 text-white min-h-screen flex flex-col relative overflow-hidden">
          <AdminNav setView={setView} currentView="admin_seoul_cmrcl" adminUser={adminUser} refreshLeads={refreshLeads} handleLogout={handleLogout} />
          
          <div className="flex-1 w-full relative">
            {/* 좌측 패널: 위치 검색 + 반경 300m 시각화 + 업종 대분류 상가 스크롤 리스트 */}
            <div className="absolute top-4 left-4 z-10 w-80 sm:w-96 bg-slate-900/95 border border-slate-700/90 backdrop-blur-xl rounded-2xl shadow-2xl p-4 text-white space-y-3.5 max-h-[calc(100vh-80px)] flex flex-col">
              
              {/* 상단 위치 검색 폼 */}
              <form onSubmit={handleSearchSubmit} className="flex gap-2 flex-shrink-0">
                <input
                  type="text"
                  value={searchKeyword}
                  onChange={(e) => setSearchKeyword(e.target.value)}
                  placeholder="위치/주소 검색 (예: 강남역, 명동)"
                  className="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs font-medium text-white placeholder-slate-400 focus:outline-none focus:border-blue-500"
                />
                <button
                  type="submit"
                  disabled={isLoading}
                  className="bg-blue-600 hover:bg-blue-500 font-extrabold text-xs px-3 py-2 rounded-xl transition flex items-center gap-1 shadow-md whitespace-nowrap"
                >
                  {isLoading ? '⏳' : '🔍'} 검색
                </button>
              </form>

              {/* 반경 300m 요약 카드 */}
              <div className="bg-slate-800/90 rounded-xl p-3 border border-slate-700/80 space-y-1.5 text-xs flex-shrink-0">
                <div className="flex justify-between items-center">
                  <span className="text-[11px] font-bold text-slate-400">📍 중심 위치</span>
                  <span className="text-xs font-black text-emerald-400 truncate max-w-[190px]">{currentAddress}</span>
                </div>
                <div className="flex justify-between items-center pt-1 border-t border-slate-700/60">
                  <span className="text-[11px] font-bold text-blue-300">⭕ 반경: <strong className="text-sky-400">300m</strong></span>
                  <span className="text-xs font-black text-amber-400 bg-amber-950/80 px-2 py-0.5 rounded-full border border-amber-700/80">
                    🏪 상가업소: <strong>{storeCount}개</strong>
                  </span>
                </div>
              </div>

              {/* 업종 대분류 그룹별 상가 스크롤 목록 */}
              <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1">
                {isLoading ? (
                  <div className="py-8 text-center text-xs text-slate-400 space-y-2">
                    <div className="animate-spin text-lg">⏳</div>
                    <p>반경 300m 상가업소를 불러오는 중...</p>
                  </div>
                ) : Object.keys(groupedStores).length === 0 ? (
                  <div className="py-8 text-center text-xs text-slate-400">
                    반경 300m 이내에 검색된 상가가 없습니다.
                  </div>
                ) : (
                  <>
                    {/* 전체 펼치기 / 접기 버튼 Bar */}
                    <div className="flex justify-between items-center pb-1 text-[11px] text-slate-400 border-b border-slate-700/50 mb-2">
                      <span className="font-bold text-slate-300">업종 분류 ({Object.keys(groupedStores).length}개)</span>
                      <div className="flex gap-2 text-[10px]">
                        <button
                          type="button"
                          onClick={expandAllCategories}
                          className="text-blue-400 hover:text-blue-300 transition cursor-pointer font-bold"
                        >
                          📂 전체 펼치기
                        </button>
                        <span className="text-slate-600">|</span>
                        <button
                          type="button"
                          onClick={collapseAllCategories}
                          className="text-slate-400 hover:text-amber-300 transition cursor-pointer font-bold"
                        >
                          📁 전체 접기
                        </button>
                      </div>
                    </div>

                    {Object.entries(groupedStores).map(([category, stores]) => {
                      const isCollapsed = !!collapsedCategories[category];

                      return (
                        <div key={category} className="space-y-1">
                          {/* 대분류 카테고리 헤더 (클릭 시 접기/펼치기) */}
                          <div
                            onClick={() => toggleCategory(category)}
                            className="flex justify-between items-center sticky top-0 bg-slate-800/95 py-1.5 px-2.5 rounded-xl border-l-4 border-blue-500 backdrop-blur-md cursor-pointer hover:bg-slate-700/90 transition select-none shadow-sm"
                          >
                            <div className="flex items-center gap-1.5 min-w-0">
                              <span className={`text-[10px] text-blue-400 transition-transform duration-200 inline-block ${isCollapsed ? '' : 'rotate-90'}`}>
                                ▶
                              </span>
                              <span className="text-xs font-black text-blue-200 truncate">
                                📁 {category}
                              </span>
                            </div>
                            <span className="text-[10px] bg-slate-900 text-slate-300 font-bold px-2 py-0.5 rounded-full border border-slate-700/80 flex-shrink-0">
                              {stores.length}개
                            </span>
                          </div>

                          {/* 세부 상가 아이템 리스트 (펼침 상태일 때만 렌더링) */}
                          {!isCollapsed && (
                            <ul className="space-y-1 pl-1 pt-0.5">
                              {stores.map((store) => {
                                const bId = store.bizesId || `store_${Math.random()}`;
                                const isSelected = selectedBizesId === bId;

                                return (
                                  <li
                                    key={bId}
                                    data-id={bId}
                                    onClick={() => highlightStoreMarker(bId)}
                                    className={`p-2.5 rounded-xl border transition cursor-pointer text-xs ${
                                      isSelected
                                        ? 'bg-amber-500/20 border-amber-400 text-amber-200 shadow-md ring-1 ring-amber-400'
                                        : 'bg-slate-800/50 border-slate-700/60 hover:bg-slate-800 hover:border-slate-600 text-slate-200'
                                    }`}
                                  >
                                    <div className="flex justify-between items-start mb-0.5">
                                      <strong className="font-extrabold text-white text-xs truncate max-w-[200px]">
                                        {store.bizesNm}
                                      </strong>
                                      <span className="text-[10px] text-blue-400 font-bold bg-blue-950/60 px-1.5 py-0.5 rounded border border-blue-800/50">
                                        {store.indsSclsNm || '업종'}
                                      </span>
                                    </div>
                                    <p className="text-[10px] text-slate-400 truncate">
                                      📍 {store.rdnmAdr || store.lnoAdr || '주소 미상'}
                                    </p>
                                  </li>
                                );
                              })}
                            </ul>
                          )}
                        </div>
                      );
                    })}
                  </>
                )}
              </div>

              <div className="text-[9px] text-slate-400 text-center pt-1 border-t border-slate-800 flex-shrink-0">
                💡 목록 클릭 시 해당 마커로 지도 이동 및 황금색 핀 하이라이트 표시
              </div>
            </div>

            {/* Kakao Map 지도 영역 100% */}
            <div ref={mapContainerRef} className="w-full h-[calc(100vh-64px)] z-0" />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
